statement: |
  Suppose $A$ is a square matrix with all entries strictly positive. Which statement most completely captures what the Perron-Frobenius theorem guarantees about the eigenstructure of $A$?
choices:
- label: A
  text: The spectral radius $\rho(A)$ is itself an eigenvalue of $A$.
- label: B
  text: There is a real positive eigenvalue, strictly greater in magnitude than every other eigenvalue,
    with a corresponding eigenvector having all strictly positive entries.
- label: C
  text: The largest magnitude eigenvalue is dominant.
- label: D
  text: There exists an eigenvector of $A$ with all strictly positive entries.
- label: E
  text: All eigenvalues of $A$ are real and positive.
figures: []
answer:
  correct: B
  partial_credit: []
