statement: |
  Consider a network of six computer servers. The graph Laplacian matrix $L = D - A$ (where $D$ is the degree matrix and $A$ is the adjacency matrix) is computed and found to have eigenvalues:
  $$\lambda_1 = 0, \quad \lambda_2 = 0, \quad \lambda_3 = 2, \quad \lambda_4 = 3, \quad \lambda_5 = 4, \quad \lambda_6 = 5$$

  A network engineer needs to understand the topology. What can be concluded from this eigenvalue information?
choices:
- label: A
  text: The network is fully connected since all servers are represented in the Laplacian
- label: B
  text: The presence of $\lambda = 2$ indicates exactly two servers are isolated from the rest
- label: C
  text: Exactly two eigenvalues equal zero, indicating a computational error since graph Laplacians should
    have only one zero eigenvalue
- label: D
  text: The network consists of exactly two separate connected components
- label: E
  text: The network has six connected components, one for each eigenvalue
figures: []
answer:
  correct: D
  partial_credit: []
