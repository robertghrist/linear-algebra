statement: |
  A centered data matrix $X \in \mathbb{R}^{100 \times 3}$ represents 100 observations of three variables. The matrix $X^TX$ has eigenvalues:
  $$\lambda_1 = 1600, \quad \lambda_2 = 400, \quad \lambda_3 = 100$$

  Consider the linear transformation $T: \mathbb{R}^3 \to \mathbb{R}^{100}$ defined by $T(\mathbf{v}) = X\mathbf{v}$. This transformation maps the unit sphere in $\mathbb{R}^3$ to an ellipsoid in $\mathbb{R}^{100}$.

  Which statement correctly relates the SVD geometry to the PCA variance structure?
choices:
- label: A
  text: The ellipsoid has semi-axis lengths 1600, 400, and 100, which equal the variances along the three
    principal component directions.
- label: B
  text: The ellipsoid has semi-axis lengths 40, 20, and 10, which equal the variances along the three
    principal component directions.
- label: C
  text: The ellipsoid semi-axes have lengths in ratio 4:2:1, while the principal component variances have
    ratio 16:4:1.
- label: D
  text: The ellipsoid semi-axes have lengths in ratio 4:2:1, and the principal component variances have
    the same ratio 4:2:1.
- label: E
  text: The ellipsoid lies in a 3-dimensional subspace of $\mathbb{R}^{100}$, but the semi-axis lengths
    and PC variances are unrelated quantities.
