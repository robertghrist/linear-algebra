  conflict: null
  explanation: |
    The defining property of the adjoint is $\langle D(p), q \rangle = \langle p, D^*(q) \rangle$ for all $p$ in the domain and $q$ in the codomain. With our inner product, this becomes $\int_0^1 p'(x)q(x)dx = \int_0^1 p(x)(D^*(q))(x)dx$. Option B correctly states this fundamental relationship. Note that D* is NOT simply the antiderivative due to boundary terms from integration by parts.
  key_insight: |
    The adjoint relationship is the fundamental definition—everything else follows from it.
