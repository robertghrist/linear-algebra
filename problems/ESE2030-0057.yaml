statement: |
  Let $A$ be a nonsingular matrix. Which statement best represents the relationship between the pseudoinverse $A^{\dagger}$ and the inverse $A^{-1}$?
choices:
- label: A
  text: $A^{\dagger} = A^{-1}$
- label: B
  text: $A^{\dagger} = (A^{-1})^T$
- label: C
  text: $A^{\dagger} = (A^T)^{-1}$
- label: D
  text: $A^{\dagger}A^{-1} = I$
- label: E
  text: $A^{\dagger}$ is undefined if $A^{-1}$ does not exist
figures: []
answer:
  correct: A
  partial_credit: []
  verified: true
  verified_from:
  - quizzes-exams/2025-C/2030-Q3-ANSWERS.tex
