  conflict: null
  explanation: |
    When $A$ is square and nonsingular, the pseudoinverse coincides exactly with the inverse: $A^{\dagger} = A^{-1}$. This can be verified through the formula for full column rank: $A^{\dagger} = (A^TA)^{-1}A^T$. For square nonsingular $A$, we have $(A^TA)^{-1}A^T = [(A^T)^{-1}A^{-1}]A^T = (A^T)^{-1}(A^{-1}A^T) = (A^T)^{-1}A^T A^{-1} = A^{-1}$. Geometrically, when $A$ is an isomorphism, there's no need for "pseudo" behavior—the true inverse captures all the structure the pseudoinverse would provide. The pseudoinverse generalizes the inverse to rectangular and singular matrices, but reduces to the ordinary inverse in the nonsingular square case.
  key_insight: null
  distractor_rationale:
    B: |
      incorrectly involves transpose; perhaps confused with properties of orthogonal matrices or adjoint
    C: |
      conflates the inverse and transpose operations; students might think pseudoinverse has something to do with transpose since the formula involves $A^T$
    D: |
      recognizes that the product equals identity but incorrectly believes they must be different matrices; fails to see that having $A^{\dagger}A^{-1} = I$ combined with both being square means they must be equal
    E: |
      fundamentally misunderstands the relationship; thinks pseudoinverse only applies to non-invertible cases
