statement: |
  In the probability inner product, a random variable decomposes as $f = \mathbb{E}(f)\,\mathbf{1} + \hat f$ with the two pieces orthogonal. Which of the following identities is the Pythagorean theorem applied to this decomposition?
choices:
- label: A
  text: $\mathbb{E}(f^2) = \mathbb{E}(f)^2 + \mathbb{V}(f)$
- label: B
  text: $\mathbb{V}(f+g) = \mathbb{V}(f) + \mathbb{V}(g) + 2\operatorname{cov}(f,g)$
- label: C
  text: $\mathbb{E}(f+g) = \mathbb{E}(f) + \mathbb{E}(g)$
- label: D
  text: $\operatorname{corr}(f,g) = \operatorname{cov}(f,g)\,/\,\sigma(f)\sigma(g)$
- label: E
  text: $\mathbb{P}(A \cap B) = \langle \mathbf{1}_A, \mathbf{1}_B\rangle_\rho$
figures: []
answer:
  correct: A
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Pythagoras for the orthogonal pieces reads $\norm{f}_\rho^2 = \norm{\mathbb{E}(f)\mathbf{1}}_\rho^2 + \norm{\hat f}_\rho^2$. The three norms are $\mathbb{E}(f^2)$, $\mathbb{E}(f)^2$ (because $\norm{\mathbf{1}}_\rho = 1$), and $\mathbb{V}(f)$. Choice (B) is the law of cosines --- Pythagoras only when the residuals are orthogonal, i.e. when the covariance term vanishes.
  key_insight: null
  distractor_rationale:
    B: |
      Trick: the law of cosines for $\hat f + \hat g$; it reduces to Pythagoras only when $\operatorname{cov}(f,g) = 0$. A student who remembers 'variances add' as Pythagoras lands here.
    C: |
      Distractor: linearity of the inner product, not a statement about lengths.
    D: |
      Distractor: the definition of the cosine of an angle, not a length identity.
    E: |
      Distractor: probabilities as inner products of indicators --- true, but not Pythagoras.
