statement: |
  Let $\mathbf{z} \in \mathbb{R}^N$ have a unique largest coordinate, in position $j$, and consider $\operatorname{softmax}(t\mathbf{z})$ as the scale $t > 0$ varies. What are the limits as $t \to \infty$ and as $t \to 0^+$, respectively?
choices:
- label: A
  text: $\mathbf{e}_j$ and $\tfrac{1}{N}\mathbf{1}$
- label: B
  text: $\mathbf{e}_j$ and $\mathbf{0}$
- label: C
  text: $\mathbf{z}\,/\,\textstyle\sum_i z_i$ and $\tfrac{1}{N}\mathbf{1}$
- label: D
  text: $\tfrac{1}{N}\mathbf{1}$ and $\mathbf{e}_j$
- label: E
  text: $\mathbf{e}_j$, attained exactly for all $t$ large enough, and $\tfrac{1}{N}\mathbf{1}$
figures: []
answer:
  correct: A
  partial_credit:
  - E
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Stretching the scores drives the largest exponential to dominate, so the output approaches the vertex $\mathbf{e}_j$ --- but never reaches it, since every entry of a softmax is strictly positive. Shrinking the scores makes all exponentials tend to $1$, so the output flattens to the uniform density at the centre of the simplex. $\mathbf{0}$ is not in the simplex at all.
  key_insight: null
  distractor_rationale:
    B: |
      Trick: $\mathbf{0}$ is not a density; softmax never leaves the simplex.
    C: |
      Trick: normalizing by the sum is not softmax and can fail (negative or zero-sum scores); softmax normalizes the EXPONENTIALS.
    D: |
      Distractor: the two limits reversed.
    E: |
      Partial credit: both limits right, but claims the vertex is attained. Insight 1 of 2 (the limits); missing: softmax lands in the relative interior --- certainty lies at infinity. Prefix: yes. Guessable: no. Defensible: yes.
