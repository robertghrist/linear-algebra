statement: |
  The diagram below is an abstract representation of the SVD of a linear transformation $M$, with five regions labeled (A) through (E). Which region best represents the {\em coimage} of the transformation? (choose (A) - (E))
choices:
- label: A
  text: 'Region A: shaded first $r$ columns of $U$.'
- label: B
  text: 'Region B: unshaded last $m - r$ columns of $U$.'
- label: C
  text: 'Region C: the diagonal $\Sigma$ block.'
- label: D
  text: 'Region D: shaded first $r$ rows of $V^T$.'
- label: E
  text: 'Region E: unshaded last $n - r$ rows of $V^T$.'
