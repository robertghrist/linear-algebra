  conflict: null
  explanation: |
    The coimage $\mathrm{coim}(M) = \mathbb{R}^n / \ker(M)$ is naturally represented in the domain by $\ker(M)^\perp$, which is spanned by the first $r$ right singular vectors $\mathbf{v}_1, \ldots, \mathbf{v}_r$. The rows of $V^T$ are exactly the $\mathbf{v}_i^T$, so the first $r$ rows of $V^T$ --- region D --- house the right singular vectors that span the coimage representative. FTLA spine: $\mathrm{coim}(M) \cong \mathrm{im}(M)$, so regions D (in the domain) and A (in the codomain) describe naturally isomorphic spaces. But the \emph{coimage itself lives in the domain}, where $V$ acts --- hence D, not A.
  key_insight: null
  distractor_rationale:
    A: |
      recognizes the rank-$r$ shaded structure and the FTLA isomorphism $\mathrm{coim} \cong \mathrm{im}$, but places coimage on the codomain side (partial credit)
    B: |
      unshaded columns of $U$ span $\ker(M^T) = \mathrm{im}(M)^\perp$, the natural representative of the \emph{cokernel}. Confuses coimage (domain side) with cokernel (codomain side).
    C: |
      the $\Sigma$ block holds the singular values --- stretching factors, not a subspace
    E: |
      the last $n - r$ rows of $V^T$ span $\ker(M)$ --- the orthogonal complement of the coimage representative. Classic kernel-vs-coimage swap.
