statement: |
  Let $V$ be a 4-dimensional inner product space with orthonormal basis $B = \{\mathbf{v}_1, \mathbf{v}_2, \mathbf{v}_3, \mathbf{v}_4\}$.
  For the vector $\mathbf{w} = 3\mathbf{v}_1 - 2\mathbf{v}_2 + \mathbf{v}_3 - 4\mathbf{v}_4$, which expression gives $\|\mathbf{w}\|^2$?
choices:
- label: A
  text: $3^2 + (-2)^2 + 1^2 + (-4)^2 = 30$
- label: B
  text: $3 + 2 + 1 + 4 = 10$
- label: C
  text: $|3| + |-2| + |1| + |-4| = 10$
- label: D
  text: $(3 - 2 + 1 - 4)^2 = 4$
- label: E
  text: $(|3| + |-2| + |1| + |-4|)^2 = 100$
figures: []
answer:
  correct: A
  partial_credit: []
  verified: true
  verified_from:
  - quizzes-exams/2025-C/2030-Q2-ANSWERS.tex
  - quizzes-exams/2025-C/2030-Q2.tex
  conflict: null
  explanation: |
    Since $B$ is orthonormal, $\|\mathbf{w}\|^2 = \langle \mathbf{w}, \mathbf{w} \rangle = 3^2\|\mathbf{v}_1\|^2 + (-2)^2\|\mathbf{v}_2\|^2 + 1^2\|\mathbf{v}_3\|^2 + (-4)^2\|\mathbf{v}_4\|^2 = 9 + 4 + 1 + 16 = 30$.
  key_insight: |
    With orthonormal bases, the norm squared equals the sum of squared coefficients.
