statement: |
  In $\mathbb{R}^4$, let $\mathbf{v}_1, \mathbf{v}_2, \mathbf{v}_3$ be linearly independent vectors. Define $\mathbf{w}_1 = \mathbf{v}_1 + \mathbf{v}_2$, $\mathbf{w}_2 = \mathbf{v}_2 + \mathbf{v}_3$, and $\mathbf{w}_3 = \mathbf{v}_3 + \mathbf{v}_1$. Which statement is TRUE?
choices:
- label: A
  text: $\{\mathbf{w}_1, \mathbf{w}_2, \mathbf{w}_3\}$ is always linearly independent.
- label: B
  text: $\{\mathbf{w}_1, \mathbf{w}_2, \mathbf{w}_3\}$ is always linearly dependent.
- label: C
  text: $\{\mathbf{w}_1, \mathbf{w}_2, \mathbf{w}_3\}$ is linearly independent if and only if $\mathbf{v}_1
    + \mathbf{v}_2 + \mathbf{v}_3 \neq \mathbf{0}$.
- label: D
  text: $\{\mathbf{w}_1, \mathbf{w}_2, \mathbf{w}_3\}$ spans $\mathbb{R}^4$.
- label: E
  text: None of the above.
figures: []
answer:
  correct: A
  partial_credit: []
  verified: true
