  conflict: null
  explanation: |
    Suppose $a\mathbf{w}_1 + b\mathbf{w}_2 + c\mathbf{w}_3 = \mathbf{0}$. Substituting: $$a(\mathbf{v}_1 + \mathbf{v}_2) + b(\mathbf{v}_2 + \mathbf{v}_3) + c(\mathbf{v}_3 + \mathbf{v}_1) = \mathbf{0}$$ $$(a+c)\mathbf{v}_1 + (a+b)\mathbf{v}_2 + (b+c)\mathbf{v}_3 = \mathbf{0}$$ Since $\mathbf{v}_1, \mathbf{v}_2, \mathbf{v}_3$ are linearly independent, we need $a+c = 0$, $a+b = 0$, and $b+c = 0$. From the first two: $c = -a$ and $b = -a$. Substituting into the third: $-a + (-a) = -2a = 0$, so $a = 0$. Thus $a = b = c = 0$, proving linear independence.
  key_insight: null
  distractor_rationale:
    B: |
      students may guess dependence because $\mathbf{w}_1 + \mathbf{w}_2 + \mathbf{w}_3 = 2(\mathbf{v}_1 + \mathbf{v}_2 + \mathbf{v}_3)$, but this sum being nonzero doesn't create dependence
    C: |
      the sum $\mathbf{v}_1 + \mathbf{v}_2 + \mathbf{v}_3$ is irrelevant to independence of the $\mathbf{w}$'s
    D: |
      three vectors cannot span $\mathbb{R}^4$
    E: |
      there is a definitive answer
