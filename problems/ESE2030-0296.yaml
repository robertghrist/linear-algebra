statement: |
  Linearity of expectation, $\mathbb{E}(f+g) = \mathbb{E}(f) + \mathbb{E}(g)$, holds for every pair of random variables on the same outcomes. What is the reason?
choices:
- label: A
  text: $\mathbb{E}(f) = \langle f, \mathbf{1}\rangle_\rho$, and an inner product is linear in each argument
- label: B
  text: $f$ and $g$ are assumed independent
- label: C
  text: $\sum_i \rho_i = 1$
- label: D
  text: $\mathbb{E}(fg) = \mathbb{E}(f)\,\mathbb{E}(g)$
- label: E
  text: $\mathbb{V}(f+g) = \mathbb{V}(f) + \mathbb{V}(g)$
figures: []
answer:
  correct: A
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Expectation is the inner product with the fixed vector $\mathbf{1}$ --- equivalently the coefficient of a projection --- and inner products and projections are linear. No hypothesis on the joint behaviour of $f$ and $g$ enters. Independence (B) is the standard false belief: it is needed for $\mathbb{E}(fg) = \mathbb{E}(f)\mathbb{E}(g)$, never for additivity.
  key_insight: null
  distractor_rationale:
    B: |
      Trick: the listed Week 12 trap --- believing linearity of expectation requires independence.
    C: |
      Distractor: unit mass makes $\mathbf{1}$ a unit vector; it does not make the pairing linear.
    D: |
      Distractor: multiplicativity, which DOES require independence (or at least uncorrelatedness); a different statement.
    E: |
      Distractor: additivity of variance, which holds only for orthogonal residuals.
