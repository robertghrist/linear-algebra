statement: |
  A data matrix $X \in \mathbb{R}^{n \times d}$ has $n$ observations of $d$ features
  arranged in columns $\mathbf{x}_1, \ldots, \mathbf{x}_d \in \mathbb{R}^n$, each
  centered to have sample mean zero. Let $\rho_{ij}$ denote the Pearson correlation
  coefficient between features $i$ and $j$. Which of the following best describes
  the geometric meaning of $\rho_{ij}$?
choices:
- label: A
  text: $\rho_{ij}$ is the cosine of the angle between $\mathbf{x}_i$ and $\mathbf{x}_j$, viewed as vectors
    in $\mathbb{R}^n$.
- label: B
  text: $\rho_{ij}$ is the length of the projection of $\mathbf{x}_i$ onto $\mathbf{x}_j$.
- label: C
  text: $\rho_{ij}$ is the cosine of the angle between the $i$th and $j$th rows of $X$, viewed as vectors
    in $\mathbb{R}^d$.
- label: D
  text: $\rho_{ij}$ is the cosine of the angle between $\mathbf{x}_i$ and $\mathbf{x}_j$ only after both
    have been further rescaled to have unit norm.
- label: E
  text: $\rho_{ij}$ equals the inner product $\langle \mathbf{x}_i, \mathbf{x}_j \rangle$ scaled by the
    number of observations.
figures: []
answer:
  correct: A
  partial_credit: []
