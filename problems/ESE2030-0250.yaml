  explanation: |
    The largest singular value $\sigma_1$ is \emph{defined} by the extremal property $$ \sigma_1 \;=\; \max_{\|\mathbf{x}\| = 1} \|A\mathbf{x}\|, $$ with the maximum attained at $\mathbf{x} = \mathbf{v}_1$, the first right singular vector. Geometrically: $A$ maps the unit sphere in $\mathbb{R}^3$ to an ellipsoid in $\mathbb{R}^4$ whose longest semi-axis has length $\sigma_1 = 6$. So the answer is $6$. This quantity is the \textbf{operator 2-norm} $\|A\|_2 = \sigma_1$. It is fundamentally different from the Frobenius norm $\|A\|_F = \sqrt{\sum \sigma_i^2}$: the operator norm is the \emph{worst-case stretching} of a single unit vector, while the Frobenius norm aggregates over all stretching directions.
  key_insight: null
  distractor_rationale:
    A: |
      (D3 correct-structure-wrong-detail: the student computed $\|A\|_F = \sqrt{36 + 9 + 4} = 7$ correctly, but Frobenius is the wrong norm for ``maximum of $\|A\mathbf{x}\|$ over unit $\mathbf{x}$''.
    B: |
      (D6 shape-implies-property: confuses $\sigma_1$ with $\sigma_1^2$, the largest eigenvalue of $A^T A$; the eigenvalue of $A^T A$ tells you $\|A\mathbf{x}\|^2$, not $\|A\mathbf{x}\|$).
    C: |
      (D5 naive-prior: just adds the singular values, $6 + 3 + 2 = 11$; treats them as if they combine additively for a single input vector).
    E: |
      (D4 surface match: $U$ and $V$ are needed to find the maximizing vector $\mathbf{v}_1$, but they are not needed to know the maximum \emph{value} --- that depends only on $\sigma_1$. The singular values alone determine the operator norm).
