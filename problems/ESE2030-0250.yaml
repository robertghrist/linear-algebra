statement: |
  A matrix $A \in \mathbb{R}^{4 \times 3}$ has singular values $\sigma_1 = 6$, $\sigma_2 = 3$, $\sigma_3 = 2$.
  Over all unit vectors $\mathbf{x} \in \mathbb{R}^3$, what is the largest possible value of $\|A\mathbf{x}\|$?
choices:
- label: A
  text: $\sqrt{6^2 + 3^2 + 2^2} = 7$
- label: B
  text: $36$
- label: C
  text: $11$
- label: D
  text: $6$
- label: E
  text: Cannot be determined from the information given.
figures: []
answer:
  correct: D
  partial_credit: []
