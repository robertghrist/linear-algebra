statement: |
  A million points in $\mathbb{R}^{5000}$ must be reduced to a low dimension. All that is needed downstream is every pairwise distance, to within a few percent, and the reduction map must be chosen \emph{before} the data are seen. Which method, with which guarantee?
choices:
- label: A
  text: Random projection to $\mathbb{R}^k$, $k \propto \ln m / \epsilon^2$; every pairwise squared distance
    within a factor $1 \pm \epsilon$, with high probability
- label: B
  text: PCA to the top $k$ components, $k$ = effective rank; every pairwise distance preserved exactly
- label: C
  text: Random projection to $\mathbb{R}^k$, $k \propto \ln m / \epsilon^2$; every coordinate of every
    point within $\epsilon$
- label: D
  text: Random projection to $\mathbb{R}^k$, $k \propto n / \epsilon^2$; every pairwise squared distance
    within a factor $1 \pm \epsilon$, with high probability
- label: E
  text: PCA to the top $k$ components, $k$ = effective rank; the rank-$k$ reconstruction error minimized
figures: []
answer:
  correct: A
  partial_credit:
  - D
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Johnson-Lindenstrauss: a random projection to $k \geq 36\ln m/\epsilon^2$ dimensions preserves every pairwise squared distance to relative error $\epsilon$ with probability at least $1 - 1/m$, for ANY cloud, and the matrix is drawn without a glance at the data. The target dimension depends on the number of points and the tolerance, never on the ambient dimension $5000$. PCA is the adaptive tool: it must look first, and it optimizes reconstruction, not pairwise distances.
  key_insight: null
  distractor_rationale:
    B: |
      Trick: PCA preserves distances only along the retained subspace; for a structureless cloud it guarantees nothing about pairwise distances, and it must see the data.
    C: |
      Trick: random projection preserves distances, not coordinates --- the coordinates of $\Phi\mathbf{x}$ mean nothing one at a time (listed trap).
    D: |
      Partial credit: right tool and right guarantee, but makes $k$ depend on the ambient dimension. Insight 1 of 2 (JL preserves pairwise squared distances obliviously); missing: $k$ depends on $m$ and $\epsilon$ only (listed trap). Prefix: yes. Guessable: no. Defensible: yes.
    E: |
      Distractor: a true statement about PCA (Eckart-Young) that answers a different goal, and requires seeing the data.
