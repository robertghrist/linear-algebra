statement: |
  A matrix $A \in \mathbb{R}^{m \times n}$ has SVD with singular values
  $\sigma_1 \geq \sigma_2 \geq \cdots \geq \sigma_r > 0$.
  Which quantity equals $\|A\|_F^2$?
choices:
- label: A
  text: $r \cdot \sigma_1^2$
- label: B
  text: $\sigma_1 + \sigma_2 + \cdots + \sigma_r$
- label: C
  text: $\sigma_1^2 \cdot \sigma_2^2 \cdots \sigma_r^2$
- label: D
  text: $\sigma_1^2$
- label: E
  text: $\sigma_1^2 + \sigma_2^2 + \cdots + \sigma_r^2$
figures: []
