statement: |
  Let $X \in \mathbb{R}^{n \times d}$ be a centered data matrix: $n$ observations of $d$ features, with each column having mean zero. Which statement best describes the covariance matrix of $X$?
choices:
- label: A
  text: The $d \times d$ symmetric matrix $X^T X$, whose entries are the inner products of feature columns.
- label: B
  text: The $d \times d$ matrix obtained by standardizing each feature to unit variance, with entry $C_{ij}$
    equal to the correlation between features $i$ and $j$.
- label: C
  text: The $n \times n$ symmetric matrix $\frac{1}{n} X X^T$, whose entries measure pairwise relationships
    between observations.
- label: D
  text: The $d \times d$ symmetric matrix $\frac{1}{n} X^T X$, whose diagonal entries are the variances
    of the features and whose off-diagonal entries are the covariances between feature pairs.
- label: E
  text: The $n \times n$ symmetric matrix $\frac{1}{d} X X^T$, whose diagonal entries are the squared
    distances of each observation from the origin, normalized by the number of features.
figures: []
answer:
  correct: D
  partial_credit: []
