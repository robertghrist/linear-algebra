  explanation: |
    The coordinate map $\Phi_{\mathcal{B}}$ is linear (coordinates respect addition and scalar multiplication), injective (only the zero vector has all-zero coordinates), and surjective (every $(c_1, \ldots, c_n) \in \mathbb{R}^n$ is the coordinates of $c_1 \mathbf{b}_1 + \cdots + c_n \mathbf{b}_n$). So $\Phi_{\mathcal{B}}$ is an isomorphism for {\em any} ordered basis $\mathcal{B}$ of any $n$-dimensional $V$.  But the isomorphism is {\em not canonical} --- it depends on the basis choice.  For any two distinct ordered bases $\mathcal{B} \neq \mathcal{C}$, the coordinate maps $\Phi_{\mathcal{B}}$ and $\Phi_{\mathcal{C}}$ are different functions: they disagree on at least the basis vectors themselves, and in general they differ by the change-of-basis matrix $\Phi_{\mathcal{C}} = P \circ \Phi_{\mathcal{B}}$. [Conceptual takeaway: every finite-dimensional vector space ``becomes'' $\mathbb{R}^n$ after a basis choice.  This is what justifies treating abstract vector spaces $V$ via numerical computations on coordinates --- but the price is that {\em the isomorphism depends on the basis}. Coordinate-free properties survive any basis choice; coordinate-dependent statements (like the matrix entries of a transformation) do not.]
  key_insight: null
  distractor_rationale:
    B: |
      recognizes linearity but mis-remembers invertibility --- the naive-prior answer for a student who has not internalized that a basis is, by definition, exactly the data needed to make the coordinate map bijective.
    C: |
      twin pair to (B); collapses the basis-dependence of the coordinate map.  Tempts students who remember ``coordinate maps are isomorphisms'' but treat the isomorphism as canonical --- the same conceptual error as treating $V \cong V^*$ via an unspecified isomorphism.
    A: |
      the naive-prior answer for the student who thinks $\mathbb{R}^n$ is special; misses that coordinate maps {\em produce} the identification $V \cong \mathbb{R}^n$ rather than requiring it.  The clarification ``literally $\mathbb{R}^n$'' sharpens the trap by ruling out the tautological reading.
    E: |
      imports an inner-product condition that is irrelevant to the coordinate map.  Surface match on ``orthonormal bases are nicer'' --- true in inner product spaces for computation, but the coordinate map exists and is an isomorphism without any inner product structure.
