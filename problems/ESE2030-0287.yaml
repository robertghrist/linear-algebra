statement: |
  Let $V$ be an $n$-dimensional vector space and fix
  an ordered basis $\mathcal{B}$.  Consider the coordinate map
  $\Phi_{\mathcal{B}} : V \to \mathbb{R}^n$ defined by
  $\Phi_{\mathcal{B}}(\mathbf{v}) = [\mathbf{v}]_{\mathcal{B}}$.  Which
  of the following must be true?
choices:
- label: A
  text: $\Phi_{\mathcal{B}}$ is an isomorphism only if $V$ is literally $\mathbb{R}^n$ (not merely isomorphic
    to it).
- label: B
  text: $\Phi_{\mathcal{B}}$ is a linear transformation but generally not invertible.
- label: C
  text: $\Phi_{\mathcal{B}}$ is an isomorphism, and any two ordered bases $\mathcal{B}, \mathcal{C}$ produce
    the same coordinate map.
- label: D
  text: $\Phi_{\mathcal{B}}$ is an isomorphism, and a different ordered basis $\mathcal{C}$ gives a different
    coordinate map $\Phi_{\mathcal{C}}$.
- label: E
  text: $\Phi_{\mathcal{B}}$ is an isomorphism only if $\mathcal{B}$ is orthonormal.
figures: []
answer:
  correct: D
  partial_credit: []
