statement: |
  Let $\mathcal{B}$ and $\mathcal{C}$ be two bases for $\mathbb{R}^n$, and let $P$ be the matrix satisfying $[\mathbf{v}]_\mathcal{C} = P\,[\mathbf{v}]_\mathcal{B}$ for all $\mathbf{v} \in \mathbb{R}^n$. What are the columns of $P$?
choices:
- label: A
  text: The vectors in $\mathcal{C}$, expressed in standard coordinates
- label: B
  text: The vectors in $\mathcal{B}$, expressed in standard coordinates
- label: C
  text: The vectors in $\mathcal{B}$, expressed in $\mathcal{C}$-coordinates
- label: D
  text: The vectors in $\mathcal{C}$, expressed in $\mathcal{B}$-coordinates
- label: E
  text: The standard basis vectors, expressed in $\mathcal{C}$-coordinates
figures: []
answer:
  correct: C
  partial_credit: []
