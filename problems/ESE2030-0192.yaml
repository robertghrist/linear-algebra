  - quizzes-exams/2026-A/2030-Q2.tex
  conflict: null
  explanation: |
    Plugging in $\mathbf{v} = \mathbf{b}_j$ (the $j$-th vector of $\mathcal{B}$), its $\mathcal{B}$-coordinates are $\mathbf{e}_j$. So $P\mathbf{e}_j = [\mathbf{b}_j]_\mathcal{C}$: the $j$-th column of $P$ is the $j$-th basis vector of $\mathcal{B}$, written in $\mathcal{C}$-coordinates.
  key_insight: null
  distractor_rationale:
    D: |
      swaps the roles of $\mathcal{B}$ and $\mathcal{C}$; this would be the columns of $P^{-1}$. Students who get the direction of conversion backwards pick this.
    B: |
      these are the columns of the matrix that converts from $\mathcal{B}$-coordinates to \emph{standard} coordinates, not to $\mathcal{C}$-coordinates; confuses change-of-basis with the coordinate matrix
    A: |
      same error as B but with the wrong basis; these columns convert from $\mathcal{C}$-coordinates to standard
