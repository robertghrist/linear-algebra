  explanation: |
    The QR algorithm produces a sequence of matrices, each similar to $A$, that converges to a form displaying the eigenvalues of $A$ directly on the diagonal. For a general matrix the limit is upper-triangular (real Schur form, with the eigenvalues on the diagonal). For a symmetric matrix --- as here --- the limit is strictly stronger: $A_k$ converges to a {\em diagonal} matrix whose diagonal entries are the eigenvalues of $A$ in (typically) descending magnitude order. Why diagonal in the symmetric case: each iterate $A_{k+1} = Q_k^T A_k Q_k$ is itself symmetric (a similarity by an orthogonal matrix preserves symmetry), so the limit of a sequence of symmetric upper-triangular matrices is both symmetric and upper-triangular --- forcing all off-diagonal entries to vanish. So the symmetric case collapses the general upper-triangular limit to a diagonal limit. This is the conceptual purpose of the algorithm. Q3 P20 establishes that similarity preserves eigenvalues at each step; the present problem establishes that the limit, by being diagonal, {\em displays} those eigenvalues. Together, the two halves explain how the QR algorithm extracts eigenvalues without ever computing a characteristic polynomial.
  key_insight: null
  distractor_rationale:
    E: |
      D5 naive-prior: imagines the iteratihttps://aistudio.google.com/app/libraryon as a ``settling'' that returns the original matrix. The iteration {\em is} a similarity transformation at each step, but it does not fix $A$ --- instead, it transforms $A$ along a path through the orbit of similar matrices toward a canonical representative. The fixed points of QR iteration are the matrices that are already (block-)triangular, not $A$ itself.
    B: |
      D7 convention collision: confuses singular values with eigenvalues. The QR algorithm extracts {\em eigenvalues}, not singular values. For symmetric positive-definite $A$ these happen to coincide in absolute value, but the algorithm extracts signed eigenvalues regardless of definiteness --- so for symmetric $A$ with negative eigenvalues the diagonal limit will contain those negative values, not their absolute values.
    D: |
      D4 surface match: $Q$ and $R$ appear in the iteration, and $A^T A = R_0^T Q_0^T Q_0 R_0 = R_0^T R_0$ at the first step, so the symbols look related --- but the iteration does not converge to $A^T A$. For symmetric $A$, $A^T A = A^2$ has eigenvalues $\lambda_i^2$, not $\lambda_i$, so this answer is doubly wrong: wrong limit, wrong eigenvalue magnitudes.
