statement: |
  Let $A \in \mathbb{R}^{n \times n}$ be a real symmetric matrix with distinct
  nonzero eigenvalues. The QR algorithm produces the iteration
  $$A_0 = A, \qquad A_k = Q_k R_k, \qquad A_{k+1} = R_k Q_k.$$
  Each iterate $A_{k+1}$ is similar to $A_k$ (and hence to $A$), so the eigenvalues
  are preserved at every step. To what does the sequence $A_k$ converge to as $k \to \infty$?
choices:
- label: A
  text: $A_k$ converges to an upper-triangular matrix whose diagonal entries are the eigenvalues of $A$.
- label: B
  text: $A_k$ converges to a diagonal matrix whose diagonal entries are the singular values of $A$.
- label: C
  text: $A_k$ converges to a diagonal matrix whose diagonal entries are the eigenvalues of $A$.
- label: D
  text: $A_k$ converges to $A^T A$, since the QR iteration is built from products of $Q$ and $R$.
- label: E
  text: $A_k$ converges to $A$ itself, since the iteration is a similarity transformation and $A$ is the
    unique fixed point.
