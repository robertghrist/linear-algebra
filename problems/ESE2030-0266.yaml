statement: |
  Let $V$ be a finite-dimensional vector space, and let $U, W \subseteq V$ be
  subspaces satisfying $U + W = V$. Which of the following are equivalent to $V = U \oplus W$ under this hypothesis?
choices:
- label: A
  text: $U \cap W = \{\mathbf{0}\}$
- label: B
  text: $\dim(U) + \dim(W) = \dim(V)$
- label: C
  text: Every vector in $V$ can be written as $\mathbf{u} + \mathbf{w}$ with $\mathbf{u} \in U$, $\mathbf{w}
    \in W$
- label: D
  text: $U$ and $W$ together contain a basis for $V$
- label: E
  text: Both (A) and (B)
figures: []
answer:
  correct: E
  partial_credit:
  - A
  verified: true
  verified_from:
