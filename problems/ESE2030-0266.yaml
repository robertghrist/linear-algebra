  conflict: null
  explanation: |
    A direct sum $V = U \oplus W$ requires \emph{both} (i) every $\mathbf{v} \in V$ decomposes as $\mathbf{u} + \mathbf{w}$, and (ii) the decomposition is \emph{unique}. Given that $U + W = V$ already gives existence, uniqueness is the additional requirement — and uniqueness is equivalent to $U \cap W = \{\mathbf{0}\}$. In finite dimensions, this is \emph{also} equivalent to the dimension count $\dim(U) + \dim(W) = \dim(V)$ (since $\dim(U+W) = \dim(U) + \dim(W) - \dim(U \cap W)$). So (A) and (B) are each individually equivalent to the direct-sum condition under the hypothesis $U + W = V$, and both must be true. [Teaching remark: students often treat ``direct sum'' as a synonym for ``sum,'' missing that the directness is precisely the uniqueness of decomposition. The trivial-intersection condition and the dimension-count condition are two faces of the same coin, linked by the inclusion-exclusion formula for subspace dimensions. Recognizing that two conditions describe the same structural fact is the FTLA-style pattern of equivalent characterizations applied at the level of subspaces.]
  key_insight: null
  distractor_rationale:
    D: |
      D4 surface-match: ``contains a basis'' sounds structurally relevant but is too loose — $U \cup W$ contains a basis for $V$ whenever $U + W = V$, regardless of directness. The trap is pattern-matching on basis vocabulary.
    C: |
      this is just a restatement of $U + W = V$, which was \emph{given} as a hypothesis — picking this means the student did not recognize that something \emph{additional} is needed for directness. D5 naive-prior: existence without uniqueness.
