statement: |
  You need all the eigenvalues of a $200\times 200$ nonsymmetric matrix $A$, numerically. Which procedure does the job?
choices:
- label: A
  text: Factor $A = QR$ once and read the eigenvalues off the diagonal of $R$
- label: B
  text: Compute the Jordan canonical form of $A$ and read its diagonal
- label: C
  text: Expand $\det(A - \lambda I)$ and find the roots of the resulting polynomial of degree $200$
- label: D
  text: Iterate $A_k = Q_kR_k$, $A_{k+1} = R_kQ_k$, and read the diagonal of the limit
- label: E
  text: Apply Gram--Schmidt to the columns of $A$ and read the lengths of the resulting vectors
figures: []
answer:
  correct: D
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    This is the QR algorithm. Each step replaces $A_k$ by $R_kQ_k = Q_k^TA_kQ_k$, a similar matrix with the same spectrum, and the iterates converge to a triangular matrix (block triangular, with $2\times 2$ blocks, for complex conjugate pairs) whose diagonal carries the eigenvalues. It is what software actually runs. The QR decomposition of Week 5 is one ingredient of one step; by itself it computes nothing about eigenvalues.
  key_insight: null
  distractor_rationale:
    A: |
      Trick: the listed confusion of the QR decomposition (Week 5) with the QR algorithm (Week 8). The diagonal of $R$ records lengths in Gram--Schmidt, not eigenvalues; one factorization is one step of the algorithm, and the step has not been taken.
    B: |
      Trick: the listed trap. Jordan form is a theorem about similarity, numerically unstable to compute and not what any software produces.
    C: |
      Distractor: correct in principle, hopeless in practice. Root-finding on a degree-$200$ polynomial is catastrophically ill-conditioned, and the determinant is never expanded in numerical work.
    E: |
      Distractor: Gram--Schmidt produces the $Q$ and $R$ of a single factorization; the lengths are the diagonal of $R$, and again these are not eigenvalues.
