statement: |
  A $3 \times 3$ matrix $A$ has eigenvalues $\lambda_1 = 0.6$, $\lambda_2 = -0.8$, and $\lambda_3 = 0.4$, with corresponding linearly independent eigenvectors $\mathbf{v}_1$, $\mathbf{v}_2$, and $\mathbf{v}_3$.
  Consider the iterative sequence $\mathbf{x}_k = A^k\mathbf{x}_0$ where $\mathbf{x}_0 = 2\mathbf{v}_1 + 3\mathbf{v}_2 + 5\mathbf{v}_3$.
  Which statement best describes the long-term behavior of $\mathbf{x}_k$ as $k \to \infty$?
choices:
- label: A
  text: The sequence converges to zero monotonically
- label: B
  text: The sequence converges toward the direction of $\mathbf{v}_1$, since $\lambda_1$ is dominant
- label: C
  text: The sequence grows without bound due to positive eigenvalues
- label: D
  text: The sequence converges to the direction of $\mathbf{v}_2$, but oscillating signs%, based on the
    dominant eigenvalue
- label: E
  text: All eigenvalues are real and distinct, so each eigencomponent of $\mathbf{x}_k$ acts independently
figures: []
answer:
  correct: D
  partial_credit:
