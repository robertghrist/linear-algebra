  explanation: |
    Since the eigenvectors are linearly independent, we can write $\mathbf{x}_k = A^k\mathbf{x}_0 = 2(0.6)^k\mathbf{v}_1 + 3(-0.8)^k\mathbf{v}_2 + 5(0.4)^k\mathbf{v}_3$. The dominant eigenvalue (largest magnitude) is $\lambda_2 = -0.8$ with $|\lambda_2| = 0.8$. The other eigenvalues have smaller magnitudes: $|\lambda_1| = 0.6$ and $|\lambda_3| = 0.4$. As $k \to \infty$, the term with $\lambda_2$ dominates: the ratios $|\lambda_1|/|\lambda_2| = 0.75$ and $|\lambda_3|/|\lambda_2| = 0.5$ mean the other components decay much faster relative to the $\mathbf{v}_2$ component. Therefore, $\mathbf{x}_k \approx 3(-0.8)^k\mathbf{v}_2$ for large $k$. The normalized sequence $\mathbf{x}_k/\|\mathbf{x}_k\|$ oscillates between $+\mathbf{v}_2/\|\mathbf{v}_2\|$ and $-\mathbf{v}_2/\|\mathbf{v}_2\|$ (alternating signs due to the negative eigenvalue), while the magnitude $\|\mathbf{x}_k\|$ decays to zero since $|\lambda_2| = 0.8 < 1$. The sequence converges to zero along the direction of $\mathbf{v}_2$, with oscillating sign.
  key_insight: null
  distractor_rationale:
    B: |
      incorrectly identifies $\lambda_1 = 0.6$ as dominant; dominance is determined by magnitude, and $|\lambda_2| = 0.8 > |\lambda_1| = 0.6$
    C: |
      all eigenvalues have magnitude less than 1, so the sequence decays rather than grows
    E: |
      while true that eigencomponents act independently, this doesn't describe the asymptotic behavior; the statement misses that one component dominates the others
