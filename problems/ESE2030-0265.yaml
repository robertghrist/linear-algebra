  conflict: null
  explanation: |
    Cosine similarity depends only on the {\em directions} of the input vectors, not their magnitudes — but it is sensitive to the sign of each vector and to the choice of origin. (A) For any positive scalar $c > 0$: $\mathrm{sim}(c\mathbf{u}, \mathbf{v}) = \frac{c \langle \mathbf{u}, \mathbf{v}\rangle}{(c\|{\mathbf{u}}\|)\|{\mathbf{v}}\|} = \mathrm{sim}(\mathbf{u},\mathbf{v})$.  The factors of $c$ cancel. (B) Negation flips the sign: $\mathrm{sim}(-\mathbf{u}, \mathbf{v}) = -\mathrm{sim}(\mathbf{u}, \mathbf{v})$.  The numerator picks up a sign; the denominator does not (norm is positive).  Cosine similarity is invariant under {\em positive} scaling, not arbitrary scaling. (C) Translation by a common vector $\mathbf{c}$ generally changes the similarity.  The inner product $\langle \mathbf{u}+\mathbf{c}, \mathbf{v}+\mathbf{c}\rangle = \langle \mathbf{u},\mathbf{v}\rangle + \langle \mathbf{u},\mathbf{c}\rangle + \langle \mathbf{c},\mathbf{v}\rangle + \|{\mathbf{c}}^2$ does not simplify, and the norms in the denominator change too.  This is why PCA centers data {\em before} computing similarities — translation is not an invariance of cosine similarity, only of {\em centered} cosine similarity (a.k.a. Pearson correlation). [Geometric picture: cosine similarity = cosine of the angle the two vectors make at the origin.  Sliding both vectors by $\mathbf{c}$ moves them away from the origin, which generally changes the angle they subtend at the origin even though their relative offset is unchanged.  Negation rotates a vector by $180^\circ$, flipping the sign of the cosine.]
  key_insight: null
  distractor_rationale:
    B: |
      negation: the naive "scaling invariance" answer that doesn't track the sign restriction.  Tempting because $\|{-\mathbf{u}} = \|{\mathbf{u}}$ — students stop checking after the denominator.
    C: |
      translation: the deepest trap.  Students who think "cosine similarity is just relative geometry" import a false translation invariance — a mental model that confuses cosine similarity with Pearson correlation.
    D: |
      combines a true statement (A) with two false ones; tempts students who recognize (A) and assume the "more invariances the better."
    E: |
      the over-cautious answer; tempts students who, having spotted that (B) and (C) fail, conclude that nothing is safe and miss (A).
