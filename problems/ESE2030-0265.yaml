statement: |
  For nonzero vectors $\mathbf{u}, \mathbf{v} \in \mathbb{R}^n$, define
  $\mathrm{sim}(\mathbf{u}, \mathbf{v}) \;=\; \displaystyle \frac{\langle \mathbf{u}, \mathbf{v} \rangle}{\|{\mathbf{u}}\|\,\|{\mathbf{v}}\|}$.

  Which of the following operations is guaranteed to leave $\mathrm{sim}(\mathbf{u},\mathbf{v})$ unchanged?
choices:
- label: A
  text: Replacing $\mathbf{u}$ with $5\mathbf{u}$
- label: B
  text: Replacing $\mathbf{u}$ with $-\mathbf{u}$
- label: C
  text: Replacing both $\mathbf{u}$ and $\mathbf{v}$ with $\mathbf{u} + \mathbf{c}$ and $\mathbf{v} +
    \mathbf{c}$ for a fixed $\mathbf{c} \in \mathbb{R}^n$
- label: D
  text: All of the above
- label: E
  text: None of the above
figures: []
answer:
  correct: A
  partial_credit: []
