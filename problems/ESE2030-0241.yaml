  conflict: null
  explanation: |
    The rank-2 PCA approximation $X_2$ is not equal to $X$ — $X$ has rank 20, so projection onto a 2-dimensional subspace strictly loses information. However, the Frobenius error satisfies $\|X - X_2\|_F^2 = n \sum_{i \geq 3} \lambda_i \approx n \cdot 12.6$, while $\|X\|_F^2 = n \sum_i \lambda_i \approx n \cdot 391.6$. Small relative error despite nonzero rank deficiency is exactly what makes rank-2 reduction appropriate.
  key_insight: null
  distractor_rationale:
    A: |
      mathematically false; $X_2 = X$ would require the remaining eigenvalues to be exactly zero, confusing effective dimension with mathematical rank. NOT awarded partial credit: claiming equality when the tail eigenvalues are strictly nonzero is a misunderstanding of what a low-rank approximation is.
    C: |
      rank does not equal the number of retained components; this conflates mathematical rank with effective dimension in the opposite direction from (A).
    E: |
      correctly identifies $X_2 \neq X$ but draws the wrong conclusion: rank-2 reduction is appropriate *precisely because* the discarded variance is negligible, not inappropriate because the rank exceeds 2.
