statement: |
  A centered data matrix $X \in \mathbb{R}^{500 \times 20}$ has ordered covariance eigenvalues:
  $$\lambda_1 = 200, \quad \lambda_2 = 180, \quad \lambda_3 = 10, \quad \lambda_4 = 1.5,
  \quad \ldots, \quad \lambda_{20} = 0.1.$$
  Which statement about reducing this data to its rank-2 PCA approximation $X_2$ is correct?
choices:
- label: A
  text: $X_2 = X$, since the first two principal components span the column space of $X$.
- label: B
  text: $X_2 \neq X$, and the relative error $\|X - X_2\|_F / \|X\|_F$ is determined by the ratio $\lambda_3
    / \lambda_2$, which measures the size of the spectral gap.
- label: C
  text: $X_2 = X$, since the rank of $X$ equals the number of principal components retained when a clear
    elbow is present in the scree plot.
- label: D
  text: $X_2 \neq X$, but the relative error $\|X - X_2\|_F / \|X\|_F$ is small because the discarded
    eigenvalues are small relative to $\lambda_1$ and $\lambda_2$.
- label: E
  text: $X_2 \neq X$, and rank-2 reduction is inappropriate here because $X$ has 20 nonzero singular values.
figures: []
answer:
  correct: D
  partial_credit:
