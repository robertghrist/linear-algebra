statement: |
  Consider the third-order linear differential equation $p(D)x = 0$, where
  $p(D) = (D - 2)^2 (D + 3)$ and $D = d/dt$. Which of the following is a basis for the solution space?
choices:
- label: A
  text: $\{e^{2t},\ e^{2t},\ e^{-3t}\}$
- label: B
  text: $\{e^{2t},\ e^{-3t}\}$
- label: C
  text: $\{e^{2t},\ t e^{2t},\ e^{-3t}\}$
- label: D
  text: $\{e^{2t},\ e^{2t} \ln t,\ e^{-3t}\}$
- label: E
  text: $\{e^{-2t},\ t e^{-2t},\ e^{3t}\}$
figures: []
answer:
  correct: C
  partial_credit:
  - B
  verified: true
