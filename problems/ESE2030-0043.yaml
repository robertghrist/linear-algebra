  explanation: |
    Projection of vector $\mathbf{u}$ onto vector $\mathbf{v}$ requires the formula $\text{proj}_{\mathbf{v}}\mathbf{u} = \frac{\langle \mathbf{u}, \mathbf{v} \rangle}{\langle \mathbf{v}, \mathbf{v} \rangle}\mathbf{v}$, which explicitly uses inner products. All other operations are purely algebraic: spanning is about linear combinations, kernels are defined as pre-images of zero, injectivity means ker(T) = {0}, and matrix representations only need a choice of basis, not geometry.
