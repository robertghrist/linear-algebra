statement: |
  A real $5 \times 5$ matrix $A$ has eigenvalues $\lambda_{1,2} = 3$ (sharing an eigenvector), $\lambda_{3,4} = 1 \pm 2i$, and $\lambda_5 = -1$.

  When the QR algorithm is applied to $A$ repeatedly, what is the structure of the limiting form?
choices:
- label: A
  text: Diagonal with entries $3, 3, -1$ and two complex entries
- label: B
  text: Jordan canonical form with appropriate Jordan blocks
- label: C
  text: Upper triangular with all five eigenvalues on the diagonal
- label: D
  text: 'Block upper triangular: three $1 \times 1$ blocks and one $2 \times 2$ block'
- label: E
  text: The algorithm cannot converge due to the repeated eigenvalue
figures: []
answer:
  correct: D
  partial_credit: []
