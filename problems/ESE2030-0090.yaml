  explanation: |
    The QR algorithm converges to real Schur form: block upper triangular with 1×1 blocks for real eigenvalues (regardless of multiplicity) and 2×2 blocks for complex conjugate pairs. Here: three 1×1 blocks for the eigenvalues 3, 3, and -1, plus one 2×2 block encoding 1±2i. The algorithm does NOT produce Jordan form (would need generalized eigenvectors), does NOT produce complex entries (real arithmetic throughout), and repeated eigenvalues do NOT prevent convergence.
  key_insight: null
