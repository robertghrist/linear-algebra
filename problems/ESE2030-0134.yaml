statement: |
  Consider the set $W = \{(x, y, z) \in \mathbb{R}^3 : x^2 + y^2 \leq z^2\}$ (a double cone centered at the origin).
  Which statement best describes why $W$ is \emph{not} a subspace of $\mathbb{R}^3$?
choices:
- label: A
  text: $W$ does not contain the zero vector.
- label: B
  text: $W$ is not closed under scalar multiplication.
- label: C
  text: $W$ is not closed under vector addition.
- label: D
  text: $W$ fails all three subspace axioms.
- label: E
  text: 'False premise: $W$ is actually a subspace of $\mathbb{R}^3$.'
figures: []
answer:
  correct: C
  partial_credit:
  - D
  verified: true
  verified_from:
  - quizzes-exams/2025-C/2030-FINAL-EXAM.tex
  conflict: null
  explanation: |2
     - Zero vector: $(0,0,0)$ satisfies $0^2 + 0^2 = 0^2$, so $\mathbf{0} \in W$. (A) is false. - Scalar multiplication: If $(x,y,z) \in W$, then $x^2 + y^2 = z^2$. For any scalar $c$, we have $(cx)^2 + (cy)^2 = c^2(x^2 + y^2) = c^2 z^2 = (cz)^2$, so $c(x,y,z) \in W$. (B) is false. - Addition: Take $\mathbf{u} = (1, 0, 1)$ and $\mathbf{v} = (0, 1, 1)$. Both satisfy the cone equation: $1^2 + 0^2 = 1^2$ ✓ and $0^2 + 1^2 = 1^2$ ✓. But $\mathbf{u} + \mathbf{v} = (1, 1, 2)$: check $1^2 + 1^2 = 2 \neq 4 = 2^2$. ✗ So $W$ is not closed under addition.
  key_insight: null
  distractor_rationale:
    A: |
      the zero vector IS on the cone — students may not check
    B: |
      quadratic equations often fail scalar mult, but cones don't — the squaring "absorbs" the scalar
    E: |
      (the cone is a quadric surface, not a linear subspace) ===============================================
