  explanation: |
    The set $S = \{(x,y,z) : x+y+z = 1\}$ is an affine space (shifted plane). Check all three properties: \begin{enumerate} \item \textbf{Zero vector:} $(0,0,0) \notin S$ since $0+0+0 = 0 \neq 1$ ✗ \item \textbf{Addition:} If $\mathbf{u}, \mathbf{v} \in S$, then sum of coordinates of $\mathbf{u}+\mathbf{v}$ is $1+1 = 2 \neq 1$ ✗ \item \textbf{Scalar multiplication:} If $\mathbf{u} \in S$ and $c \neq 1$, then sum of coordinates of $c\mathbf{u}$ is $c \cdot 1 = c \neq 1$ ✗ \end{enumerate} All three properties fail!
  key_insight: |
    Any affine space (not through origin) fails all subspace properties.
