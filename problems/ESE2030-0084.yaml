  conflict: null
  explanation: |
    If $\mathbf{v}$ is an eigenvector of $A$ with eigenvalue $\lambda$, then $A\mathbf{v} = \lambda\mathbf{v}$, which means $(-A)\mathbf{v} = -\lambda\mathbf{v}$. Thus $\mathbf{v}$ is also an eigenvector of $-A$ with eigenvalue $-\lambda$. Since $A$ has dominant eigenvalue $\lambda_* = \rho(A) > 0$ with positive eigenvector $\mathbf{v}_*$, the matrix $-A$ has eigenvalue $-\lambda_* < 0$ with the SAME positive eigenvector $\mathbf{v}_*$. This eigenvalue has magnitude $|-\lambda_*| = \lambda_* = \rho(A)$, making it dominant (largest magnitude) among all eigenvalues of $-A$. The key insight: negating a matrix negates its eigenvalues but preserves eigenvectors.
  key_insight: null
  distractor_rationale:
    A: |
      negating the matrix negates the eigenvalues; fails to track the transformation
    C: |
      eigenvectors are unchanged by negating the matrix; eigenvalues change sign but eigenvectors don't
    D: |
      while Perron-Frobenius doesn't directly apply to matrices with all negative entries, we can determine the eigenstructure by understanding how negation affects eigenvalues and eigenvectors
    E: |
      all eigenvalues remain real; negation preserves the real/complex nature of eigenvalues
