statement: |
  Let $A$ be a square matrix with all entries strictly positive, to which the Perron-Frobenius theorem applies. Now consider the matrix $-A$ (all entries strictly negative). Which statement about $-A$ does Perron-Frobenius imply?
choices:
- label: A
  text: $-A$ has a dominant real positive eigenvalue with positive eigenvector
- label: B
  text: $-A$ has a dominant real negative eigenvalue with positive eigenvector
- label: C
  text: $-A$ has a dominant real negative eigenvalue with negative eigenvector
- label: D
  text: Perron-Frobenius does not apply to $-A$, so nothing definite can be said about its eigenstructure
- label: E
  text: None of the above is entirely accurate
figures: []
answer:
  correct: B
  partial_credit:
  - C
