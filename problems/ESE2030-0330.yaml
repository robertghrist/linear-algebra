statement: |
  The matrix $A$ of a system $A\mathbf{x} = \mathbf{b}$ is nonsingular but ill-conditioned. What does the ill-conditioning warn you about?
choices:
- label: A
  text: $\det A$ is close to zero
- label: B
  text: The system may have no solution
- label: C
  text: The solution is not unique
- label: D
  text: A small change in $\mathbf{b}$ can move the solution $\mathbf{x}$ a long way
- label: E
  text: Elimination will meet a zero pivot and must exchange rows to proceed
figures: []
answer:
  correct: D
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Ill-conditioning is about sensitivity, not existence or uniqueness. A nonsingular matrix has exactly one solution for every $\mathbf{b}$; conditioning asks how far that solution moves when $\mathbf{b}$ is perturbed by measurement error, roundoff, or truncation. A matrix that stretches some direction a thousand times more than another can amplify a small error in $\mathbf{b}$ by that same factor in $\mathbf{x}$, so the computed answer deserves skepticism even though it exists and is unique.
  key_insight: null
  distractor_rationale:
    A: |
      Trick: the listed trap in reverse. A small determinant is neither necessary nor sufficient for ill-conditioning; the diagnostic is the ratio of stretches, not their product.
    B: |
      Distractor: existence is settled by nonsingularity. Ill-conditioning never removes a solution; it makes the one that exists unreliable to compute.
    C: |
      Distractor: uniqueness is likewise settled by nonsingularity.
    E: |
      Distractor: a zero pivot is an exact event handled by pivoting; ill-conditioning is a matter of degree and persists under any pivoting strategy.
