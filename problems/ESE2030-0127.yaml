  explanation: |
    Orthogonality is defined via inner products: $W^{\perp} = \{\mathbf{v} \in V : \langle \mathbf{v}, \mathbf{w} \rangle = 0 \text{ for all } \mathbf{w} \in W\}$. Without an inner product, the concept of ``orthogonal'' is undefined. All other operations are purely algebraic: linear independence (check if $\sum c_i \mathbf{v}_i = 0$ implies all $c_i = 0$), dimension (count basis vectors), injectivity (check if $\ker(T) = \{0\}$), and expressing in a basis (solve a linear system).
