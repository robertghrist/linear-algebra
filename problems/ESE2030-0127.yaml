statement: |
  A mathematician working in an abstract vector space $V$ with subspace $W<V$ wants to perform several operations.
  She has chosen a basis for $V$ but has not specified an inner product.

  Which operation can she \textbf{not} perform?
choices:
- label: A
  text: Compute a quotient $V/W$ by the subspace $W<V$
- label: B
  text: Compute the dimension of the subspace $W<V$
- label: C
  text: Compute the orthogonal projection of $V$ onto $W$
- label: D
  text: Compute a basis for $W$
- label: E
  text: All of these operations can in fact be performed
figures: []
answer:
  correct: C
  partial_credit: []
  verified: true
  verified_from:
  - quizzes-exams/2025-C/2030-FINAL-EXAM.tex
