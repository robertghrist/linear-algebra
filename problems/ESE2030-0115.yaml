statement: |
  The figure shows the full SVD $A = U\Sigma V^T$ for a matrix $A \in \mathbb{R}^{12 \times 5}$.
  Filled circles represent nonzero singular values; empty circles represent zero singular values.
  Vertical lines indicate columns; horizontal lines indicate rows.

  Which statement is most TRUE?
choices:
- label: A
  text: $\dim(\ker A) = 9$.
- label: B
  text: The first three columns of $V$ form an orthonormal basis for $\mathrm{im}(A)$.
- label: C
  text: The last 9 columns of $U$ form an orthonormal basis for the codomain of $A$.
- label: D
  text: The last two columns of $V$ form an orthonormal basis for $\ker(A)$.
- label: E
  text: The rank of $A$ equals $5$.
