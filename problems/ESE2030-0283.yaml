statement: |
  A perceptron with weights $\mathbf{w} \in \mathbb{R}^n$, bias $b \in \mathbb{R}$, and sigmoid activation $\sigma$ computes $y = \sigma(\mathbf{w}^T \mathbf{x} + b)$, with decision boundary $\{\mathbf{x} : \mathbf{w}^T \mathbf{x} + b = 0\}$.
  Which statement best and most fundamentally describes the geometric role of $\mathbf{w}$?
choices:
- label: A
  text: $\mathbf{w}$ points from the origin toward the centroid of the training inputs whose target label
    is close to $1$.
- label: B
  text: $\mathbf{w}$ lies in the decision boundary, since $\mathbf{w}$ and $\mathbf{x}$ are vectors in
    the same space $\mathbb{R}^n$.
- label: C
  text: $\mathbf{w}$ is normal to the decision boundary, and $\mathbf{w}^T \mathbf{x} + b$ equals $\norm{\mathbf{w}}$
    times the signed distance from $\mathbf{x}$ to that boundary.
- label: D
  text: $\mathbf{w}$ determines the decision boundary.
- label: E
  text: $\mathbf{w}$ is the direction of steepest ascent of the pre-activation $\mathbf{x} \mapsto \mathbf{w}^T
    \mathbf{x} + b$.
figures: []
answer:
  correct: C
  partial_credit: []
