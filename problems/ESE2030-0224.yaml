statement: |
  A $3 \times 3$ real matrix $A$ satisfies $\operatorname{tr}(A) = 7$, $\det(A) = 0$, and is known to have an eigenvalue $\lambda_1 = 3$.
  Which of the following must be the remaining eigenvalues?
choices:
- label: A
  text: $\lambda_2 = 4, \; \lambda_3 = 0$
- label: B
  text: $\lambda_2 = 4, \; \lambda_3 = 3$
- label: C
  text: $\lambda_2 = 2+i, \; \lambda_3 = 2-i$
- label: D
  text: $\lambda_2 = 0, \; \lambda_3 = 0$
- label: E
  text: $\lambda_2 = 7, \; \lambda_3 = 0$
figures: []
answer:
  correct: A
  partial_credit:
  - C
  verified: true
  verified_from:
  - quizzes-exams/2026-A/2030-Q3-SOLUTIONS.tex
