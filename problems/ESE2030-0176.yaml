  conflict: null
  explanation: |
    First verify linearity. For $p, q \in \mathcal{P}_2$ and scalar $c$: $$T(p+q) = \begin{pmatrix} (p+q)(0) \\ (p+q)(1) - (p+q)(0) \end{pmatrix} = \begin{pmatrix} p(0)+q(0) \\ p(1)-p(0) + q(1)-q(0) \end{pmatrix} = T(p) + T(q)$$ Similarly $T(cp) = cT(p)$. So $T$ is linear. For the kernel: $p(x) = a + bx + cx^2$ is in $\ker(T)$ iff $p(0) = 0$ and $p(1) - p(0) = 0$. We have $p(0) = a = 0$ and $p(1) - p(0) = (a + b + c) - a = b + c = 0$, so $c = -b$. Thus $\ker(T) = \{bx - bx^2 : b \in \mathbb{R}\} = \text{span}\{x - x^2\}$, giving $\dim(\ker(T)) = 1$.
  key_insight: null
  distractor_rationale:
    A: |
      evaluation IS linear: $(p+q)(0) = p(0) + q(0)$ and $(cp)(0) = c \cdot p(0)$
    C: |
      miscounts the constraints or free parameters
    D: |
      by rank-nullity, $\dim(\ker(T)) = 3 - \dim(\text{im}(T)) \geq 3 - 2 = 1$, so $T$ cannot be injective
    E: |
      dimension mismatch does not preclude linearity
