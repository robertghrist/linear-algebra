statement: |
  Define $T: \mathcal{P}_2 \to \mathbb{R}^2$ by $T(p) = \begin{pmatrix} p(0) \\ p(1) - p(0) \end{pmatrix}$. Which statement is TRUE?
choices:
- label: A
  text: $T$ is not a linear transformation because evaluation at a point is not a linear operation.
- label: B
  text: $T$ is a linear transformation with $\dim(\ker(T)) = 1$.
- label: C
  text: $T$ is a linear transformation with $\dim(\ker(T)) = 2$.
- label: D
  text: $T$ is a linear transformation that is injective.
- label: E
  text: $T$ is not a linear transformation because the codomain has smaller dimension than the domain.
figures: []
answer:
  correct: B
  partial_credit: []
  verified: true
