  conflict: null
  explanation: |
    Orthogonal projections satisfy the idempotent property $\Pi_W^2 = \Pi_W$. Since $\Pi_W(\mathbf{v}) = \mathbf{w}$, we know $\mathbf{w} \in W$. Any vector already in $W$ is unchanged by projection onto $W$, so $\Pi_W(\mathbf{w}) = \mathbf{w}$. Geometrically, once a vector has been projected onto a subspace, projecting it again does nothing.
  key_insight: null
  distractor_rationale:
    A: |
      confuses projection with orthogonal complement or thinks repeated projection "removes" components
    B: |
      misunderstands how linear operators compose, perhaps thinking projection "adds" to itself
    D: |
      incorrectly thinks repeated projection causes normalization
    E: |
      fails to recognize that idempotency is independent of the original vector's position
