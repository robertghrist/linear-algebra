statement: |
  Let $J = \lambda I + N$ be a $k \times k$ Jordan block with eigenvalue
  $\lambda$ on the diagonal and a single superdiagonal of $1$'s, so that $N$
  is the $k \times k$ nilpotent matrix with $N^k = 0$. The matrix exponential
  $e^{Jt}$ controls the solution to $d\mathbf{x}/dt = J\mathbf{x}$.
  Which of the following is the most accurate description of $e^{Jt}$, and
  why?
choices:
- label: A
  text: $e^{Jt} = e^{\lambda t}\!\left(I + tN + \tfrac{t^2}{2!}N^2 + \cdots + \tfrac{t^{k-1}}{(k-1)!}N^{k-1}\right)$,
    because $\lambda I$ and $N$ commute and $N$ is nilpotent of index $k$.
- label: B
  text: $e^{Jt} = e^{\lambda I t} + e^{Nt}$, since the matrix exponential is additive over a sum of commuting
    matrices.
- label: C
  text: $e^{Jt}$ is undefined whenever $J$ is non-diagonalizable, since the matrix exponential requires
    an eigenbasis to compute.
- label: D
  text: $e^{Jt} = e^{\lambda t}\!\left(I + tN + \tfrac{t^2}{2!}N^2 + \cdots\right)$ as an infinite series,
    since the superdiagonal contributions never terminate.
- label: E
  text: $e^{Jt} = e^{\lambda t} I$, since the diagonal entry $\lambda$ governs the exponential growth
    rate.
figures: []
