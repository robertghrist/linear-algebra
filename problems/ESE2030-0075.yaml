  explanation: |
    Complex conjugate eigenvalues $\alpha \pm i\beta$ produce real basis solutions $e^{\alpha t}\cos(\beta t)$ and $e^{\alpha t}\sin(\beta t)$. Here $\alpha = -1$ and $\beta = 3$. The simple real eigenvalue $\lambda = 2$ gives $e^{2t}$. Thus the basis is $\{e^{2t}, e^{-t}\cos(3t), e^{-t}\sin(3t)\}$.
