  conflict: null
  explanation: |
    Reading from the figure: - The right singular vectors (columns of $V$) are in the domain at $\pm 45°$: $\mathbf{v}_1 = (1,1)^T/\sqrt{2}$ and $\mathbf{v}_2 = (1,-1)^T/\sqrt{2}$ - The semi-axis lengths give $\sigma_1 = 3/2$ (major) and $\sigma_2 = 1/2$ (minor) - The left singular vectors (columns of $U$) align with the ellipse axes in the codomain: $\mathbf{u}_1 = (1,-1)^T/\sqrt{2}$ (at $-45°$) and $\mathbf{u}_2 = (1,1)^T/\sqrt{2}$ (at $45°$)
  key_insight: null
  distractor_rationale:
    A: |
      swaps $U$ and $V$; confuses which singular vectors live in domain vs codomain
    C: |
      places smaller singular value first; violates the convention $\sigma_1 \geq \sigma_2 \geq \cdots \geq 0$
    D: |
      uses negative singular value $-1/2$; singular values must be non-negative by definition
    E: |
      (uses $\sigma_i^2$ instead of $\sigma_i$; confuses eigenvalues of $A^TA$ with singular values) %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%% %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
