statement: |
  Let $A$ be a square matrix. After performing QR decomposition you compute $A = QR$.
  Which statement about this QR decomposition must be true?
choices:
- label: A
  text: The matrix $Q^TQ^{-1}$ is the identity matrix
- label: B
  text: The diagonal entries of $R$ are all positive
- label: C
  text: The columns of $Q$ form an orthonormal basis
- label: D
  text: The matrix $R$ is invertible
- label: E
  text: More than one statement above is true
figures: []
answer:
  correct: C
  partial_credit: []
  verified: true
  verified_from:
  - quizzes-exams/2025-C/2030-Q2-ANSWERS.tex
