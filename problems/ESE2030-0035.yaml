  explanation: |
    In QR decomposition: \begin{itemize} \item $Q$ has orthonormal columns by definition \item $R$ is upper triangular \item Diagonal entries of $R$ can be negative (depends on algorithm) \item $R$ is invertible only if $A$ has full rank \item For orthogonal $Q$: $Q^TQ^{-1} = Q^T(Q^T) = (Q^T)^2 \neq I$ in general \end{itemize} Why option (A) is false: Since $Q^{-1} = Q^T$ for orthogonal matrices, we get $Q^TQ^{-1} = (Q^T)^2$, which is NOT the identity matrix unless $Q^T$ is an involution (rare special case).
