statement: |
  A $3 \times 3$ matrix $A$ has eigenvalues $\lambda_1 = 0.7$,
  $\lambda_2 = -0.9$, and $\lambda_3 = 0.2$.
  Consider the iteration $\mathbf{x}_{k+1} = A\mathbf{x}_k$ starting
  from a generic initial condition $\mathbf{x}_0$.
  What is the long-term behavior of $\mathbf{x}_k$?
choices:
- label: A
  text: $\mathbf{x}_k$ may converge or diverge depending on the initial condition
- label: B
  text: $\mathbf{x}_k$ oscillates indefinitely without settling to a limit
- label: C
  text: $\mathbf{x}_k$ converges to a dominant eigenvector
- label: D
  text: $\mathbf{x}_k$ converges to $\mathbf{0}$ for every initial condition
- label: E
  text: $\mathbf{x}_k$ diverges due to oscillations at each step
figures: []
answer:
  correct: D
  partial_credit:
  - B
  verified: true
