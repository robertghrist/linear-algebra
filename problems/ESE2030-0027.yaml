statement: |
  Suppose ${\mathcal S} = \{\mathbf{v}_1, \mathbf{v}_2, \mathbf{v}_3\}$ is an orthonormal set in an inner product space $V$. Which of the following must be true?
choices:
- label: A
  text: Any linear combination $c_1\mathbf{v}_1 + c_2\mathbf{v}_2 + c_3\mathbf{v}_3$ has length $\sqrt{c_1^2
    + c_2^2 + c_3^2}$
- label: B
  text: The vectors ${\mathcal S}$ automatically form a basis for $V$
- label: C
  text: The sum $\mathbf{v}_1 + \mathbf{v}_2 + \mathbf{v}_3$ is a unit vector
- label: D
  text: The matrix with columns $[\mathbf{v}_1 \mid \mathbf{v}_2 \mid \mathbf{v}_3]$ has determinant $\pm
    1$
- label: E
  text: None of the above
