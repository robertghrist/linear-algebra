statement: |
  A feedforward network of the text's form is to take $\mathbf{x} \in \mathbb{R}^3$ to $\hat{\mathbf{y}} \in \mathbb{R}^2$ through one hidden layer of width $5$, with elementwise activation $\varsigma$. Which expression is such a network?
choices:
- label: A
  text: $\hat{\mathbf{y}} = \varsigma\big(W_2\,\varsigma(W_1\mathbf{x} + \mathbf{b}_1) + \mathbf{b}_2\big)$, with $W_1 \in \mathbb{R}^{5\times 3}$, $W_2 \in \mathbb{R}^{2\times 5}$
- label: B
  text: $\hat{\mathbf{y}} = W_2\,\varsigma(W_1\mathbf{x} + \mathbf{b}_1) + \mathbf{b}_2$, with $W_1 \in \mathbb{R}^{5\times 3}$, $W_2 \in \mathbb{R}^{2\times 5}$
- label: C
  text: $\hat{\mathbf{y}} = W_2\,\varsigma(W_1\mathbf{x} + \mathbf{b}_1) + \mathbf{b}_2$, with $W_1 \in \mathbb{R}^{3\times 5}$, $W_2 \in \mathbb{R}^{5\times 2}$
- label: D
  text: $\hat{\mathbf{y}} = W_2 W_1 \mathbf{x} + \mathbf{b}$, with $W_1 \in \mathbb{R}^{5\times 3}$, $W_2 \in \mathbb{R}^{2\times 5}$
- label: E
  text: $\hat{\mathbf{y}} = W_2\,\varsigma(\mathbf{x}) + \mathbf{b}_2$, with $W_2 \in \mathbb{R}^{2\times 3}$
figures: []
answer:
  correct: B
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    The architecture alternates affine maps with an elementwise activation, and the final line of (13.2) is purely linear: $\hat{\mathbf{y}} = W_\Lambda \mathbf{h}_{\Lambda-1} + \mathbf{b}_\Lambda$ with no $\varsigma$. A hidden layer of width $5$ fed by $\mathbb{R}^3$ needs $W_1$ with $5$ rows and $3$ columns; the read-out to $\mathbb{R}^2$ needs $W_2 \in \mathbb{R}^{2\times 5}$. Option B is the only expression with the right alternation, the right shapes, and a linear read-out.
  key_insight: null
  distractor_rationale:
    A: |
      Trick: activation applied to the read-out. In the text's architecture the last layer is linear, so that whatever the network computed is linearly readable from the final hidden vector.
    C: |
      Distractor: shapes transposed. $W_1\mathbf{x}$ with $W_1 \in \mathbb{R}^{3\times 5}$ and $\mathbf{x} \in \mathbb{R}^3$ is not even defined; the width of a layer is the number of rows of its matrix.
    D: |
      Trick: no activation at all, so the 'two layers' collapse to the single affine map $\mathbf{x} \mapsto (W_2 W_1)\mathbf{x} + \mathbf{b}$ (the Section 13.1 point).
    E: |
      Distractor: activation applied to the raw input before any affine map, with no hidden layer at all.
