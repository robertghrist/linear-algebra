  explanation: |
    A matrix $A = \begin{pmatrix} a & b \\ c & d \end{pmatrix}$ is in $W$ iff $A\begin{pmatrix}1\\1\end{pmatrix} = \begin{pmatrix}a+b\\c+d\end{pmatrix} = \begin{pmatrix}0\\0\end{pmatrix}$. This gives two constraints: $a + b = 0$ and $c + d = 0$, i.e., $b = -a$ and $d = -c$. So $W = \left\{ \begin{pmatrix} a & -a \\ c & -c \end{pmatrix} : a, c \in \mathbb{R} \right\}$, which has basis $\left\{ \begin{pmatrix} 1 & -1 \\ 0 & 0 \end{pmatrix}, \begin{pmatrix} 0 & 0 \\ 1 & -1 \end{pmatrix} \right\}$. Thus $\dim(W) = 2$.
  key_insight: null
  distractor_rationale:
    A: |
      miscounts the degrees of freedom
    C: |
      treats the two constraints as one, or miscounts free parameters
    D: |
      ignores the constraints entirely
    E: |
      $W$ is the kernel of the linear map $A \mapsto A\begin{pmatrix}1\\1\end{pmatrix}$, hence is a subspace
