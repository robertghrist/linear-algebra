  explanation: |
    The solution space to an $n$-th order linear homogeneous ODE always has dimension $n$. This follows from the existence and uniqueness theorem: specifying $n$ initial conditions (e.g., $x(0), x'(0), x''(0)$ for a third-order equation) uniquely determines a solution, meaning the solution space is parametrized by $n$ independent constants. Equivalently, the companion matrix is $3 \times 3$ and has 3 eigenvalues (counted with multiplicity), yielding 3 basis solutions of the form $e^{\lambda_i t}$ (or modified forms for repeated roots).
  key_insight: null
  distractor_rationale:
    A: |
      confuses the order of the equation with thinking there's a single "general solution"
    B: |
      perhaps counting the number of derivative terms, or misremembering
    D: |
      off-by-one error, perhaps thinking about degrees vs. order
    E: |
      incorrectly thinks the dimension changes based on eigenvalue properties like distinctness or sign, when in fact it's always $n$ for an $n$-th order equation
