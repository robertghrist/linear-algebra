  conflict: null
  explanation: |
    The cosine of the angle is $\frac{\langle\mathbf{u},\mathbf{w}\rangle}{\|\mathbf{u}\|\|\mathbf{w}\|} = \frac{\langle\mathbf{u}, 2\mathbf{u} - 3\mathbf{v}\rangle}{\|\mathbf{u}\|\|\mathbf{w}\|} = \frac{2\|\mathbf{u}\|^2 - 3\langle\mathbf{u},\mathbf{v}\rangle}{\|\mathbf{u}\|\|\mathbf{w}\|}$. This is the general formula using inner products.
  key_insight: null
  distractor_rationale:
    B: |
      uses norms instead of inner product in numerator
