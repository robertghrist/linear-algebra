statement: |
  Let $\mathbf{u}, \mathbf{v} \in \mathbb{R}^n$ be nonzero vectors with angle $\theta$ between them.
  If we define $\mathbf{w} = 2\mathbf{u} - 3\mathbf{v}$, which expression gives the cosine of the angle between $\mathbf{u}$ and $\mathbf{w}$?
choices:
- label: A
  text: $\cos\theta$ because scaling does not change angles
- label: B
  text: $\displaystyle \frac{2\|\mathbf{u}\|^2 - 3\|\mathbf{v}\|^2}{2\|\mathbf{u}\| \cdot \|\mathbf{w}\|}$
- label: C
  text: $\displaystyle \frac{2 - 3\cos\theta}{\sqrt{4 + 9 - 12\cos\theta}} \cdot \frac{\|\mathbf{u}\|}{\|\mathbf{v}\|}$
- label: D
  text: $\displaystyle \frac{2\|\mathbf{u}\|^2 - 3\langle\mathbf{u},\mathbf{v}\rangle}{\|\mathbf{u}\|
    \cdot \|\mathbf{w}\|}$
- label: E
  text: $2 - 3\cos\theta$ after normalizing both vectors
figures: []
answer:
  correct: D
  partial_credit:
  - C
  verified: true
  verified_from:
  - quizzes-exams/2025-C/2030-Q2-ANSWERS.tex
