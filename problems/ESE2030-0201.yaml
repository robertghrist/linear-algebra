  conflict: null
  explanation: |
    The matrix of $T$ is $A = \begin{bmatrix} 1 & 0 & 2 \\ 0 & 1 & -1 \end{bmatrix}$, so $T^*$ is represented by $A^T = \begin{bmatrix} 1 & 0 \\ 0 & 1 \\ 2 & -1 \end{bmatrix}$, mapping $\mathbb{R}^2 \to \mathbb{R}^3$. This $3 \times 2$ matrix has rank $2$ (both columns are independent), so $T^*$ is injective.
  key_insight: null
  distractor_rationale:
    A: |
      $T^*$ maps into $\mathbb{R}^3$ with a $2$-dimensional image, so it is not surjective; students who confuse injectivity with surjectivity or who think rank $2$ means surjective into $\mathbb{R}^3$ pick this
    B: |
      gets the direction of $T^*$ backwards: $T^*$ maps $\mathbb{R}^2 \to \mathbb{R}^3$, not $\mathbb{R}^3 \to \mathbb{R}^2$. Also conflates the kernels: $\ker(T)$ is $1$-dimensional in $\mathbb{R}^3$ while $\ker(T^*) = \{\mathbf{0}\}$.
    C: |
      tempting for students who half-remember the FTLA: the correct relationship is $\operatorname{im}(T^*) = \ker(T)^\perp$, not $\ker(T)$. Here $\ker(T)$ is $1$-dimensional while $\operatorname{im}(T^*)$ is $2$-dimensional --- they are orthogonal complements in $\mathbb{R}^3$, not equal.
