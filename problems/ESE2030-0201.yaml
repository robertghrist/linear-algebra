statement: |
  Let $T: \mathbb{R}^3 \to \mathbb{R}^2$ be defined by $T(x_1, x_2, x_3) = (x_1 + 2x_3,\; x_2 - x_3)$, with the standard dot product on both spaces. Which statement about the adjoint $T^*$ is true?
choices:
- label: A
  text: '$T^*: \mathbb{R}^2 \to \mathbb{R}^3$ is surjective.'
- label: B
  text: '$T^*: \mathbb{R}^3 \to \mathbb{R}^2$ and has the same kernel as $T$.'
- label: C
  text: $\operatorname{im}(T^*) = \ker(T)$.
- label: D
  text: '$T^*: \mathbb{R}^2 \to \mathbb{R}^3$ is injective.'
- label: E
  text: $T^*$ does not exist because $T$ is not invertible.
figures: []
answer:
  correct: D
  partial_credit:
  - C
  verified: true
  verified_from:
  - quizzes-exams/2026-A/2030-Q2-SOLUTIONS.tex
