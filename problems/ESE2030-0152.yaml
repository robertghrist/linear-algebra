statement: |
  Consider the linear system $\displaystyle \frac{d\mathbf{x}}{dt} = A\mathbf{x}$ where $A$ is a constant $n \times n$ matrix.

  The solution is $\mathbf{x}(t) = e^{At}\mathbf{x}_0$. What is the fundamental reason that the matrix exponential $e^{At}$ solves this differential equation?
choices:
- label: A
  text: The eigenvalues of $A$ determine stability, and $e^{At}$ encodes this stability information through
    exponential decay or growth
- label: B
  text: Differentiating $e^{At}$ with respect to $t$ produces $Ae^{At}$, so $\frac{d}{dt}(e^{At}\mathbf{x}_0)
    = A(e^{At}\mathbf{x}_0)$
- label: C
  text: The Taylor series $I + At + \frac{(At)^2}{2!} + \cdots$ converges for all matrices $A$ and all
    times $t$
- label: D
  text: Matrix exponentials generalize scalar exponentials, and $e^{at}$ solves $\frac{dx}{dt} = ax$
- label: E
  text: The matrix $e^{At}$ is always invertible, ensuring that solutions exist and are unique
figures: []
answer:
  correct: B
  partial_credit:
  - A
  verified: true
