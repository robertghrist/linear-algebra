  explanation: |2
     Given: dim(V) = 7, dim(W) = 5, rank(T) = dim(im(T)) = 3. By rank-nullity: dim(ker(T)) = 7 - 3 = 4. dim(coim(T)) = dim(V/ker(T)) = dim(V) - dim(ker(T)) = 7 - 4 = 3. (Alternatively, by the Fundamental Theorem, coim(T) ≅ im(T), so dim(coim) = rank = 3.) dim(coker(T)) = dim(W/im(T)) = dim(W) - dim(im(T)) = 5 - 3 = 2. So dim(coim) = 3 and dim(coker) = 2. ✓
  key_insight: null
  distractor_rationale:
    A: |
      ker and coker are NOT generally isomorphic; here dim(ker)=4, dim(coker)=2
    B: |
      im and coker are NOT isomorphic; im ⊆ W while coker = W/im
    E: |
      dim(ker) = 4 but dim(coim) = 3; these are complementary, not equal
