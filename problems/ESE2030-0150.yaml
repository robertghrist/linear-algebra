statement: |
  Let $T: V \to W$ be a linear transformation between finite-dimensional vector spaces with $\dim(V) = 7$, $\dim(W) = 5$, and $\text{rank}(T) = 3$.

  Consider the four fundamental spaces: $\ker(T)$, $\text{im}(T)$, $\text{coim}(T)$, and $\text{coker}(T)$.

  Which statement is TRUE?
choices:
- label: A
  text: $\ker(T)$ and $\text{coker}(T)$ are isomorphic.
- label: B
  text: $\text{im}(T)$ and $\text{coker}(T)$ are isomorphic.
- label: C
  text: $\dim(\text{coim}(T)) = 4$ and $\dim(\text{coker}(T)) = 3$.
- label: D
  text: $\dim(\text{coim}(T)) = 3$ and $\dim(\text{coker}(T)) = 2$.
- label: E
  text: $\ker(T)$ and $\text{coim}(T)$ have the same dimension.
figures: []
answer:
  correct: D
  partial_credit:
  - C
