statement: |
  A student claims that a matrix with a very small determinant must be ill-conditioned, so that solving $A\mathbf{x} = \mathbf{b}$ with it is numerically unreliable. Which matrix is a counterexample to the claim?
choices:
- label: A
  text: $\begin{bmatrix} 1 & 1 \\ 1 & 1.001 \end{bmatrix}$
- label: B
  text: $\begin{bmatrix} 0.001 & 0 \\ 0 & 0.001 \end{bmatrix}$
- label: C
  text: $\begin{bmatrix} 1 & 0 \\ 0 & 0.001 \end{bmatrix}$
- label: D
  text: $\begin{bmatrix} 1000 & 0 \\ 0 & 0.001 \end{bmatrix}$
- label: E
  text: $\begin{bmatrix} 1 & 1 \\ 1 & -1 \end{bmatrix}$
figures: []
answer:
  correct: B
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Conditioning measures how unequally a matrix stretches different directions: the ratio of the largest stretch to the smallest. The matrix $0.001\,I$ has determinant $10^{-6}$ but stretches every direction by the same factor, so a relative error in $\mathbf{b}$ becomes the same relative error in $\mathbf{x}$; it is as well-conditioned as the identity. The determinant is a product of stretches and says nothing about their ratio. (Chapter 10 makes this precise with singular values; here it is the qualitative warning of Section 1.8.)
  key_insight: null
  distractor_rationale:
    A: |
      Distractor: this one has a small determinant and IS ill-conditioned (nearly parallel rows), so it supports the claim rather than refuting it.
    C: |
      Distractor: small determinant and ill-conditioned (stretches one direction $1000$ times more than the other); consistent with the claim.
    D: |
      Trick: determinant exactly $1$ yet badly conditioned. It refutes the converse claim (that a determinant near $1$ means well-conditioned), not the claim that was made.
    E: |
      Distractor: well-conditioned, but its determinant is $-2$, not small, so it does not test the claim at all.
