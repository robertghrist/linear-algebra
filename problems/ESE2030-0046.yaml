  explanation: |
    The matrix representation $[T]_{\mathcal{B}}^{\mathcal{C}}$ has columns that are coordinate vectors of $T$ applied to each basis vector of the domain. Specifically: $T(1) = 0 = 0 \cdot 1 + 0 \cdot x$, so column 1 is $\begin{pmatrix}0\\0\end{pmatrix}$; $T(x) = 1 = 1 \cdot 1 + 0 \cdot x$, so column 2 is $\begin{pmatrix}1\\0\end{pmatrix}$; $T(x^2) = 2x = 0 \cdot 1 + 2 \cdot x$, so column 3 is $\begin{pmatrix}0\\2\end{pmatrix}$. Thus $[T]_{\mathcal{B}}^{\mathcal{C}} = \begin{bmatrix} 0 & 1 & 0 \\ 0 & 0 & 2 \end{bmatrix}$.
