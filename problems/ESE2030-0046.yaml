statement: |
  Let $T: \mathcal{P}_2 \to \mathcal{P}_1$ be the differentiation operator defined by $T(p) = p'$.
  Consider two bases: $\mathcal{B} = \{1, x, x^2\}$ for $\mathcal{P}_2$ and $\mathcal{C} = \{1, x\}$ for $\mathcal{P}_1$.
  Let $[T]_{\mathcal{B}}^{\mathcal{C}}$ denote the matrix of $T$ with respect to these bases.
  Which statement about this matrix representation is true?
choices:
- label: A
  text: The columns of $[T]_{\mathcal{B}}^{\mathcal{C}}$ are the coordinate vectors of $T(1), T(x), T(x^2)$
    with respect to $\mathcal{C}$
- label: B
  text: The rows of $[T]_{\mathcal{B}}^{\mathcal{C}}$ represent how each basis vector in $\mathcal{B}$
    transforms under $T$
- label: C
  text: The matrix $[T]_{\mathcal{B}}^{\mathcal{C}}$ is square
- label: D
  text: If we change to the basis $\mathcal{B}' = \{1, 1+x, 1+x+x^2\}$, the matrix $[T]_{\mathcal{B}'}^{\mathcal{C}}$
    may change rank
- label: E
  text: Since $T$ has a non-trivial kernel, we can make $[T]_{\mathcal{B}}^{\mathcal{C}}$ invertible by
    removing the kernel basis vectors from $\mathcal{B}$
figures: []
answer:
  correct: A
