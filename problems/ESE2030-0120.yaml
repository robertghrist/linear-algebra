statement: |
  Let $T: V \to W$ be a function between vector spaces. Which statement about
  the following three properties of $T$ being linear is most correct?

  \begin{tabular}{rl}
  (I) & $T(\mathbf{0}_V) = \mathbf{0}_W$ \\[4pt]
  (II) & $T(\mathbf{u} + \mathbf{v}) = T(\mathbf{u}) + T(\mathbf{v})$ for all $\mathbf{u}, \mathbf{v} \in V$ \\[4pt]
  (III) & $T(c\mathbf{v}) = cT(\mathbf{v})$ for all $c \in \mathbb{R}$, $\mathbf{v} \in V$
  \end{tabular}
choices:
- label: A
  text: Properties (I), (II), and (III) are all independent; each must be verified separately to confirm
    linearity.
- label: B
  text: Property (I) alone is sufficient to guarantee linearity.
- label: C
  text: Properties (II) and (III) together imply property (I), so checking (II) and (III) is sufficient.
- label: D
  text: Properties (I) and (II) together imply property (III).
- label: E
  text: Property (II) alone implies both (I) and (III).
figures: []
answer:
  correct: C
