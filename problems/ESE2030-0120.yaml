  explanation: |2
     The definition of linearity requires (II) additivity and (III) homogeneity. Property (I) follows automatically: using (III) with c = 0 gives T(0·v) = 0·T(v), hence T(0_V) = 0_W. So we only need to check (II) and (III); property (I) is a consequence. This is why T(0) ≠ 0 is a quick non-linearity test — if (I) fails, then (III) must fail (with c = 0), so T cannot be linear.
  key_insight: null
  distractor_rationale:
    B: |
      T(0) = 0 is necessary but not sufficient
    D: |
      additivity + T(0)=0 does NOT imply homogeneity; e.g., T(v) = v for v ∈ ℚ, T(v) = 0 otherwise
    E: |
      additivity alone does NOT imply homogeneity over ℝ; requires continuity or some regularity
