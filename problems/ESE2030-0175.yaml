statement: |
  Let $\mathcal{C}^\infty(\mathbb{R})$ denote the vector space of all infinitely differentiable functions $f: \mathbb{R} \to \mathbb{R}$. Consider the set
  $$S = \left\{ f \in \mathcal{C}^\infty(\mathbb{R}) : f'' - 3f' + 2f = 0 \right\}.$$

  Which statement best explains why $S$ is a subspace of smooth functions $\mathcal{C}^\infty(\mathbb{R})$?
choices:
- label: A
  text: $S$ is nonempty because the functions $e^x$ and $e^{2x}$ are both solutions.
- label: B
  text: The zero function satisfies $0'' - 3(0') + 2(0) = 0$, and any scalar multiple of a solution is
    again a solution.
- label: C
  text: $S$ is the kernel of the linear operator $T = D^2 - 3D + 2I$, where $D$ denotes differentiation,
    and the kernel of any linear operator is a subspace.
- label: D
  text: Differential equations always have solution sets that form vector spaces.
- label: E
  text: The equation is second-order, so its solution set is 2-dimensional and therefore a subspace.
figures: []
answer:
  correct: C
  partial_credit:
  - B
  verified: true
  verified_from:
  - quizzes-exams/2026-A/2030-Q1-SOLUTIONS.tex
