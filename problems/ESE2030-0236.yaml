statement: |
  The network below takes input $\mathbf{x} \in \mathbb{R}^3$ and produces output $\mathbf{y} \in \mathbb{R}^2$:
  \begin{tikzpicture}[
      node distance=1.5cm,
      block/.style={rectangle, draw, minimum height=1cm, minimum width=1.6cm, align=center},
      arrow/.style={->, >=stealth, thick}
  ]
  \node (x) {$\mathbf{x}$};
  \node[block, right of=x, node distance=1.8cm] (L1) {$W_1,\ \mathbf{b}_1$};
  \node[right of=L1, node distance=2.2cm] (h) {$\mathbf{h}$};
  \node[block, right of=h, node distance=1.8cm] (L2) {$W_2,\ \mathbf{b}_2$};
  \node[right of=L2, node distance=1.8cm] (y) {$\mathbf{y}$};

  \draw[arrow] (x) -- (L1);
  \draw[arrow] (L1) -- (h);
  \draw[arrow] (h) -- (L2);
  \draw[arrow] (L2) -- (y);
  \end{tikzpicture}
  Each block applies the stated weights and biases to its input, with no activation function between blocks.
  Which statement best describes what this network can compute?
choices:
- label: A
  text: A more limited class of functions than a single-block map.
- label: B
  text: '(approximately) Any continuous function $f: \mathbb{R}^3 \to \mathbb{R}^2$, since it has a hidden
    layer.'
- label: C
  text: It reduces to a single linear map.
- label: D
  text: Exactly what a single-block affine map computes; the extra block adds no expressive power.
- label: E
  text: Any quadratic function of $\mathbf{x}$, since composing two blocks introduces second-order terms.
figures: []
answer:
  correct: D
  partial_credit: []
