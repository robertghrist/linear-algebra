statement: |
  Let $\mathbf{g} \in \mathbb{R}^n$ have independent standard normal coordinates, with $n$ large. Where does a typical sample of $\mathbf{g}$ lie?
choices:
- label: A
  text: Near the sphere of radius $\sqrt{n}$
- label: B
  text: Near the origin, where the density is largest
- label: C
  text: Near the sphere of radius $n$
- label: D
  text: Spread roughly uniformly through the ball of radius $\sqrt{n}$
- label: E
  text: Near the sphere of radius $\sqrt{2n}$
figures: []
answer:
  correct: A
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    $\norm{\mathbf{g}}^2 = \sum_i g_i^2$ is a sum of $n$ independent terms of mean $1$ and variance $2$, so it has mean $n$ and standard deviation $\sqrt{2n}$: the length concentrates near $\sqrt{n}$ with relative fluctuations of order $1/\sqrt{n}$. The density is maximal at the origin, but the volume of a shell at radius $r$ grows like $r^{n-1}$; the product $r^{n-1}e^{-r^2/2}$ peaks near $r = \sqrt{n}$. The origin wins the density contest and loses the volume contest.
  key_insight: null
  distractor_rationale:
    B: |
      Trick: confuses the peak of the density with where the mass is; a listed idea in the text ('the pulp of the high-dimensional orange is in its peel').
    C: |
      Distractor: $n$ is the mean of $\norm{\mathbf{g}}^2$, not of $\norm{\mathbf{g}}$.
    D: |
      Distractor: the ball of radius $0.99\sqrt{n}$ holds an exponentially small fraction of the mass; nothing is uniform here.
    E: |
      Trick: $\sqrt{2n}$ is the typical DISTANCE BETWEEN two independent samples, not the length of one.
