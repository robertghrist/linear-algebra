  conflict: null
  explanation: |
    Since $A$ is $m \times n$, we have $A^T$ is $n \times m$, so $A^TA$ is $n \times n$. Full column rank guarantees $A^TA$ is invertible, so $(A^TA)^{-1}$ is $n \times n$. Thus $A^\dagger = (A^TA)^{-1}A^T$ is $n \times m$. Computing $A^\dagger A = (A^TA)^{-1}A^TA = I_n$: the pseudoinverse is a \emph{left} inverse of $A$.
  key_insight: null
  distractor_rationale:
    A: |
      gets the side wrong: $A^\dagger A = I_n$, not $AA^\dagger = I_m$. The product $AA^\dagger$ is $m \times m$ but equals the projection onto $\operatorname{im}(A)$, not $I_m$. Students who confuse left and right inverses pick this. Note also the dimension mismatch: $I_m$ is $m \times m$ but $A^\dagger A$ is $n \times n$.
    C: |
      a common fear: since $A$ is not square, students worry that $A^TA$ might also be defective. But $A^TA$ is $n \times n$ and full column rank of $A$ guarantees it is invertible. This distractor catches students who do not trace the dimensions carefully.
    D: |
      $A\mathbf{x} = \mathbf{b}$ is overdetermined ($m > n$), so exact solutions exist only when $\mathbf{b} \in \operatorname{im}(A)$. For general $\mathbf{b}$, $A^\dagger \mathbf{b}$ gives the \emph{least squares} solution minimizing $\|A\mathbf{x} - \mathbf{b}\|$, not an exact solution. Students who conflate least squares with exact solving pick this.
