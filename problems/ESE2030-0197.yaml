statement: |
  Let $A$ be an $m \times n$ matrix with $m > n$ and $\operatorname{rank}(A) = n$ (full column rank). The pseudoinverse is $A^\dagger = (A^TA)^{-1}A^T$. Which of the following statements is TRUE?
choices:
- label: A
  text: $A^\dagger A = I_m$, so $A^\dagger$ is a right inverse of $A$.
- label: B
  text: $A^\dagger$ is an $n \times m$ matrix, and $A^\dagger A = I_n$.
- label: C
  text: $(A^TA)^{-1}$ does not exist because $A$ is not square.
- label: D
  text: $A^\dagger \mathbf{b}$ solves $A\mathbf{x} = \mathbf{b}$ exactly for every $\mathbf{b} \in \mathbb{R}^m$.
- label: E
  text: $A^\dagger = A^{-1}$ after discarding the extra rows of $A$.
figures: []
answer:
  correct: B
  partial_credit:
  - A
  verified: true
  verified_from:
  - quizzes-exams/2026-A/2030-Q2-SOLUTIONS.tex
