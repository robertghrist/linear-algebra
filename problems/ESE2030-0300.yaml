statement: |
  You want the constant $c$ that minimizes $\mathbb{E}\big((f - c)^2\big)$ for a given random variable $f$. Which principle answers the question, and what is $c$?
choices:
- label: A
  text: Orthogonal projection of $f$ onto $\operatorname{span}\{\mathbf{1}\}$; $c = \mathbb{E}(f)$
- label: B
  text: Orthogonal projection of $f$ onto $\mathbf{1}^\perp$; $c = \mathbb{E}(f)$
- label: C
  text: Cauchy-Schwarz; $c = \sigma(f)$
- label: D
  text: Gram-Schmidt applied to $\{f, \mathbf{1}\}$; $c = \norm{f}_\rho$
- label: E
  text: Markov's inequality; $c = \mathbb{E}(f)$
figures: []
answer:
  correct: A
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    $\mathbb{E}((f-c)^2) = \norm{f - c\mathbf{1}}_\rho^2$, the squared distance from $f$ to a point of the line spanned by $\mathbf{1}$. The best approximation in a subspace is the orthogonal projection (Lemma 6.5), which here is $\langle f, \mathbf{1}\rangle_\rho \mathbf{1} = \mathbb{E}(f)\mathbf{1}$. The minimum value is $\mathbb{V}(f)$.
  key_insight: null
  distractor_rationale:
    B: |
      Trick: the right value with the wrong subspace --- projection onto $\mathbf{1}^\perp$ is centering, which produces the residual, not the constant.
    C: |
      Distractor: Cauchy-Schwarz bounds an inner product; it does not locate a minimizer.
    D: |
      Distractor: Gram-Schmidt manufactures an orthonormal basis; it is not a minimization principle, and $\norm{f}_\rho$ is not the answer.
    E: |
      Trick: right value, wrong principle --- Markov bounds a tail probability and says nothing about least squares.
