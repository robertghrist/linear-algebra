  explanation: |
    The matrix exponential is defined by the power series $e^A = I + A + \frac{A^2}{2!} + \frac{A^3}{3!} + \cdots$. Applied to $-N$: $$e^{-N} = I + (-N) + \frac{(-N)^2}{2!} + \frac{(-N)^3}{3!} + \cdots.$$ Since $N$ is nilpotent with $N^3 = 0$, the series terminates after three terms. The key observation is that $(-N)^2 = N^2$ — squaring cancels the sign — so $$e^{-N} = I - N + \frac{N^2}{2}.$$ Computing $N^2 = \begin{bmatrix} 0 & 0 & 1 \\ 0 & 0 & 0 \\ 0 & 0 & 0 \end{bmatrix}$ and assembling gives the answer in (C). \emph{Alternative path:} since $e^N$ and $e^{-N}$ commute and their product is $e^{N + (-N)} = e^0 = I$, we have $e^{-N} = (e^N)^{-1}$. A student who computes $e^N$ and inverts the resulting upper-triangular matrix arrives at the same place. This route emphasizes that $e^A$ is always invertible — a foundational fact about the matrix exponential.
  key_insight: null
  distractor_rationale:
    A: |
      twin pair to (D): computed $e^{N}$ instead of $e^{-N}$, \emph{and} forgot the factorial. The student missed the negative sign in the question entirely. No partial credit; the sign error is fundamental.
    B: |
      negates the sign of \emph{every} term, including the $N^2$ term, missing that $(-N)^2 = +N^2$. A subtle but fundamental error: squaring cancels signs. Catches students who reflexively flip every sign rather than thinking term-by-term.
