statement: |
  A diagonalizable $2 \times 2$ matrix $A$ has eigenvalues $\lambda_1 = 2$
  and $\lambda_2 = -1$ with corresponding eigenvectors $\mathbf{v}_1$
  and $\mathbf{v}_2$.

  Given an initial vector $\mathbf{x}_0 = 3\mathbf{v}_1 + 5\mathbf{v}_2$,
  what is $A^{100}\mathbf{x}_0$?
choices:
- label: A
  text: $(3 \cdot 2^{100} + 5)\,\mathbf{v}_1$
- label: B
  text: $2^{100}(3\,\mathbf{v}_1 + 5\,\mathbf{v}_2)$
- label: C
  text: $3 \cdot 2^{100}\,\mathbf{v}_1 - 5\,\mathbf{v}_2$
- label: D
  text: $3 \cdot 2^{100}\,\mathbf{v}_1$
- label: E
  text: None of the above
figures: []
answer:
  correct: E
  partial_credit:
  - C
  verified: true
  verified_from:
  - quizzes-exams/2026-A/2030-Q3-SOLUTIONS.tex
