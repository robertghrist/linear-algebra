statement: |
  In the probability inner product $\langle f, g\rangle_\rho = \sum_{i=1}^N \rho_i f_i g_i$, the constant random variable $\mathbf{1} = (1, \ldots, 1)^T$ satisfies $\norm{\mathbf{1}}_\rho = 1$. This fact is the same as which property of the density $\rho$?
choices:
- label: A
  text: $\sum_i \rho_i = 1$
- label: B
  text: $\rho_i > 0$ for every $i$
- label: C
  text: $\rho_i = 1/N$ for every $i$
- label: D
  text: $\mathbb{V}(\mathbf{1}) = 0$
- label: E
  text: $\mathbb{E}(f) \leq \max_i f_i$ for every $f$
figures: []
answer:
  correct: A
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    $\norm{\mathbf{1}}_\rho^2 = \sum_i \rho_i \cdot 1 \cdot 1 = \sum_i \rho_i$, so unit length of the constant vector is exactly total-probability-one. Positivity of the weights (B) is a different hypothesis: it is what makes the form positive-definite, not what makes $\mathbf{1}$ a unit vector.
  key_insight: null
  distractor_rationale:
    B: |
      Trick: positivity of the weights buys positive-definiteness of the inner product; it says nothing about the length of $\mathbf{1}$.
    C: |
      Distractor: the uniform density is one density among many with total mass one.
    D: |
      Distractor: true of $\mathbf{1}$ under any density, so it cannot be equivalent to a property of $\rho$.
    E: |
      Distractor: a consequence of nonnegativity and unit mass together, not the length statement.
