  conflict: null
  explanation: |
    The stationary distribution of a random walk on a graph reflects the long-term proportion of time spent in each state. When two rooms have identical rows AND columns in the transition matrix, they are topologically equivalent—they have the same connectivity structure to the rest of the network. This symmetry forces the stationary distribution to assign equal probability to these rooms. Since the robot's long-term behavior is described by the eigenvector for $\lambda = 1$, and this eigenvector must respect the symmetry of $P$, rooms 1 and 4 must have equal components. This is a manifestation of the symmetry principle in Markov chains.
  key_insight: null
  distractor_rationale:
    B: |
      the stationary distribution is unique for this irreducible chain and doesn't depend on initial conditions
    C: |
      long-term behavior is independent of starting position; confuses transient and stationary behavior
    D: |
      eigenvalues are properties of the matrix, not individual states; confuses state symmetry with spectral properties
    E: |
      matrix powers preserve connectivity; symmetry doesn't cause disconnection
