statement: |
  A data matrix $A \in \mathbb{R}^{100 \times 50}$ represents measurements where rows are observations and columns are features. The SVD $A = U\Sigma V^T$ reveals that only the first 10 singular values are nonzero: $\sigma_1 \geq \sigma_2 \geq \cdots \geq \sigma_{10} > 0$ and $\sigma_{11} = \cdots = \sigma_{50} = 0$.

  An analyst wants to understand the fundamental subspaces. Which statement is most TRUE?
choices:
- label: A
  text: The first 10 right singular vectors $\mathbf{v}_1, \ldots, \mathbf{v}_{10}$ span the column space
    of $A$, capturing the 10 most important patterns in the observations.
- label: B
  text: The first 10 left singular vectors $\mathbf{u}_1, \ldots, \mathbf{u}_{10}$ span a 10-dimensional
    subspace of feature space where all data variation occurs.
- label: C
  text: The right singular vectors $\mathbf{v}_{11}, \ldots, \mathbf{v}_{50}$ form a basis for $\ker(A)$,
    representing 40 redundant feature combinations.
- label: D
  text: The left singular vectors $\mathbf{u}_{11}, \ldots, \mathbf{u}_{100}$ span $\ker(A^T)$, representing
    observation directions that have no correlation with any features.
- label: E
  text: Both (C) and (D) are correct.
figures: []
