statement: |
  Ridge regression minimizes $\|A\mathbf{x} - \mathbf{b}\|^2 + \lambda\|\mathbf{x}\|^2$ with solution $\mathbf{x}_\lambda$. The parameter $\lambda > 0$ is increased. What happens to the size of the solution $\|\mathbf{x}_\lambda\|$ and to the residual $\|A\mathbf{x}_\lambda - \mathbf{b}\|$?
choices:
- label: A
  text: $\|\mathbf{x}_\lambda\|$ decreases; the residual does not decrease
- label: B
  text: Both $\|\mathbf{x}_\lambda\|$ and the residual decrease
- label: C
  text: $\|\mathbf{x}_\lambda\|$ increases; the residual decreases
- label: D
  text: $\|\mathbf{x}_\lambda\|$ decreases; the residual is unchanged
- label: E
  text: Both $\|\mathbf{x}_\lambda\|$ and the residual increase
figures: []
answer:
  correct: A
  partial_credit:
  - D
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    The penalty $\lambda\|\mathbf{x}\|^2$ charges for the size of the solution, and a larger $\lambda$ charges more, so the minimizer shrinks. The unpenalized least squares solution already makes the residual as small as it can be; any other $\mathbf{x}$, the shrunken one included, has a residual at least as large. Regularization trades fit for a smaller, better-behaved solution: it shrinks $\mathbf{x}$, not the residual. (Chapter 10 will show it as damping of the small singular values.)
  key_insight: null
  distractor_rationale:
    B: |
      Trick: the listed trap. Ridge cannot lower the residual below the least squares minimum; it moves away from that minimum on purpose.
    C: |
      Distractor: backwards on both counts; the penalty pushes $\mathbf{x}$ toward zero, not away.
    D: |
      Partial credit: sees that the penalty shrinks the solution. Insight 1 of 2: $\|\mathbf{x}_\lambda\|$ decreases with $\lambda$. Missing: leaving the least squares minimizer costs fit, so the residual grows. Prefix: yes. Guessable: no. Defensible: yes.
    E: |
      Distractor: the residual does grow, but the solution shrinks; the penalty is on $\|\mathbf{x}\|$.
