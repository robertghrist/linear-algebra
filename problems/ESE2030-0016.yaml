statement: |
  Consider the system $A\mathbf{x} = \mathbf{b}$ where $A$ is a $3 \times 3$ matrix. If row reduction of the augmented matrix $[\, A\, |\, \mathbf{b}\, ]$ yields exactly two pivots, which statement must be TRUE?
choices:
- label: A
  text: The system has a unique solution
- label: B
  text: The system has infinitely many solutions if it has any solution at all
- label: C
  text: The system is inconsistent
- label: D
  text: The matrix $A$ is invertible
- label: E
  text: None of the above
figures: []
answer:
  correct: B
  partial_credit:
  - E
  verified: true
  verified_from:
  - quizzes-exams/2025-C/2030-Q1-ANSWERS.tex
  conflict: null
  explanation: |
    With 2 pivots in a $3 \times 3$ system: \begin{itemize} \item One row lacks a pivot (becomes a zero row or inconsistent row) \item If the third row is $[0\ 0\ 0\ |\ b_3]$ with $b_3 \neq 0$: inconsistent \item If the third row is $[0\ 0\ 0\ |\ 0]$: one free variable → infinitely many solutions \item The system either has no solutions or infinitely many (never unique) \end{itemize}
  key_insight: |
    Number of free variables = number of columns minus number of pivots in coefficient matrix.
