statement: |
  A matrix $A \in \mathbb{R}^{4 \times 3}$ has rank 2 with SVD $A = U\Sigma V^T$ and left singular vectors $U = [\mathbf{u}_1 \; \mathbf{u}_2 \; \mathbf{u}_3 \; \mathbf{u}_4]$.
  Consider the vector $\mathbf{b} = 2\mathbf{u}_1 - \mathbf{u}_2 + 4\mathbf{u}_4$.
  Does the system $A\mathbf{x} = \mathbf{b}$ have a solution and, if it does, how many?
choices:
- label: A
  text: Exactly one solution, because the pseudoinverse $A^\dagger\mathbf{b}$ is unique.
- label: B
  text: No solution, because the system is overdetermined (more equations than unknowns).
- label: C
  text: Infinitely many solutions, because $\mathrm{rank}(A) = 2 < 3$ means there is one free variable.
- label: D
  text: No solution, because $\mathbf{b}$ has a nonzero component in $\mathrm{im}(A)^\perp$.
- label: E
  text: Exactly one solution, because $\mathbf{b}$ has nonzero component in $\mathrm{im}(A)$.
figures: []
answer:
  correct: D
  partial_credit: []
