statement: |
  Let $[C]$ be the covariance matrix of a centered data set and let $\mathbf{w}$ be a unit vector. What does $\mathbf{w}^T[C]\mathbf{w}$ measure, and over all unit vectors where is it largest?
choices:
- label: A
  text: The correlation between $\mathbf{w}$ and the data; largest value $1$
- label: B
  text: The mean of the data projected onto $\mathbf{w}$; largest along the direction of the mean
- label: C
  text: The variance of the data projected onto $\mathbf{w}$; largest at the first principal component, with value $\lambda_{\max}$
- label: D
  text: The variance of the data projected onto $\mathbf{w}$; largest at the last principal component, with value $\lambda_{\min}$
- label: E
  text: The total variance of the data; the same for every unit $\mathbf{w}$
figures: []
answer:
  correct: C
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Projecting each centered data point onto $\mathbf{w}$ gives the scalars $\mathbf{x}_i^T\mathbf{w}$, whose variance is $\frac{1}{n}\sum_i(\mathbf{x}_i^T\mathbf{w})^2 = \mathbf{w}^T[C]\mathbf{w}$. That is the Rayleigh quotient of the symmetric matrix $[C]$ on the unit sphere, so its maximum is $\lambda_{\max}$, attained at the top eigenvector, which is by definition the first principal component. PCA is the Rayleigh quotient at work: the direction of greatest variance is the direction the quotient singles out.
  key_insight: null
  distractor_rationale:
    A: |
      Distractor: correlation is a cosine between two centered variables; $\mathbf{w}$ is a direction, not a variable, and the quadratic form has the units of variance.
    B: |
      Trick: the data are centered, so the projected mean is zero along every direction; and the mean would be linear in $\mathbf{w}$, not quadratic.
    D: |
      Distractor: the minimum of the Rayleigh quotient is at $\lambda_{\min}$; the question asks for the maximum.
    E: |
      Distractor: the total variance is the trace of $[C]$, the sum over an orthonormal basis of directions; a single direction captures only its share.
