statement: |
  Consider the vector space $M_{m \times n}(\mathbb{R})$ of all $m \times n$ real matrices, equipped with the Frobenius inner product $\langle A, B \rangle_F = \operatorname{tr}(A^T B)$. Which of the following is TRUE?
choices:
- label: A
  text: For square matrices, $\|A\|_F = \sqrt{\langle A, A\rangle} = \sqrt{\operatorname{tr}(A^2)}$
- label: B
  text: $\langle A, B \rangle_F = 0$ if and only if $A^T B = \mathbf{0}$
- label: C
  text: $\langle A, B \rangle_F = \sum_{i,j} a_{ij}\,b_{ij}$
- label: D
  text: This satisfies the definition of an inner product only for square matrices
- label: E
  text: None of the above
figures: []
answer:
  correct: C
  partial_credit: []
