  conflict: null
  explanation: |
    The complex-valued function $e^{\lambda t}\mathbf{v} = e^{(\alpha + i\beta)t}\mathbf{v}$ is a genuine solution to $d\mathbf{x}/dt = A\mathbf{x}$. Applying Euler's formula, $e^{(\alpha + i\beta)t} = e^{\alpha t}(\cos(\beta t) + i\sin(\beta t))$, so the complex solution splits into a real part and an imaginary part, each of which is itself a real solution by linearity. The trigonometric functions appear precisely because Euler's formula \emph{is} the bridge between complex exponentials and oscillation. Every other appearance of $\cos(\beta t)$ and $\sin(\beta t)$ in this setting — in the $2\times 2$ block formula, in the matrix-exponential Taylor series, in the structure of damped oscillators — derives from this single identity. The conjugate-pair structure (B) explains why we end up with \emph{real} solutions, but does not by itself explain why those solutions are \emph{trigonometric}. The block-form (C) and Taylor-series (D) facts are correct \emph{consequences}: they are how Euler's formula manifests in matrix language, not the underlying reason. Pedagogically, when students see ``where does $\cos(\beta t)$ come from?'', the answer should be Euler's formula first; the matrix-exponential derivation is a verification of what Euler already guarantees.
  key_insight: null
  distractor_rationale:
    B: |
      correct fact, wrong question — conjugate pairing explains real-valuedness, not trigonometric structure. A classic D4 surface-match: ``complex conjugate'' is the right vocabulary for a different question.
    C: |
      true fact about the real Jordan block, but the rotation interpretation is itself a consequence of Euler's formula applied to $e^{Jt}$. Catches students who pattern-match on ``rotation'' without asking where the rotation came from.
    D: |
      the naive-prior D5: confuses physical motivation with mathematical justification. Complex numbers do appear in solutions; we extract real solutions by linearity, not by fiat.
