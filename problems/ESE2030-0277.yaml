statement: |
  A real matrix $A$ has a complex conjugate pair of eigenvalues $\lambda = \alpha \pm i\beta$ with $\beta \neq 0$. The system $d\mathbf{x}/dt = A\mathbf{x}$ has real basis solutions involving $e^{\alpha t} \cos(\beta t)$ and $e^{\alpha t} \sin(\beta t)$. Which of the following is the most fundamental reason these trigonometric functions appear?
choices:
- label: A
  text: Euler's formula $e^{i\beta t} = \cos(\beta t) + i\sin(\beta t)$ converts the complex exponential
    solution into trigonometric form.
- label: B
  text: Because $A$ is real, complex eigenvalues must occur in conjugate pairs, forcing the imaginary
    parts of solutions to cancel.
- label: C
  text: The $2 \times 2$ real block associated with $\alpha \pm i\beta$ has the form $\begin{bmatrix}
    \alpha & -\beta \\ \beta & \alpha \end{bmatrix}$, which is a scaled rotation matrix.
- label: D
  text: Complex numbers do not appear in physically meaningful solutions, so they must be replaced by
    trigonometric functions.
- label: E
  text: The matrix exponential's Taylor series collapses into the series for sine and cosine when applied
    to the Jordan block.
figures: []
answer:
  correct: A
  partial_credit:
  - E
  verified: true
  verified_from:
  - quizzes-exams/2026-A/2030-FINAL-EXAM.tex
