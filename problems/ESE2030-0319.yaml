statement: |
  Stochastic gradient descent replaces the full gradient, an average over all $n$ training examples, by the average over a mini-batch of $b$ examples drawn uniformly at random. The batch size is raised from $b$ to $4b$. What happens to the bias of the mini-batch gradient as an estimate of the full gradient, and to the bound on its variance?
choices:
- label: A
  text: Bias falls by a factor of $4$; variance bound falls by a factor of $4$
- label: B
  text: Bias stays zero; variance bound falls by a factor of $2$
- label: C
  text: Bias stays zero; variance bound falls by a factor of $4$
- label: D
  text: Bias stays zero; variance bound is unchanged
- label: E
  text: Bias falls by a factor of $4$; variance bound is unchanged
figures: []
answer:
  correct: C
  partial_credit:
  - B
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Each index is drawn uniformly, so by linearity of expectation the mini-batch gradient has expectation equal to the full gradient at every batch size: it is unbiased, and no batch size changes that (Lemma 13.8). Its variance is that of a mean of $b$ draws, at most $\nu^2/b$, so quadrupling $b$ divides the bound by $4$. Batch size trades arithmetic for variance and never buys correctness; this is Week 12's expectation estimated by a sample.
  key_insight: null
  distractor_rationale:
    A: |
      Trick: the listed trap of believing mini-batch gradients are biased and that larger batches are 'more correct'. Only the variance changes.
    B: |
      Partial credit: standard deviation confused with variance. Insight 1 of 2: unbiased at every batch size. Missing: the bound is $\nu^2/b$ on the variance, so a factor of $4$ in $b$ is a factor of $4$ in variance (a factor of $2$ in standard deviation). Prefix: yes. Guessable: no. Defensible: yes.
    D: |
      Distractor: treats batch size as irrelevant to the quality of the estimate.
    E: |
      Trick: both parts wrong in the same misconception --- bias where there is none, and no benefit from averaging more samples.
