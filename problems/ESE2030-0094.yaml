statement: |
  A $5 \times 5$ matrix $A$ has characteristic polynomial $p(\lambda) = (\lambda - 2)^3(\lambda + 1)^2$. Suppose you compute $\dim(\ker(A - 2I)) = 2$ and $\dim(\ker(A + I)) = 2$.

  What can you conclude about $A$?
choices:
- label: A
  text: $A$ is diagonalizable
- label: B
  text: $A$ is not diagonalizable
- label: C
  text: $A$ has Jordan blocks of size at least 2
- label: D
  text: The matrix $A - 2I$ has rank 2
- label: E
  text: Both (B) and (C)
figures: []
