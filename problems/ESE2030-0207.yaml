statement: |
  Let $G$ be an undirected graph on $n$ vertices with adjacency matrix $A$
  and degree matrix $D = \operatorname{diag}(d_1, \ldots, d_n)$. The graph
  Laplacian is $L = D - A$.

  Which of the following best explains why $\lambda = 0$ is always an
  eigenvalue of $L$, regardless of the graph?
choices:
- label: A
  text: Every row of $L$ sums to zero, so the all-ones vector $\mathbf{1}$ is in $\ker(L)$
- label: B
  text: $L = D - A$ is a difference of two matrices, and the subtraction causes cancellation that forces
    a zero eigenvalue
- label: C
  text: The diagonal entries of $L$ are non-negative and the off-diagonal entries are non-positive, which
    forces at least one eigenvalue to be zero
- label: D
  text: $L$ is symmetric, and symmetric matrices always have at least one zero eigenvalue
- label: E
  text: None of the above
figures: []
answer:
  correct: A
  partial_credit: []
