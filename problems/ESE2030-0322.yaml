statement: |
  A prompt of $n$ tokens is the matrix $X \in \mathbb{R}^{d \times n}$, one column per token, and an attention head returns $Y = VS \in \mathbb{R}^{d_v \times n}$ with $S = \operatorname{softmax}(K^TQ/\sqrt{d_k})$ column by column. The tokens are reordered by an $n \times n$ permutation matrix $P$, replacing $X$ by $XP$. What does the head now return?
choices:
- label: A
  text: $Y$
- label: B
  text: $VPS$
- label: C
  text: $YP^T$
- label: D
  text: $YP$
- label: E
  text: $P^TYP$
figures: []
answer:
  correct: D
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Every projection acts column by column, so $Q, K, V$ become $QP, KP, VP$. The scores become $(KP)^T(QP) = P^T(K^TQ)P$, which permutes rows and columns alike; column-wise softmax commutes with that, giving $P^TSP$; and $(VP)(P^TSP) = VSP = YP$ since $PP^T = I$. Attention is permutation equivariant (Theorem 13.13): shuffle the tokens and the outputs shuffle along, none the wiser. That blindness to order is why positional information must be added to the embeddings as data.
  key_insight: null
  distractor_rationale:
    A: |
      Trick: invariance rather than equivariance. The outputs are the same vectors, but attached to the tokens in their new positions; $Y$ itself is a different matrix.
    B: |
      Distractor: moves the values but leaves the attention matrix fixed. $S$ is manufactured from the tokens and reorders with them, to $P^TSP$.
    C: |
      Distractor: the permutation applied backwards. $Y \mapsto YP$, matching $X \mapsto XP$; $P^T = P^{-1}$ undoes the reordering instead.
    E: |
      Distractor: conjugation is what happens to the square $n\times n$ matrix $S$, not to $Y$; $Y$ has $d_v$ rows, so $P^TY$ is not even defined in general.
