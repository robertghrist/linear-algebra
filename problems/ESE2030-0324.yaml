statement: |
  An autoencoder compresses data through an encoder $E:\mathbb{R}^n \to \mathbb{R}^k$ and a decoder $D:\mathbb{R}^k \to \mathbb{R}^n$ with $k \ll n$, trained so that $D(E(\mathbf{x})) \approx \mathbf{x}$ across the data. Take $E$ and $D$ linear. Why does the text study the fundamental spaces of the round trip $D \circ E$ rather than those of the encoder $E$ alone?
choices:
- label: A
  text: The encoder discards nothing; all of the forgetting happens in the decoder
- label: B
  text: A trained encoder is generically injective, so its kernel is trivial and reveals nothing
- label: C
  text: A trained encoder is generically surjective, so its image is all of $\mathbb{R}^k$ and its cokernel is trivial
- label: D
  text: The image of the encoder is the learned model of where the data lives, but it cannot be computed without the decoder
- label: E
  text: The encoder alone has no kernel or image, since only the round trip maps a space to itself
figures: []
answer:
  correct: C
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    A trained encoder $E \in \mathbb{R}^{k\times n}$ with $k \ll n$ is generically of full rank $k$, hence onto: $\operatorname{im} E = \mathbb{R}^k$ and $\operatorname{coker} E = 0$. Its kernel has dimension $n - k$, but the bottleneck space $\mathbb{R}^k$ carries no geometry of its own, so the encoder by itself has little to confess. The round trip $D\circ E:\mathbb{R}^n\to\mathbb{R}^n$ lives in the data's own space, and there the four subspaces mean something: $\ker(D\circ E)$ is the variation discarded and $\operatorname{im}(D\circ E)$ is the learned model of where the data lives.
  key_insight: null
  distractor_rationale:
    A: |
      Trick: backwards. The dimension drops at the encoder ($n \to k$), so that is where variation is discarded; the decoder $D$ is generically injective and discards nothing.
    B: |
      Distractor: a map from $\mathbb{R}^n$ to $\mathbb{R}^k$ with $k < n$ cannot be injective; its kernel has dimension at least $n-k$.
    D: |
      Trick: the listed trap of reading the encoder's spaces for meaning. The learned model of the data is $\operatorname{im}(D\circ E) \subset \mathbb{R}^n$; the encoder's image is just $\mathbb{R}^k$.
    E: |
      Distractor: every linear map has a kernel and an image, whatever its domain and codomain. The issue is that the encoder's are uninformative, not that they do not exist.
