statement: |
  An attention head acts on three tokens whose value vectors $\mathbf{v}_1, \mathbf{v}_2, \mathbf{v}_3 \in \mathbb{R}^2$ are drawn as points in the figure, along with five marked points. Which marked point could be the output $\mathbf{y}_i$ of the head for some token $i$?
choices:
- label: A
  text: P
- label: B
  text: Q
- label: C
  text: R
- label: D
  text: S
- label: E
  text: T
figures:
- ESE2030-0321-a.png
answer:
  correct: A
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    The output for token $i$ is $\mathbf{y}_i = \sum_j s_{ji}\mathbf{v}_j$ with the $i$th column of $S$ a softmax output: entrywise positive weights summing to one. So $\mathbf{y}_i$ is a convex combination of the values with every weight strictly positive, and lies strictly inside the triangle whose vertices are $\mathbf{v}_1, \mathbf{v}_2, \mathbf{v}_3$. Only P does. Attention decides the mixture; it cannot leave the convex hull of its own values.
  key_insight: null
  distractor_rationale:
    B: |
      Trick: Q lies in the span of the values (all of $\mathbb{R}^2$ here) but outside their convex hull; reaching it needs a negative weight, and softmax weights are positive.
    C: |
      Trick: R sits on the edge joining $\mathbf{v}_1$ to $\mathbf{v}_3$, a mixture with zero weight on $\mathbf{v}_2$. Softmax never assigns weight exactly zero, so the output stays in the interior. (Hard attention that ignores a token is not what the mechanism computes.)
    D: |
      Distractor: S is the plain sum $\mathbf{v}_1 + \mathbf{v}_2 + \mathbf{v}_3$, weights not normalized to one; the mixture is a density, not a count.
    E: |
      Distractor: T is a difference of two values, a linear combination with a negative coefficient --- outside the hull and not a mixture at all.
