  explanation: |
    The power of the eigenbasis is that the matrix $A$ acts simply by scaling each eigenvector by its eigenvalue. In the eigenbasis, $A$ has the diagonal representation $[A]_{\mathcal{B}} = \begin{bmatrix} 6 & 0 \\ 0 & 1 \end{bmatrix}$. Therefore, when we multiply in eigenbasis coordinates: $[A\mathbf{x}]_{\mathcal{B}} = [A]_{\mathcal{B}}[\mathbf{x}]_{\mathcal{B}} = \begin{bmatrix} 6 & 0 \\ 0 & 1 \end{bmatrix}\begin{pmatrix} 3 \\ -2 \end{pmatrix} = \begin{pmatrix} 18 \\ -2 \end{pmatrix}$. Each coordinate simply gets scaled by the corresponding eigenvalue: the first coordinate ($3$) is multiplied by $\lambda_1 = 6$ to give $18$, and the second coordinate ($-2$) is multiplied by $\lambda_2 = 1$ to give $-2$. This is the fundamental simplification that diagonalization provides.
