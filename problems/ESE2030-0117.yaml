      counts superdiagonals
    D: |
      (counts all 16 entries, ignoring the triangular constraint) %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
