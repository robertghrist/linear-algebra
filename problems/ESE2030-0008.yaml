statement: |
  Consider the permutation matrix $P = \begin{bmatrix} 0 & 1 & 0 \\ 0 & 0 & 1 \\ 1 & 0 & 0 \end{bmatrix}$. Which of the following statements about $P$ is TRUE?
choices:
- label: A
  text: $P^2 = I$ %(applying $P$ twice gives the identity)
- label: B
  text: $P^3 = I$ %(applying $P$ three times gives the identity)
- label: C
  text: $P^{-1} = -P$ %(the inverse is the negative)
- label: D
  text: $P^{-1} = P$ %(reverses the permutation)
- label: E
  text: None of the above
figures: []
answer:
  correct: B
  partial_credit:
  - D
  verified: true
  verified_from:
  - quizzes-exams/2025-C/2030-Q1-ANSWERS.tex
  conflict: null
  explanation: |
    This permutation matrix cycles rows: $1 \to 2 \to 3 \to 1$. Computing powers: \begin{itemize} \item $P$ maps: row 1 → row 2, row 2 → row 3, row 3 → row 1 \item $P^2$ maps: row 1 → row 3, row 2 → row 1, row 3 → row 2 \item $P^3$ maps: row 1 → row 1, row 2 → row 2, row 3 → row 3 (identity!) \end{itemize} For this 3-cycle: $P^{-1} = P^2 \neq P$ (unlike 2-cycles where $P^{-1} = P$).
  key_insight: |
    For an $n$-cycle permutation, $P^n = I$.
