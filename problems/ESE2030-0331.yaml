statement: |
  Which of the following vector spaces is infinite-dimensional?
choices:
- label: A
  text: $\mathcal{P}_{100}$, the polynomials of degree at most $100$
- label: B
  text: The solutions of $y'' + y = 0$ on $\mathbb{R}$
- label: C
  text: $\mathbb{R}^{10\times 10}$, the $10\times 10$ real matrices
- label: D
  text: The symmetric $4\times 4$ real matrices
- label: E
  text: $\mathcal{P}$, the polynomials of every degree
figures: []
answer:
  correct: E
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    A space is infinite-dimensional when it has no finite spanning set. In $\mathcal{P}$ the monomials $1, x, x^2, \ldots, x^n$ are independent for every $n$; were some $k$ polynomials to span $\mathcal{P}$, the Exchange Bound would cap every independent set at $k$ members, and the monomials do not respect the cap. The other four spaces have finite bases: $101$, $2$, $100$, and $10$ elements respectively. A large dimension is still a dimension.
  key_insight: null
  distractor_rationale:
    A: |
      Distractor: $\dim \mathcal{P}_{100} = 101$; large, but the monomials $1, \ldots, x^{100}$ are a finite spanning set.
    B: |
      Trick: a space of functions, but a two-dimensional one, spanned by $\cos t$ and $\sin t$. Being made of functions does not make a space infinite-dimensional.
    C: |
      Distractor: dimension $100$, one for each entry.
    D: |
      Distractor: dimension $10$, one for each entry on or above the diagonal.
