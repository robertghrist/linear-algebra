  conflict: null
  explanation: |
    For a transformation to be linear, it must satisfy $T(\mathbf{0}) = \mathbf{0}$. Check $F$: $F(0,0) = (0+1, 0, 0-0) = (1, 0, 0) \neq (0, 0, 0)$ This immediately disqualifies $F$. Additionally, $F$ fails additivity: $$F(x_1+x_2, y_1+y_2) = (x_1+x_2+1, y_1+y_2, x_1+x_2-y_1-y_2)$$ $$\neq F(x_1,y_1) + F(x_2,y_2) = (x_1+1, y_1, x_1-y_1) + (x_2+1, y_2, x_2-y_2)$$ All other options preserve the zero vector and satisfy linearity.
