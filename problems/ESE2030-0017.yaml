statement: |
  Which one of the following is NOT a linear transformation?
choices:
- label: A
  text: '$T: \mathbb{R}^2 \to \mathbb{R}^2$ defined by $T(x,y) = (x-y, 0)$'
- label: B
  text: '$S: \mathcal{P}_2 \to \mathcal{P}_2$ defined by $S(p(x)) = xp''(x)$ where $p''$ denotes the derivative'
- label: C
  text: '$R: \mathbb{R}^3 \to \mathbb{R}$ defined by $R(x,y,z) = 2x - 3y + z$'
- label: D
  text: '$F: \mathbb{R}^2 \to \mathbb{R}^3$ defined by $F(x,y) = (x+1, y, x-y)$'
- label: E
  text: '$G: \mathbb{R}^{2\times 2} \to \mathbb{R}$ defined by $G(A) = \text{trace}(A)$ (trace is the
    sum of diagonal terms)'
figures: []
answer:
  correct: D
  partial_credit: []
  verified: true
