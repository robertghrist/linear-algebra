  conflict: null
  explanation: |
    The orthogonal decomposition gives $\mathbf{v} = \hat{\mathbf{v}} + \mathbf{r}$ with $\hat{\mathbf{v}} \in W$ and $\mathbf{r} \in W^\perp$, satisfying $\langle \hat{\mathbf{v}}, \mathbf{r} \rangle = 0$. By the Pythagorean theorem, $\|\mathbf{v}\|^2 = \|\hat{\mathbf{v}}\|^2 + \|\mathbf{r}\|^2$, so $\|\hat{\mathbf{v}}\| \leq \|\mathbf{v}\|$ with equality iff $\mathbf{v} \in W$. None of (A)--(D) is universally true.
  key_insight: null
  distractor_rationale:
    A: |
      confuses projection with an isometry; projection preserves norm only when $\mathbf{v} \in W$ already, in which case $\mathbf{r} = \mathbf{0}$. For any $\mathbf{v} \notin W$, Pythagoras gives strict inequality.
    B: |
      remembers that the projection and residual have a special inner-product relationship, but the value is $0$, not $1$; orthogonality is the defining geometric property of the decomposition
    D: |
      true for ``generic'' $\mathbf{v}$, and true in the overdetermined least-squares setting students are most familiar with, but fails when $\mathbf{v} \in W$: then $\hat{\mathbf{v}} = \mathbf{v}$ and $\mathbf{r} = \mathbf{0}$. Students who forget the edge case pick this.
