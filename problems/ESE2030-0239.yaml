statement: |
  Let $\{\mathbf{u}_1, \mathbf{u}_2\}$ be orthonormal vectors in $\mathbb{R}^4$ and
  $\{\mathbf{v}_1, \mathbf{v}_2\}$ be orthonormal vectors in $\mathbb{R}^3$. A matrix is defined as:
  $$A = 3\,\mathbf{u}_1\mathbf{v}_1^T + 7\,\mathbf{u}_2\mathbf{v}_2^T.$$
  Which of the following is most TRUE?
choices:
- label: A
  text: $A$ has rank 2; its singular values are $7$ and $3$.
- label: B
  text: $A$ has rank 1, since adding two rank-1 terms produces a rank-1 matrix.
- label: C
  text: $A$ has rank 2; its singular values are $49$ and $9$.
- label: D
  text: $A$ has rank 2; its singular values are $\sqrt{7}$ and $\sqrt{3}$.
- label: E
  text: The singular values of $A$ cannot be determined without knowing the specific entries of the $\mathbf{u}_i$
    and $\mathbf{v}_i$.
figures: []
answer:
  correct: A
  partial_credit: []
