statement: |
  A symmetric $3\times 3$ matrix $A$ has eigenvalues $1$, $4$, and $9$. As $\mathbf{x}$ ranges over all nonzero vectors in $\mathbb{R}^3$, what is the set of values taken by $\dfrac{\mathbf{x}^TA\mathbf{x}}{\mathbf{x}^T\mathbf{x}}$?
choices:
- label: A
  text: $\{1, 4, 9\}$
- label: B
  text: $[1, 9]$
- label: C
  text: $[0, 9]$
- label: D
  text: $[4, 9]$
- label: E
  text: $(-\infty, \infty)$
figures: []
answer:
  correct: B
  partial_credit: []
