  conflict: null
  explanation: |
    This is the Rayleigh quotient. For symmetric $A$ its maximum is $\lambda_{\max} = 9$, attained at the corresponding eigenvector, and its minimum is $\lambda_{\min} = 1$; between them every value is attained, since the quotient is continuous on the connected unit sphere. In the eigenbasis the quotient is a weighted average $(c_1^2 + 4c_2^2 + 9c_3^2)/(c_1^2 + c_2^2 + c_3^2)$ of the eigenvalues, and a weighted average sweeps out exactly the interval between the extremes.
  key_insight: null
  distractor_rationale:
    A: |
      Trick: the eigenvalues are the values at the eigenvectors, but every other direction gives a mixture. The quotient is not confined to the spectrum; it fills the gaps.
    C: |
      Distractor: the lower end is $\lambda_{\min} = 1$, not $0$; since every eigenvalue is positive, $\mathbf{x}^TA\mathbf{x} > 0$ for all $\mathbf{x} \neq \mathbf{0}$.
    D: |
      Distractor: drops the smallest eigenvalue; the eigenvector for $\lambda = 1$ gives the quotient the value $1$.
    E: |
      Distractor: the denominator normalizes away the length of $\mathbf{x}$, and the numerator is then bounded by the extreme eigenvalues. Unboundedness would need a nonsymmetric matrix and a different story.
