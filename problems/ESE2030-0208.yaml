statement: |
  Which of the following is $e^{A}$ where
  $A = \begin{bmatrix} 0 & -2 & 0 \\ 0 & 0 & -2 \\ 0 & 0 & 0 \end{bmatrix}$?

  \noindent
  \begin{minipage}{0.33\textwidth}\centering
choices:
- label: A
  text: \begin{bmatrix} 1 & -2 & -2 \\ 0 & 1 & -2 \\ 0 & 0 & 1 \end{bmatrix}$ \end{minipage}% \begin{minipage}{0.33\textwidth}\centering
- label: B
  text: \begin{bmatrix} 1 & -2 & 4 \\ 0 & 1 & -2 \\ 0 & 0 & 1 \end{bmatrix}$ \end{minipage}% \begin{minipage}{0.33\textwidth}\centering
- label: C
