  explanation: |
    The matrix $A$ is strictly upper triangular, hence nilpotent. We compute: $$A^2 = \begin{bmatrix} 0 & -2 & 0 \\ 0 & 0 & -2 \\ 0 & 0 & 0 \end{bmatrix} \begin{bmatrix} 0 & -2 & 0 \\ 0 & 0 & -2 \\ 0 & 0 & 0 \end{bmatrix} = \begin{bmatrix} 0 & 0 & 4 \\ 0 & 0 & 0 \\ 0 & 0 & 0 \end{bmatrix}$$ and $A^3 = A^2 \cdot A = 0$ (which can be verified directly, or follows from the fact that an $n \times n$ strictly upper triangular matrix is nilpotent of index at most $n$). Since $A^k = 0$ for all $k \geq 3$, the power series terminates: $$e^A = I + A + \frac{1}{2!}A^2 = \begin{bmatrix} 1 & 0 & 0 \\ 0 & 1 & 0 \\ 0 & 0 & 1 \end{bmatrix} + \begin{bmatrix} 0 & -2 & 0 \\ 0 & 0 & -2 \\ 0 & 0 & 0 \end{bmatrix} + \frac{1}{2}\begin{bmatrix} 0 & 0 & 4 \\ 0 & 0 & 0 \\ 0 & 0 & 0 \end{bmatrix} = \begin{bmatrix} 1 & -2 & 2 \\ 0 & 1 & -2 \\ 0 & 0 & 1 \end{bmatrix}$$ The problem tests the entire chain: recognizing nilpotency so the series is finite, computing $A^2$ correctly (including the sign of $(-2)(-2) = +4$), applying the $\frac{1}{k!}$ coefficients properly, and assembling $I + A + \frac{1}{2}A^2$.
  key_insight: null
  distractor_rationale:
    B: |
      The student does the hard parts correctly --- nilpotent recognition, matrix squaring, series truncation --- but forgets the factorial denominators that distinguish $e^A$ from $\sum A^k$.
    E: |
      the student computes only $I + A$, believing the series terminates after the linear term. This means the student either thinks $A^2 = 0$ without checking --- confusing nilpotent index $2$ with index $3$ --- or doesn't realize that higher-order terms can contribute. The $(1,3)$ entry is $0$ instead of $2$, revealing that the $A^2$ contribution was missed entirely.
    C: |
      You do not simply exponentiate the terms
    A: |
      the student correctly sets up $I + A + \frac{1}{2}A^2$ and applies the factorial, but makes a sign error in computing $A^2$: gets $(-2)(-2) = -4$ instead of $+4$ in the $(1,3)$ entry, yielding $\frac{1}{2}(-4) = -2$. This is a pure arithmetic error in matrix multiplication, where the student loses track of the double negative.
