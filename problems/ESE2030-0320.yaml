statement: |
  The full-batch gradient averages the per-example gradients over all $n$ training examples; the mini-batch gradient averages them over $b$ examples chosen uniformly at random, and so is itself a random quantity. In the vocabulary of Chapter 12, the full-batch gradient is which object of the mini-batch gradient?
choices:
- label: A
  text: Its expectation
- label: B
  text: Its variance
- label: C
  text: Its conditional expectation given the chosen batch
- label: D
  text: A sample drawn from it
- label: E
  text: Its projection onto the mini-batch
figures: []
answer:
  correct: A
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    An average over $n$ items is an expectation under the uniform density on those items, and the mini-batch average is a sample mean of $b$ draws from that density. The sample mean's expectation is the population mean: the full gradient is the expectation of the mini-batch gradient, which is exactly the unbiasedness of Lemma 13.8. SGD is the Chapter 12 move --- an average too long to compute is an expectation, and an expectation can be estimated by a sample --- applied to the gradient.
  key_insight: null
  distractor_rationale:
    B: |
      Distractor: the variance measures how far the estimate scatters about the full gradient; it is a number, not a gradient.
    C: |
      Trick: once the batch is fixed there is no randomness left, so the conditional expectation given the batch is the mini-batch gradient itself, not the full one.
    D: |
      Trick: the roles reversed. The mini-batch gradient is the sample; the full gradient is what it estimates.
    E: |
      Distractor: vocabulary from the wrong sentence; a mini-batch is a set of indices, not a subspace one projects onto.
