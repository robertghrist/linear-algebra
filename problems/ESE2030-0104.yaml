statement: |
  An engineer monitors a chemical reactor with three sensors measuring temperature ($T$, in °C), pressure ($P$, in kPa), and flow rate ($F$, in mL/min). A week of measurements yields:
  $$\text{Temperature: } T \in [180, 220] \text{ °C}$$
  $$\text{Pressure: } P \in [2000, 2500] \text{ kPa}$$
  $$\text{Flow rate: } F \in [5, 15] \text{ mL/min}$$

  The engineer performs covariance PCA on the centered data and finds that the first principal component is approximately:
  $$\mathbf{v}_1 \approx (0.002, 0.998, 0.005)^T$$

  Which statement best explains this result?
choices:
- label: A
  text: Pressure dominates the first principal component because it has the largest absolute variance,
    masking potentially important patterns in temperature and flow.
- label: B
  text: The principal component correctly identifies pressure as the most important variable since it
    has the widest measurement range.
- label: C
  text: This result suggests the three variables are uncorrelated, with pressure varying independently
    of temperature and flow.
- label: D
  text: The small coefficients for temperature and flow indicate these variables contribute negligible
    information and can be discarded.
- label: E
  text: Covariance PCA automatically accounts for different measurement scales, so this result reveals
    genuine physical dominance of pressure variation.
figures: []
answer:
  correct: A
  partial_credit: []
  verified: true
  verified_from:
  - quizzes-exams/2025-C/2030-Q5-ANSWERS.tex
