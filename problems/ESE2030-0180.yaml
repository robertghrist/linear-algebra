  conflict: null
  explanation: |
    $F(A) = A^2$ is not linear. It fails homogeneity: $F(cA) = (cA)^2 = c^2 A^2 \neq c A^2 = cF(A)$ for $c \neq 0, 1$. It also fails additivity: $F(A+B) = (A+B)^2 = A^2 + AB + BA + B^2 \neq A^2 + B^2$ in general (matrix multiplication is not commutative, so the cross terms don't cancel). Importantly, $F(\mathbf{0}) = \mathbf{0}^2 = \mathbf{0}$, so the simplest check doesn't catch this failure.
  key_insight: null
  distractor_rationale:
    A: |
      swapping coordinates looks like ``rearrangement,'' but $T(\mathbf{u} + \mathbf{v}) = T(\mathbf{u}) + T(\mathbf{v})$ holds; this is a permutation matrix transformation
    B: |
      evaluation at a point seems computational/nonlinear, but $(p+q)(1) = p(1) + q(1)$ and $(cp)(1) = c \cdot p(1)$; evaluation functionals are linear
    C: |
      multiplying by $x$ seems to ``add a variable,'' but $R$ is linear \emph{in $p$}: $R(p+q) = x(p+q) = xp + xq = R(p) + R(q)$
    E: |
      the cumulative-sum pattern might look suspicious, but this is exactly the lower triangular matrix $\begin{psmallmatrix} 1 & 0 & 0 \\ 1 & 1 & 0 \\ 1 & 1 & 1 \end{psmallmatrix}$ acting on $(x,y,z)^T$
