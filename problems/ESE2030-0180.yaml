statement: |
  Which of the following is NOT a linear transformation?
choices:
- label: A
  text: '$T: \mathbb{R}^2 \to \mathbb{R}^2$ defined by $T(x,y) = (y, x)$'
- label: B
  text: '$S: \mathcal{P}_2 \to \mathbb{R}$ defined by $S(p) = p(1)$'
- label: C
  text: '$R: \mathcal{P}_2 \to \mathcal{P}_3$ defined by $R(p)(x) = x \cdot p(x)$'
- label: D
  text: '$F: \mathbb{R}^{2 \times 2} \to \mathbb{R}^{2 \times 2}$ defined by $F(A) = A^2$'
- label: E
  text: '$G: \mathbb{R}^3 \to \mathbb{R}^3$ defined by $G(x,y,z) = (x,\, x+y,\, x+y+z)$'
figures: []
answer:
  correct: D
  partial_credit: []
  verified: true
  verified_from:
  - quizzes-exams/2026-A/2030-Q1-SOLUTIONS.tex
