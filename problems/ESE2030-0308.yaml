statement: |
  A random projection is applied to $m$ points. For any one fixed pair of points, the probability that its squared distance is distorted beyond tolerance is at most $p$. Which bound on the probability that \emph{some} pair is distorted beyond tolerance follows from the union bound?
choices:
- label: A
  text: $\binom{m}{2}\,p$
- label: B
  text: $m\,p$
- label: C
  text: $p^{\,m(m-1)/2}$
- label: D
  text: $1 - (1-p)^m$
- label: E
  text: $p$
figures: []
answer:
  correct: A
  partial_credit:
  - B
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    The bad event is a union over pairs, of which there are $\binom{m}{2} < m^2/2$, and the union bound totals their probabilities without any independence assumption. Counting points instead of pairs (B) undercounts; a product (C) would require independence AND describes all pairs failing at once; (D) assumes independence and counts points; (E) ignores the union entirely.
  key_insight: null
  distractor_rationale:
    B: |
      Partial credit: applies the union bound but counts points rather than pairs. Insight 1 of 2 (sum the per-event probabilities); missing: the events are indexed by PAIRS. Prefix: yes. Guessable: no. Defensible: yes.
    C: |
      Trick: a product is the probability that EVERY pair fails, and only under independence.
    D: |
      Distractor: assumes independent failures (the union bound needs none) and counts points.
    E: |
      Distractor: the per-pair bound quoted as if it were the family bound --- the listed trap.
