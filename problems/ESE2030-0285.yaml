statement: |
  Let $A$ be a $2 \times 2$ matrix with eigenvalues $\lambda_1 = 2$ and $\lambda_2 = -1$ and corresponding eigenvectors
  $\mathbf{v}_1 = \begin{pmatrix} 1 \\ 1 \end{pmatrix},  \mathbf{v}_2 = \begin{pmatrix} 1 \\ -1 \end{pmatrix}$.
  What is the solution $\mathbf{x}(t)$ to the initial value problem
  \[
  \frac{d\mathbf{x}}{dt} = A\mathbf{x}, \qquad \mathbf{x}(0) = \begin{pmatrix} 3 \\ 1 \end{pmatrix}.
  \]
choices:
- label: A
  text: $2 e^{2t} \begin{pmatrix} 1 \\ 1 \end{pmatrix} + e^{-t} \begin{pmatrix} 1 \\ -1 \end{pmatrix}$
- label: B
  text: $2 e^{2t} \begin{pmatrix} 1 \\ 1 \end{pmatrix} + e^{t} \begin{pmatrix} 1 \\ -1 \end{pmatrix}$
- label: C
  text: $e^{2t} \begin{pmatrix} 3 \\ 1 \end{pmatrix} + e^{-t} \begin{pmatrix} 3 \\ 1 \end{pmatrix}$
- label: D
  text: $e^{2t} \begin{pmatrix} 1 \\ 1 \end{pmatrix} + 2 e^{-t} \begin{pmatrix} 1 \\ -1 \end{pmatrix}$
- label: E
  text: $3 e^{2t} \begin{pmatrix} 1 \\ 1 \end{pmatrix} + e^{-t} \begin{pmatrix} 1 \\ -1 \end{pmatrix}$
