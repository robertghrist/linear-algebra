  explanation: |
    For diagonalizable $A$, the general solution to $\dot{\mathbf{x}} = A\mathbf{x}$ is \[ \mathbf{x}(t) = c_1 e^{\lambda_1 t}\mathbf{v}_1 + c_2 e^{\lambda_2 t}\mathbf{v}_2, \] where the constants $c_1, c_2$ are the coordinates of $\mathbf{x}_0$ in the eigenbasis. Solving $\mathbf{x}(0) = c_1 \mathbf{v}_1 + c_2 \mathbf{v}_2 = \begin{pmatrix} 3 \\ 1 \end{pmatrix}$: \[ c_1 + c_2 = 3, \qquad c_1 - c_2 = 1 \quad \Longrightarrow \quad c_1 = 2, \; c_2 = 1. \] Hence $\mathbf{x}(t) = 2 e^{2t}\mathbf{v}_1 + e^{-t}\mathbf{v}_2$. [Equivalently: $\mathbf{x}(t) = e^{At}\mathbf{x}_0 = V e^{\Lambda t} V^{-1}\mathbf{x}_0$. The vector $V^{-1}\mathbf{x}_0 = (c_1, c_2)^T$ is the initial condition expressed in the eigenbasis; $e^{\Lambda t}$ scales each coordinate by $e^{\lambda_i t}$; $V$ converts back to standard coordinates.]
  key_insight: null
  distractor_rationale:
    E: |
      uses the entries of $\mathbf{x}_0 = (3,1)^T$ directly as the eigencomponent coefficients $c_1 = 3, c_2 = 1$, skipping the eigenbasis change of coordinates. This is the most common mistake: forgetting that $c_i$ are coordinates \emph{in the eigenbasis}, not coordinates of $\mathbf{x}_0$ in the standard basis.
    B: |
      sign error on the second eigenvalue: $e^{t}$ instead of $e^{-t}$. Coefficients are correct but $\lambda_2 = -1$, not $+1$.
    C: |
      wholesale conceptual error: treats $\mathbf{x}_0$ as if it were the eigenvector for both modes, replacing $\mathbf{v}_1$ and $\mathbf{v}_2$ with $\mathbf{x}_0$. Misses the fundamental role of eigenvectors as the directions of independent exponential evolution.
