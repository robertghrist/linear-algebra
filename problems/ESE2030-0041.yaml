statement: |
  Consider the transformation $T: \mathbb{R}^n \to \mathbb{R}^n$ on the standard Euclidean $n$-space
  given by $T(\mathbf{x}) = 5\mathbf{x}$ for all $\mathbf{x}$. Which geometric property does this transformation preserve?
choices:
- label: A
  text: Distances between two vectors, since it scales uniformly
- label: B
  text: Inner products between vectors, since scaling is linear
- label: C
  text: Angles between vectors, since all vectors are scaled equally
- label: D
  text: Lengths of vectors, since it is a multiple of the identity $I$
- label: E
  text: None of the above geometric properties are preserved
figures: []
answer:
  correct: C
  partial_credit: []
