  explanation: |
    For scalar multiplication by $c$: $\langle c\mathbf{u}, c\mathbf{v} \rangle = c^2\langle \mathbf{u}, \mathbf{v} \rangle$ and $\|c\mathbf{u}\| = |c|\|\mathbf{u}\|$. Thus $\cos\theta' = \frac{c^2\langle \mathbf{u},\mathbf{v}\rangle}{|c|\|\mathbf{u}\| \cdot |c|\|\mathbf{v}\|} = \frac{\langle \mathbf{u},\mathbf{v}\rangle}{\|\mathbf{u}\|\|\mathbf{v}\|} = \cos\theta$. Angles are preserved even though distances and inner products are not.
  key_insight: |
    Uniform scaling preserves angles but not distances or inner products.
  distractor_rationale:
    A: |
      distances are scaled by factor of 5, not preserved
    B: |
      inner products are scaled by factor of 25
