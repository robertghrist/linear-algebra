  conflict: null
  explanation: |
    Expand $A = \sum_i \sigma_i \mathbf{u}_i \mathbf{v}_i^T$ and apply it: $A\boldsymbol{\omega} = \sum_i \sigma_i (\mathbf{v}_i^T\boldsymbol{\omega})\,\mathbf{u}_i$. The coefficients $\mathbf{v}_i^T\boldsymbol{\omega}$ are independent standard normals (an orthonormal change of basis preserves the Gaussian), so one probe returns a random mixture of the left singular vectors in which each $\mathbf{u}_i$ speaks at its native volume $\sigma_i$. Directions with large singular values dominate the sketch; that is why stacking a few such probes and orthonormalizing them captures the dominant range.
  key_insight: null
  distractor_rationale:
    A: |
      Trick: one probe does not isolate the top direction; it returns all of them at once, weighted by $\sigma_i$. Isolating $\mathbf{u}_1$ would take repeated application (a power iteration), which the randomized SVD does not perform.
    B: |
      Distractor: right and left singular vectors swapped. $A$ carries $\mathbb{R}^n$ to $\mathbb{R}^m$, so the output is built from the $\mathbf{u}_i$, and the coefficients come from pairing $\boldsymbol{\omega}$ with the $\mathbf{v}_i$.
    C: |
      Partial credit: the right vectors with the singular values dropped. Insight 1 of 2: the probe returns a mixture of left singular vectors with Gaussian coefficients. Missing: each is scaled by $\sigma_i$, which is the whole reason the sketch favors the dominant range. Prefix: yes. Guessable: no. Defensible: yes.
    E: |
      Distractor: the output is Gaussian, but its covariance is $AA^T$; everything about $A$'s range and singular values is in it.
