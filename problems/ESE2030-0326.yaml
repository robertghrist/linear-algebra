statement: |
  Let $A \in \mathbb{R}^{m\times n}$ have singular value decomposition $A = U\Sigma V^T$ with singular vectors $\mathbf{u}_i$, $\mathbf{v}_i$ and singular values $\sigma_1 \geq \sigma_2 \geq \cdots$. The first step of the randomized SVD applies $A$ to a single Gaussian probe $\boldsymbol{\omega} \in \mathbb{R}^n$ with independent standard normal entries. What is $A\boldsymbol{\omega}$?
choices:
- label: A
  text: $\sigma_1 \mathbf{u}_1$, up to a random scalar
- label: B
  text: $\displaystyle\sum_i \sigma_i\,(\mathbf{u}_i^T\boldsymbol{\omega})\,\mathbf{v}_i$
- label: C
  text: $\displaystyle\sum_i (\mathbf{v}_i^T\boldsymbol{\omega})\,\mathbf{u}_i$
- label: D
  text: $\displaystyle\sum_i \sigma_i\,(\mathbf{v}_i^T\boldsymbol{\omega})\,\mathbf{u}_i$
- label: E
  text: A Gaussian vector in $\mathbb{R}^m$ whose distribution does not depend on $A$
figures: []
answer:
  correct: D
  partial_credit:
  - C
  verified: true
