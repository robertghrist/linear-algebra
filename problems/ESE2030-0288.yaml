statement: |
  Square matrices $A$ and $B$ of the same size satisfy $B = P^{-1} A P$ for some invertible matrix $P$. Which statement most fundamentally describes the relationship between $A$ and $B$?
choices:
- label: A
  text: $A$ and $B$ have the same determinant and trace.
- label: B
  text: $A$ and $B$ have the same image as subspaces of $\mathbb{R}^n$.
- label: C
  text: $A$ and $B$ have the same eigenvalues.
- label: D
  text: $A$ is obtained from $B$ by a change of coordinates in the codomain only.
- label: E
  text: $A$ and $B$ represent the same linear transformation expressed in different bases.
figures: []
answer:
  correct: E
  partial_credit: []
  verified: true
  verified_from:
  - quizzes-exams/2026-A/2030-FINAL-EXAM.tex
