  conflict: null
  explanation: |
    A stochastic matrix preserves total probability (or total population in this context), which corresponds to the eigenvalue $\lambda_1 = 1$ being dominant. The eigenvector $\mathbf{v}_1$ indicates the long-term distribution ratios.
  key_insight: null
  distractor_rationale:
    C: |
      confuses how negative eigenvalues work; they don't make population components negative, they cause alternating deviations from equilibrium
    D: |
      misunderstands what $|\lambda_2|$ controls; it governs convergence rate, not which age group dominates
    E: |
      ignores the dominant eigenvalue $\lambda_1 = 1$; the other eigenvalues affect transients, not the long-term limit
