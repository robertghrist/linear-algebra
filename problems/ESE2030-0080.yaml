statement: |
  A population model tracks the number of individuals in three age groups: juvenile, adult, and senior. The transition matrix $P$ describes how the population distribution changes each year, where column $j$ shows the probability of transitioning into each age group from group $j$.

  The matrix $P$ has been found to have eigenvalues $\lambda_1 = 1$, $\lambda_2 = 0.6$, and $\lambda_3 = -0.2$, with corresponding eigenvector for $\lambda_1 = 1$ given by:
  $\mathbf{v}_1 = \frac{1}{10}\begin{pmatrix} 2 \\ 5 \\ 3 \end{pmatrix}$

  If the population distribution after $k$ years is $\mathbf{x}(k) = P^k\mathbf{x}(0)$, which statement is most accurate about the long-term behavior?
choices:
- label: A
  text: As $k \to \infty$, the population distribution converges to $\mathbf{v}_1$
- label: B
  text: The dominant eigenvalue $\lambda_1 = 1$ means the total population remains constant over time
- label: C
  text: The eigenvalue $\lambda_3 = -0.2$ means the senior population will eventually become negative
- label: D
  text: Since $|\lambda_2| = 0.6 > |\lambda_3|$, the convergence is primarily controlled by the adult
    age group
- label: E
  text: As $k \to \infty$, all populations decay to zero because $\lambda_2$ and $\lambda_3$ are both
    less than 1
figures: []
answer:
  correct: A
  partial_credit:
  - B
  verified: true
  verified_from:
  - quizzes-exams/2025-C/2030-Q4-ANSWERS.tex
