statement: |
  A real $4 \times 4$ matrix $A$ has eigenvalues $\lambda_1 = 5$, $\lambda_2 = -2$, and $\lambda_{3,4} = 3 \pm 4i$.

  The QR algorithm is applied repeatedly to $A$. What is the structure of the limiting matrix?
choices:
- label: A
  text: A diagonal matrix with entries $5, -2, 3+4i, 3-4i$
- label: B
  text: An upper triangular matrix with $5, -2, 3+4i, 3-4i$ on the diagonal
- label: C
  text: A block upper triangular matrix with two $1 \times 1$ blocks and one $2 \times 2$ block
- label: D
  text: The Jordan canonical form of $A$
- label: E
  text: The algorithm fails to converge because of the complex eigenvalues
figures: []
answer:
  correct: C
  partial_credit: []
