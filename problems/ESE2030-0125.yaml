  - quizzes-exams/2025-C/2030-FINAL-EXAM.tex
  conflict: null
  explanation: |
    The QR algorithm, when applied to a real matrix using real arithmetic, converges to the real Schur form: a block upper triangular matrix where real eigenvalues appear in $1 \times 1$ diagonal blocks, and complex conjugate pairs appear in $2 \times 2$ diagonal blocks of the form $\begin{bmatrix} a & b \\ -c & a \end{bmatrix}$ encoding $a \pm i\sqrt{bc}$. Here we have two real eigenvalues ($\lambda = 5$ and $\lambda = -2$) contributing two $1 \times 1$ blocks, and one complex conjugate pair ($3 \pm 4i$) contributing one $2 \times 2$ block. The algorithm converges perfectly well—complex eigenvalues don't prevent convergence, they just appear in $2 \times 2$ blocks rather than on the diagonal.
  key_insight: null
  distractor_rationale:
    A: |
      cannot have complex entries when using real arithmetic; the algorithm operates entirely in real numbers
    B: |
      same issue—complex numbers cannot appear on the diagonal when working with real matrices and real QR factorizations
    D: |
      the QR algorithm produces Schur form, NOT Jordan form; Jordan form requires computing generalized eigenvectors, which is a different process entirely
    E: |
      (complex eigenvalues do not prevent convergence; they simply manifest as $2 \times 2$ blocks in the real Schur form) %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
