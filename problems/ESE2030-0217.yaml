statement: |
  The Fibonacci sequence $F_0 = 0, \; F_1 = 1, \; F_{k+1} = F_k + F_{k-1}$
  can be written in matrix form:
  $$\begin{pmatrix} F_{k+1} \\ F_k \end{pmatrix}
    = \underbrace{\begin{bmatrix} 1 & 1 \\ 1 & 0 \end{bmatrix}}_{A}
      \begin{pmatrix} F_k \\ F_{k-1} \end{pmatrix}
  \quad \Rightarrow \quad \lambda_1 = \dfrac{1+\sqrt{5}}{2} \approx 1.618...\,\, ; \,\, \lambda_2= \dfrac{1-\sqrt{5}}{2} \approx -0.618...
  $$
  It is a classical fact that $\dfrac{F_{k+1}}{F_k} \to \lambda_1 \approx 1.618\ldots$ as
  $k \to \infty$.
  Which of the following best explains \textbf{why}?
choices:
- label: A
  text: $\lambda_1$ is the only positive eigenvalue of $A$, and Fibonacci numbers are positive, so the
    ratio must converge to the positive eigenvalue
- label: B
  text: The trace of $A$ is $1$, so the sum of eigenvalues is $1$; as $k$ grows, this forces the ratio
    $F_{k+1}/F_k$ toward the larger eigenvalue
- label: C
  text: $A$ is symmetric, so the Spectral Theorem guarantees that the dominant eigenvalue controls the
    long-term ratio
- label: D
  text: $\lambda_1$ satisfies $\lambda_1^2 = \lambda_1 + 1$, which is the same relation as $F_{k+1} =
    F_k + F_{k-1}$ after dividing by $F_k$; therefore any sequence obeying this recurrence must converge
    to $\lambda_1$
- label: E
  text: Since $|\lambda_2| < 1 < |\lambda_1|$, the component of $\mathbf{x}_k = A^k\mathbf{x}_0$ along
    the other eigenvector decays relative to the component along $\lambda_1$'s eigenvector, so $\mathbf{x}_k$
    becomes approximately parallel to $\lambda_1$'s eigenvector, and multiplication by $A$ then scales
    by approximately $\lambda_1$
