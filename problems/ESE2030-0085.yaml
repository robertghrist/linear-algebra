  explanation: |
    The key insight is that $R_k Q_k = Q_k^T Q_k R_k Q_k = Q_k^T (Q_k R_k) Q_k = Q_k^T A_k Q_k$ since $A_k = Q_k R_k$ and $Q_k^T Q_k = I$. This shows $A_{k+1}$ is similar to $A_k$ via an orthogonal similarity transformation, guaranteeing they have identical eigenvalues. The sequence of similarity transformations gradually reveals the eigenvalue structure while preserving the spectrum at each step. Choice D is tempting but imprecise - while $Q_k R_k = A_k$ is true, the deeper reason we reverse the order is to create the similarity transformation that preserves eigenvalues while changing the matrix form.
  key_insight: null
  distractor_rationale:
    A: |
      RQ is NOT generally upper triangular; the algorithm converges to triangular form over many iterations, not in one step
    B: |
      commutativity has little to do with the algorithm ; it is an observation
    E: |
      RQ does not generally preserve symmetry unless additional structure is present
