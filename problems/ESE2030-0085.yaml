statement: |
  The QR algorithm for computing eigenvalues proceeds iteratively: given $A_k$, we factor $A_k = Q_k R_k$ (QR decomposition), then form $A_{k+1} = R_k Q_k$ (reverse the order).

  Why is the reversed multiplication $A_{k+1} = R_k Q_k$  essential for the algorithm to work?
choices:
- label: A
  text: $R_k Q_k$ is upper triangular while $Q_k R_k$ is not, allowing eigenvalues to appear on the diagonal
- label: B
  text: $R_k Q_k$ uses the fact that matrix multiplication is not commutative to generate new matrices
- label: C
  text: $Q_k R_k = A_k$ would just return the original matrix, making no progress toward convergence
- label: D
  text: $R_k Q_k$ is similar to $A_k$ via $A_{k+1} = Q_k^T A_k Q_k$, preserving eigenvalues across iterations
- label: E
  text: $R_k Q_k$ is symmetric when $A_k$ is symmetric, while $Q_k R_k$ may not be
figures: []
answer:
  correct: D
  partial_credit:
