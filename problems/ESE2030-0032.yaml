statement: |
  Let $T: \mathbb{R}^5 \to \mathbb{R}^5$ be a linear transformation.
  Given that $\dim(\ker(T)) = 2$ and $\dim(\text{im}(T)) = 3$, which statement about the cokernel $\text{coker}(T)$ must be true?
choices:
- label: A
  text: $\dim(\text{coker}(T)) = 2$ and it is a subspace of $\mathbb{R}^5$
- label: B
  text: $\dim(\text{coker}(T)) = 2$ and it is isomorphic to $\ker(T)$
- label: C
  text: $\dim(\text{coker}(T)) = 2$ but it need not be isomorphic to $\ker(T)$
- label: D
  text: $\dim(\text{coker}(T)) = 2$ and it is isomorphic to $\text{im}(T)$
- label: E
  text: $\dim(\text{coker}(T)) = 2$ and it is isomorphic to $\text{coim}(T)$
figures: []
answer:
  correct: C
  partial_credit:
  - A
  verified: true
  verified_from:
  - quizzes-exams/2025-C/2030-Q2-ANSWERS.tex
