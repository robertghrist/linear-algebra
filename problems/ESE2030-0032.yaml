  conflict: null
  explanation: |
    The cokernel has dimension $\dim(\mathbb{R}^5) - \dim(\text{im}(T)) = 5 - 3 = 2$. While $\ker(T)$ also has dimension 2, these spaces live in different contexts (one in the domain, one as a quotient of the codomain) and are generally not isomorphic as there's no natural isomorphism between them.
