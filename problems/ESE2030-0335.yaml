statement: |
  The set $\{1 + x,\; x^2\}$ is linearly independent in $\mathcal{P}_3$. Which pair of polynomials extends it to a basis of $\mathcal{P}_3$?
choices:
- label: A
  text: $\{1,\; x\}$
- label: B
  text: $\{x,\; x^3\}$
- label: C
  text: $\{1 + x + x^2,\; x^3\}$
- label: D
  text: $\{2 + 2x,\; x^3\}$
- label: E
  text: $\{x^2,\; x^3\}$
figures: []
answer:
  correct: B
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    $\dim \mathcal{P}_3 = 4$, so exactly two more polynomials are needed, and they must keep the set independent. $\{1 + x, x^2, x, x^3\}$ is independent: from $x$ and $1 + x$ one recovers $1$, so the four span $\{1, x, x^2, x^3\}$ and hence all of $\mathcal{P}_3$. Basis Extension guarantees some pair works; it does not say every pair does, and the four rejected pairs each introduce a dependence on what is already present.
  key_insight: null
  distractor_rationale:
    A: |
      Trick: adds two polynomials, but $1 + x$, $1$, and $x$ are dependent ($1 + x = 1 + x$), so the set of four has rank $3$ and spans only a hyperplane of $\mathcal{P}_3$.
    C: |
      Distractor: $1 + x + x^2 = (1 + x) + x^2$ is already in the span of the given set.
    D: |
      Distractor: $2 + 2x = 2(1 + x)$ is a multiple of a vector already present.
    E: |
      Distractor: $x^2$ is already in the set; adding it again adds nothing, and the four-element list is dependent.
