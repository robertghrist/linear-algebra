statement: |
  Elimination on a dense $n\times n$ system costs about $c\,n^3$ operations for a constant $c$. The unknowns and equations of a particular system can be reordered so that its matrix is block diagonal with two $\tfrac{n}{2}\times\tfrac{n}{2}$ blocks. By roughly what factor does the elimination cost fall?
choices:
- label: A
  text: '2'
- label: B
  text: '8'
- label: C
  text: '4'
- label: D
  text: $n/2$
- label: E
  text: It does not fall; reordering costs as much as it saves
figures: []
answer:
  correct: C
  partial_credit:
  - B
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Each block is a system of half the size, costing $c(n/2)^3 = c\,n^3/8$; there are two of them, for $c\,n^3/4$ in all. The cubic scaling is what makes decoupling pay: halving the size divides the work by eight, and doing it twice still leaves a factor of four. A permutation costs nothing to apply.
  key_insight: null
  distractor_rationale:
    A: |
      Distractor: treats the cost as linear in the size, so two half-size problems cost the same as one full one.
    B: |
      Partial credit: has the cubic scaling ($1/8$ per block) but forgets that there are two blocks to solve. Insight 1 of 2: cost scales as the cube of the size. Missing: two subsystems, so $2/8 = 1/4$. Prefix: yes. Guessable: no. Defensible: yes.
    D: |
      Distractor: a size, not a factor; confuses the block dimension with the saving.
    E: |
      Distractor: a permutation of rows and columns is bookkeeping, not arithmetic; it costs nothing on the scale of $n^3$.
