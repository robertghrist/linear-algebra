  explanation: |
    The Spectral Theorem guarantees that a real symmetric matrix possesses an orthonormal eigenbasis $\{\mathbf{q}_1, \ldots, \mathbf{q}_n\}$. Forming $Q = [\mathbf{q}_1 \cdots \mathbf{q}_n]$, we get $A = Q\Lambda Q^T$ with $Q^{-1} = Q^T$. To find the eigenbasis coordinates of $\mathbf{x}$: $$\mathbf{c} = Q^T\mathbf{x} \quad \Longrightarrow \quad c_i = \mathbf{q}_i^T\mathbf{x}$$ Each coordinate is a dot product --- an $O(n)$ operation requiring no matrix inversion. For the general case $B = V\Lambda V^{-1}$, the coordinates are $\mathbf{c} = V^{-1}\mathbf{x}$, which requires solving a linear system ($O(n^2)$ or $O(n^3)$) and may be ill-conditioned. The student must supply the unstated intermediate step: symmetric $\Rightarrow$ Spectral Theorem $\Rightarrow$ orthonormal eigenbasis $\Rightarrow$ $Q^{-1} = Q^T$ $\Rightarrow$ coordinates are dot products.
  key_insight: null
  distractor_rationale:
    C: |
      the orthogonal diagonalization is NOT unique: within each eigenspace, any orthonormal basis may be chosen. The general diagonalization is also non-unique for the same reason. Uniqueness is not the distinguishing advantage.
    E: |
      false --- symmetric matrices can have repeated eigenvalues. The Spectral Theorem still guarantees a full orthonormal eigenbasis even with repetition, but distinctness is not guaranteed.
    B: |
      false --- this is precisely what symmetry DOES simplify. A student who does not know the Spectral Theorem may reason that both cases are ``just diagonalizable'' and conclude there is no difference. This distractor targets that gap.
