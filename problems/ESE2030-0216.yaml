statement: |
  Let $A$ be a real symmetric $n \times n$ matrix, and let $B$ be a
  general (non-symmetric) diagonalizable $n \times n$ matrix. Both
  have $n$ linearly independent eigenvectors.
  To express a vector $\mathbf{x} \in \mathbb{R}^n$ in the eigenbasis
  of each matrix, what key simplification does the symmetry of $A$ provide?
choices:
- label: A
  text: The eigenvalues of $A$ are guaranteed real, so the eigenbasis coordinates of $\mathbf{x}$ are
    real-valued --- unlike the general case where coordinates may be complex
- label: B
  text: Both $A$ and $B$ require computing $V^{-1}\mathbf{x}$ to find eigenbasis coordinates; symmetry
    does not simplify this step
- label: C
  text: The diagonalization of $A$ is unique, whereas $B = V\Lambda V^{-1}$ has infinitely many choices
    of $V$
- label: D
  text: The eigenvectors of $A$ can always be chosen orthonormal, so the eigenbasis coordinates are $c_i
    = \mathbf{q}_i^T\mathbf{x}$ --- no matrix inversion is required
- label: E
  text: Symmetric matrices always have distinct eigenvalues, so there is exactly one eigenbasis up to
    scaling
figures: []
answer:
  correct: D
