  explanation: |
    Softmax is blind to the component of $\mathbf{z}$ along $\mathbf{1}$, so it is well defined on equivalence classes $\mathbf{z} + \operatorname{span}\{\mathbf{1}\}$, i.e. on $\mathbb{R}^N / \operatorname{span}\{\mathbf{1}\}$. The centering map has kernel $\operatorname{span}\{\mathbf{1}\}$, and $V / \ker T$ is by definition the coimage. On that quotient softmax loses nothing: the entrywise logarithm recovers $\mathbf{z}$ up to an additive constant, so softmax is a bijection from the coimage onto the relative interior of $\Delta^{N-1}$.
  key_insight: null
  distractor_rationale:
    B: |
      Trick: quotients by the wrong subspace and names the codomain-side space; the cokernel lives in the codomain (listed Week 3 trap).
    C: |
      Distractor: the kernel is what is quotiented OUT, not the quotient; a subspace, not a space of classes.
    D: |
      Trick: $\mathbf{1}^\perp$ is a complement of the kernel and is isomorphic to the quotient, but it is a choice, not the quotient itself (Week 3 trap: complement vs. quotient).
    E: |
      Partial credit: the right quotient with the wrong name. Insight 1 of 2 (the quotient by $\operatorname{span}\{\mathbf{1}\}$); missing: $V/\ker T$ is the coimage, not the kernel. Prefix: yes. Guessable: no. Defensible: yes.
