  explanation: |
    Damped oscillations occur in the underdamped regime when $c^2 < 4mk$, producing complex conjugate eigenvalues $\lambda = -\frac{c}{2m} \pm i\omega$ where $\omega = \frac{1}{2m}\sqrt{4mk - c^2}$. The negative real part $-c/(2m) < 0$ causes exponential decay, while the imaginary part $\pm i\omega$ produces oscillatory behavior through $e^{i\omega t} = \cos(\omega t) + i\sin(\omega t)$. Solutions have the form $e^{-ct/(2m)}(A\cos(\omega t) + B\sin(\omega t))$, exhibiting oscillations with decreasing amplitude. This underdamped motion is characteristic of systems like shock absorbers or pendulums with moderate friction.
  key_insight: null
  distractor_rationale:
    A: |
      overdamped case with $c^2 > 4mk$; produces exponential decay without oscillation
    C: |
      critically damped case with $c^2 = 4mk$; fastest decay without oscillation, but no oscillatory behavior
    D: |
      positive real eigenvalues produce unbounded exponential growth, not damping
    E: |
      complex eigenvalues with positive real part produce growing oscillations, not damped oscillations
