statement: |
  A damped harmonic oscillator is described by the second-order differential equation:
  $$m\frac{d^2x}{dt^2} + c\frac{dx}{dt} + kx = 0$$

  The companion matrix for this system has eigenvalues that depend on $c$, $m$, and $k$. Which eigenvalue pattern corresponds to damped oscillations (decaying oscillatory motion)?
choices:
- label: A
  text: Two distinct real negative eigenvalues
- label: B
  text: Two complex conjugate eigenvalues with negative real part
- label: C
  text: A repeated real negative eigenvalue
- label: D
  text: Two distinct real positive eigenvalues
- label: E
  text: Two complex conjugate eigenvalues with positive real part
figures: []
answer:
  correct: B
  partial_credit: []
