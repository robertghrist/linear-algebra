statement: |
  The derivative of the loss is the matrix product $[D\mathcal{L}] = [Dg]\,[Df_\Lambda]\cdots[Df_1]$, one factor per layer. Backpropagation evaluates this product for a constant multiple of the cost of a forward pass, while a network of width $n$ has factors that are $n \times n$ matrices. What makes it that cheap?
choices:
- label: A
  text: The weight matrices of a trained network are sparse, so each factor costs far less than $n^2$ to apply
- label: B
  text: The loss is a scalar, so sweeping from the left keeps every intermediate product a row times a matrix
- label: C
  text: The gradient with respect to each weight matrix is rank one, so it has only $O(n)$ independent entries
- label: D
  text: Each factor $[Df_\ell]$ is a diagonal matrix, so the product costs $O(n)$ per layer
- label: E
  text: The forward pass stores every activation, so the backward pass performs no multiplications of its own
figures: []
answer:
  correct: B
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Associativity fixes the value of the product but not its cost. Starting from the loss end, $[Dg]$ is a $1 \times n$ row because the loss is a scalar; a row times an $n\times n$ matrix costs $O(n^2)$ and is again a row, so every one of the $\Lambda$ steps costs $O(n^2)$, the same order as a forward layer. Starting from the input end multiplies full matrices, $O(n^3)$ per step. Backpropagation is the associativity of matrix multiplication, exploited: reverse mode is left-association.
  key_insight: null
  distractor_rationale:
    A: |
      Distractor: nothing about training makes $W_\ell$ sparse; the factors are dense, and the saving comes from their order of multiplication, not their entries.
    C: |
      Distractor: true --- $G_\ell = [\delta_\ell]^T \mathbf{h}_{\ell-1}^T$ is an outer product --- but it answers a question about storage, not about the cost of the sweep. The rank-one shape is a consequence of the row sweeping through, not the cause of its cheapness.
    D: |
      Trick: only $\operatorname{diag}(\varsigma'(\mathbf{z}_\ell))$ is diagonal; the factor $[Df_\ell] = \operatorname{diag}(\varsigma'(\mathbf{z}_\ell))\,W_\ell$ carries the full matrix $W_\ell$.
    E: |
      Distractor: storing activations lets the backward pass evaluate each factor where the forward pass visited, but the backward pass still multiplies by every $W_\ell$; its cost is $O(\Lambda n^2)$, not zero.
