  explanation: |
    Statement I is true: checking if vectors form a basis only requires verifying linear independence and spanning, which are algebraic concepts. Statement III is true: finding dimension of a subspace only requires row reduction or checking linear independence, not geometry. Statement II is false: angles between vectors require an inner product to define $\cos\theta = \langle p,q \rangle / (\|p\|\|q\|)$. Without specifying an inner product (like $\langle f,g \rangle = \int_0^1 f(x)g(x)dx$), we cannot compute angles.
  key_insight: |
    Geometric concepts (angles, orthogonality) need inner products; algebraic concepts (independence, dimension) don't.
