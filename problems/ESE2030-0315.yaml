statement: |
  A network with a linear read-out predicts $\hat{\mathbf{y}}$ for a training example with target $\mathbf{y}$, under the squared loss $\mathcal{L} = \tfrac{1}{2}\|\mathbf{y} - \hat{\mathbf{y}}\|^2$. Which of the following is the error signal $[\delta_\Lambda]$ at the read-out?
choices:
- label: A
  text: $(\mathbf{y} - \hat{\mathbf{y}})^T$
- label: B
  text: $(\hat{\mathbf{y}} - \mathbf{y})^T W_\Lambda$
- label: C
  text: $(\hat{\mathbf{y}} - \mathbf{y})^T \operatorname{diag}\big(\varsigma'(\mathbf{z}_\Lambda)\big)$
- label: D
  text: $(\hat{\mathbf{y}} - \mathbf{y})^T$
- label: E
  text: $\tfrac{1}{2}\|\mathbf{y} - \hat{\mathbf{y}}\|^2$
figures: []
answer:
  correct: D
  partial_credit:
  - A
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    The read-out carries no activation, so $\hat{\mathbf{y}} = \mathbf{z}_\Lambda$ and $[\delta_\Lambda]$ is the derivative of the loss with respect to the output itself. Perturbing $\hat{\mathbf{y}}$ by $\mathbf{v}$ changes $\tfrac12\|\mathbf{y}-\hat{\mathbf{y}}\|^2$ by $\langle \hat{\mathbf{y}} - \mathbf{y}, \mathbf{v}\rangle$ to first order, so $[\delta_\Lambda] = (\hat{\mathbf{y}} - \mathbf{y})^T$: prediction minus truth, transposed into a row. It is the least squares residual of Chapter 6 with its sign reversed, and this is the one place in the backward sweep where $\delta$ is a difference of anything.
  key_insight: null
  distractor_rationale:
    A: |
      Partial credit: the residual without the sign flip (listed trap). Insight 1 of 2: $[\delta_\Lambda]$ is the residual, not a product and not the loss. Missing: the derivative of $\tfrac12\|\mathbf{y}-\hat{\mathbf{y}}\|^2$ with respect to $\hat{\mathbf{y}}$ is $\hat{\mathbf{y}} - \mathbf{y}$, not $\mathbf{y} - \hat{\mathbf{y}}$. Prefix: yes. Guessable: no. Defensible: yes.
    B: |
      Distractor: one step too far. $[\delta_\Lambda] W_\Lambda$ is the derivative with respect to $\mathbf{h}_{\Lambda-1}$, the start of the recursion of Lemma 13.5, not the error signal at the read-out.
    C: |
      Trick: multiplies by an activation slope that the read-out does not have. The final layer is linear; $\operatorname{diag}(\varsigma')$ enters only at hidden layers.
    E: |
      Distractor: the loss itself, a scalar. The error signal is a derivative of the loss, a row of sensitivities.
