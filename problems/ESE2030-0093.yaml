  explanation: |
    The spectral radius is the maximum magnitude among all eigenvalues: $\rho(A) = \max\{|\lambda_i|\}$. Computing magnitudes: $|\lambda_1| = |2| = 2$, $|\lambda_2| = |-3| = 3$, $|\lambda_3| = |1+2i| = \sqrt{1^2 + 2^2} = \sqrt{5} \approx 2.24$, $|\lambda_4| = |1-2i| = \sqrt{1^2 + (-2)^2} = \sqrt{5} \approx 2.24$. The maximum is $|\lambda_2| = 3$, so $\rho(A) = 3$. The spectral radius is always a non-negative real number, even when the matrix has complex eigenvalues.
