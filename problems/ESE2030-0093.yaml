statement: |
  A $4 \times 4$ matrix $A$ has eigenvalues:
  $$\lambda_1 = 2, \quad \lambda_2 = -3, \quad \lambda_3 = 1 + 2i, \quad \lambda_4 = 1 - 2i$$

  What is the spectral radius $\rho(A)$?
choices:
- label: A
  text: $\rho(A) = \sqrt{3}$
- label: B
  text: $\rho(A) = 3$
- label: C
  text: $\rho(A) = \sqrt{5}$
- label: D
  text: $\rho(A) = 5$
- label: E
  text: None of the above
figures: []
answer:
  correct: B
