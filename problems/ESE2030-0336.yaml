statement: |
  Five vectors $\mathbf{v}_1, \ldots, \mathbf{v}_5$ span $\mathbb{R}^3$. Which statement is forced?
choices:
- label: A
  text: Any three of them form a basis
- label: B
  text: Exactly two of them are redundant, and which two is determined by the set
- label: C
  text: All five are dependent, so none of them can belong to a basis
- label: D
  text: Five vectors cannot span $\mathbb{R}^3$; three is the most a spanning set can have
- label: E
  text: Some three of them form a basis
figures: []
answer:
  correct: E
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    A spanning set can always be trimmed to a basis: discard any vector that is a combination of the others and the span is unchanged; repeat until the survivors are independent. Since $\dim \mathbb{R}^3 = 3$ the survivors number exactly three. Which three survive depends on the order of discarding, so the trimmed basis is not unique, and the three chosen must actually be independent, so not every triple qualifies.
  key_insight: null
  distractor_rationale:
    A: |
      Trick: the listed trap. Three vectors in a three-dimensional space are a basis only if independent; if $\mathbf{v}_1, \mathbf{v}_2, \mathbf{v}_3$ all lie in one plane they span only that plane.
    B: |
      Distractor: two must go, but which two is a choice. If $\mathbf{v}_1 = \mathbf{v}_2$, either may be discarded.
    C: |
      Trick: dependence of the whole list does not taint its members; a dependent spanning list always contains an independent spanning sublist.
    D: |
      Distractor: spanning sets can be as large as one likes; it is independent sets that are capped at the dimension (the Exchange Bound).
