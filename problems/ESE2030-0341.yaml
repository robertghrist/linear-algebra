  conflict: null
  explanation: |
    For every $\lambda > 0$ the modified normal equations $(A^TA + \lambda I)\mathbf{x} = A^T\mathbf{b}$ have a unique solution, rank-deficient $A$ or not. As the penalty is switched off the solution approaches the least squares set, and among the infinitely many least squares solutions the penalty on $\|\mathbf{x}\|$ has been selecting for smallness all along: the limit is the one of minimum norm, $A^+\mathbf{b}$. Ridge regularization is a continuous path that lands on the pseudoinverse solution.
  key_insight: null
  distractor_rationale:
    A: |
      Trick: the formula for independent columns. Here $A^TA$ is singular and the inverse does not exist; this is the listed Week 6 trap.
    B: |
      Distractor: the singular limit of the matrix does not make the solutions blow up; the penalty keeps $\|\mathbf{x}_\lambda\|$ bounded by the norm of any least squares solution.
    D: |
      Partial credit: has that the limit solves the least squares problem. Insight 1 of 2: the limit is a least squares solution. Missing: the penalty singles out the minimum-norm one, so the limit is determined. Prefix: yes. Guessable: no. Defensible: yes.
    E: |
      Distractor: the $\lambda \to \infty$ limit, where the penalty dominates and everything is shrunk to nothing.
