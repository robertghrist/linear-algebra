statement: |
  For $A \in \mathbb{R}^{m\times n}$ and $\mathbf{x} \in \mathbb{R}^n$, the number $\mathbf{x}^T(A^TA)\mathbf{x}$ equals which of the following?
choices:
- label: A
  text: $\|\mathbf{x}\|^2$
- label: B
  text: $\langle A\mathbf{x}, \mathbf{x}\rangle$
- label: C
  text: $\|A^T\mathbf{x}\|^2$
- label: D
  text: $\|A\|_F^2\,\|\mathbf{x}\|^2$
- label: E
  text: $\|A\mathbf{x}\|^2$
figures: []
answer:
  correct: E
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Regroup: $\mathbf{x}^TA^TA\mathbf{x} = (A\mathbf{x})^T(A\mathbf{x}) = \|A\mathbf{x}\|^2$. This one line is the whole theory of the Gram matrix: the quadratic form is a squared length, so it is never negative ($A^TA$ is positive semidefinite), and it vanishes exactly when $A\mathbf{x} = \mathbf{0}$, so $\ker(A^TA) = \ker A$ and $A^TA$ is positive definite precisely when the columns of $A$ are independent.
  key_insight: null
  distractor_rationale:
    A: |
      Distractor: true only when $A$ has orthonormal columns ($A^TA = I$); in general $A$ changes lengths.
    B: |
      Distractor: $A\mathbf{x}$ lives in $\mathbb{R}^m$ and $\mathbf{x}$ in $\mathbb{R}^n$, so the pairing is not even defined unless $m = n$, and then it is $\mathbf{x}^TA\mathbf{x}$, a different quadratic form.
    C: |
      Distractor: $A^T\mathbf{x}$ is undefined for $\mathbf{x} \in \mathbb{R}^n$ unless $m = n$; the transpose belongs on the outside of the product, not on the vector.
    D: |
      Distractor: an upper bound (Cauchy--Schwarz in the Frobenius pairing), not an equality.
