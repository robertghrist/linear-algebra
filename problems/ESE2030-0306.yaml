statement: |
  Two unit vectors are found to have cosine similarity $0.2$. In which setting is this evidence of a genuine relationship between them, as opposed to what chance alone produces?
choices:
- label: A
  text: In $\mathbb{R}^{1024}$ but not in $\mathbb{R}^3$
- label: B
  text: In $\mathbb{R}^3$ but not in $\mathbb{R}^{1024}$
- label: C
  text: In both
- label: D
  text: In neither
- label: E
  text: Only if the vectors were centered first
figures: []
answer:
  correct: A
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    By Lemma 12.6, unrelated unit vectors have cosines of mean $0$ and standard deviation $1/\sqrt{n}$. In $\mathbb{R}^3$ that is about $0.58$, and a cosine of $0.2$ is unremarkable --- random pairs manage it most of the time. In $\mathbb{R}^{1024}$ the standard deviation is about $0.03$, and $0.2$ stands more than six standard deviations above chance. The question 'how large must a cosine be to mean anything' is incomplete until the dimension is named.
  key_insight: null
  distractor_rationale:
    B: |
      Trick: reverses the dependence --- high dimension SHRINKS the chance band, making a fixed cosine more significant, not less.
    C: |
      Distractor: the naive prior that $0.2$ is small in any dimension.
    D: |
      Distractor: the naive prior that $0.2$ is 'weak correlation' regardless of setting.
    E: |
      Distractor: centering is about the probability inner product on random variables; the question is about directions in $\mathbb{R}^n$.
