statement: |
  A matrix $A \in \mathbb{R}^{5\times 3}$ has linearly independent columns. Which statement about $A^TA$ and $AA^T$ is forced?
choices:
- label: A
  text: Both $A^TA$ and $AA^T$ are invertible
- label: B
  text: $A^TA$ is $3\times 3$ and singular; $AA^T$ is $5\times 5$ and invertible
- label: C
  text: $A^TA = I$
- label: D
  text: $A^TA$ is $3\times 3$ and invertible; $AA^T$ is $5\times 5$ and singular
- label: E
  text: $A^TA$ is invertible only if $A$ is square
figures: []
answer:
  correct: D
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    $A^TA$ is the Gram matrix of the columns of $A$: $3\times 3$, symmetric, and with $\ker(A^TA) = \ker A = \{\mathbf{0}\}$ because the columns are independent, hence invertible. $AA^T$ is $5\times 5$ but has rank at most $\operatorname{rank} A = 3 < 5$, so it is singular. Independence of the columns is exactly the condition for the Gram matrix to be invertible, and it says nothing about the larger product.
  key_insight: null
  distractor_rationale:
    A: |
      Distractor: $AA^T$ has rank at most $3$ in a $5\times 5$ frame; it cannot be invertible.
    B: |
      Distractor: the two conclusions swapped. The small Gram matrix is the invertible one when the columns are independent.
    C: |
      Trick: $A^TA = I$ says the columns are orthonormal, far more than independent. Independence gives invertibility, not the identity.
    E: |
      Distractor: $A^TA$ is square whatever the shape of $A$; its invertibility is decided by the columns of $A$, not by $A$ being square.
