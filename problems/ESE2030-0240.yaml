statement: |
  A matrix $A \in \mathbb{R}^{3 \times 3}$ has singular values $\sigma_1 = 6$, $\sigma_2 = 3$, $\sigma_3 = 0$. Let $S$ denote the image of the unit sphere $\{\mathbf{x} \in \mathbb{R}^3 : \|\mathbf{x}\| = 1\}$ under $A$. Which of the following is TRUE?
choices:
- label: A
  text: $S$ is an ellipsoid in $\mathbb{R}^3$ with semi-axes $6$, $3$, and $0$.
- label: B
  text: $S$ is an ellipse in $\mathrm{im}(A)$ with semi-axes $6$ and $3$.
- label: C
  text: $S$ is an ellipse in $\mathbb{R}^3$ with semi-axes $36$ and $9$.
- label: D
  text: $S$ is a line segment of length $12$ along $\mathbf{u}_1$.
- label: E
  text: $S$ is an ellipse in $\ker(A)^\perp$ with semi-axes $6$ and $3$.
figures: []
answer:
  correct: B
  partial_credit:
  - E
