statement: |
  The Johnson-Lindenstrauss lemma states that for any set of $n$ points $\{\mathbf{x}_1, \ldots,
  \mathbf{x}_n\} \subset \mathbb{R}^d$ and any $\varepsilon \in (0, 1)$, there exists a linear
  map $f : \mathbb{R}^d \to \mathbb{R}^k$ such that for all pairs $i, j$,
  $$(1-\varepsilon)\|\mathbf{x}_i - \mathbf{x}_j\|^2 \;\leq\; \|f(\mathbf{x}_i) - f(\mathbf{x}_j)\|^2 \;\leq\; (1+\varepsilon)\|\mathbf{x}_i - \mathbf{x}_j\|^2.$$
  The lemma's most striking feature is the size of the target dimension $k$ that suffices.
  On what does $k$ depend?
choices:
- label: A
  text: $k$ grows logarithmically with $d$ and is independent of $n$.
- label: B
  text: $k$ grows logarithmically with $n$ and is independent of $d$.
- label: C
  text: $k$ depends on the geometric structure of the point set $\{\mathbf{x}_i\}$ and cannot be bounded
    in terms of $n$ and $d$ alone.
- label: D
  text: $k$ grows linearly with $d$ and is independent of $n$.
- label: E
  text: $k$ grows linearly with $n$ and logarithmically with $d$.
