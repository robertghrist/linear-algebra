  explanation: |
    JL gives $k = O(\varepsilon^{-2} \log n)$. The remarkable content of the lemma is that the target dimension depends only on the *number* of points and not on the ambient dimension --- $n$ points in $\mathbb{R}^{10^6}$ embed into the same target dimension as $n$ points in $\mathbb{R}^{100}$. This is what makes JL useful for high-dimensional data.
  key_insight: null
  distractor_rationale:
    D: |
      says $k$ scales with the ambient dimension, missing the entire point of the lemma; this would be the naive guess from someone who has never heard of JL.
    E: |
      combines two log-style dependencies but reverses them; tempting if the student remembers "log appears somewhere" but not where.
    C: |
      claims $k$ depends on the data, which would be PCA-like behavior; the power of JL is that the target dimension is determined by $n$ and $\varepsilon$ alone, with no inspection of the data.
