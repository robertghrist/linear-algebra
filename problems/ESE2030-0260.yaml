statement: |
  Let $A$ be an $m \times n$ matrix with linearly independent columns,
  and let $A = QR$ be its QR decomposition.  Why must $R$ be upper triangular
  rather than lower triangular?
choices:
- label: A
  text: It is a convention; the decomposition $A = QR$ also admits a lower-triangular $R$
- label: B
  text: Because the $k$th column of $A$ is a linear combination of the first $k$ columns of $Q$
- label: C
  text: Because $R = Q^T A$ and the transpose of a triangular matrix is upper triangular
- label: D
  text: Because the columns of $Q$ are pairwise orthogonal
- label: E
  text: Because the $k$th column of $A$ is orthogonal to the first $k-1$ columns of $Q$
figures: []
answer:
  correct: B
  partial_credit: []
  verified: true
