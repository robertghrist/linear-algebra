  conflict: null
  explanation: |
    The least squares solution minimizes the residual norm $\|A\mathbf{x} - \mathbf{b}\|$, which measures how far $A\mathbf{x}$ is from $\mathbf{b}$. Geometrically, this finds the point in $\text{im}(A)$ closest to $\mathbf{b}$. This is the fundamental optimization problem that least squares solves: since we cannot satisfy $A\mathbf{x} = \mathbf{b}$ exactly, we find the $\mathbf{x}$ that makes $A\mathbf{x}$ as close as possible to $\mathbf{b}$ in the sense of minimizing the Euclidean distance (or equivalently, the squared distance).
  key_insight: null
  distractor_rationale:
    A: |
      this would just minimize the size of $A\mathbf{x}$, which is minimized by $\mathbf{x} = \mathbf{0}$; doesn't involve $\mathbf{b}$
    B: |
      minimizing solution norm is what the pseudoinverse does among all least squares solutions, but not the primary least squares criterion
    D: |
      this is related to the normal equations but is not what's being minimized; confuses the form with the objective
    E: |
      this is fixed - doesn't depend on $\mathbf{x}$ at all
