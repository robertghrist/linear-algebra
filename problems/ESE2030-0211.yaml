statement: |
  Consider the $3 \times 3$ positive stochastic matrix with stationary distribution:
  $$P = \begin{bmatrix}
  0.4 & 0.2 & 0.1 \\
  0.4 & 0.5 & 0.3 \\
  0.2 & 0.3 & 0.6
  \end{bmatrix} \quad \Rightarrow \quad
  \boldsymbol{\pi} = \begin{pmatrix} 0.2 \\ 0.4 \\ 0.4 \end{pmatrix}$$
  If %the system starts in state $1$ with certainty, so that
  $\mathbf{x}_0 = \begin{pmatrix} 1 \\ 0 \\ 0 \end{pmatrix}$,
  what is $\displaystyle\lim_{k \to \infty} P^k \mathbf{x}_0$?
choices:
- label: A
  text: $\begin{pmatrix} 0.2 \\ 0.4 \\ 0.4 \end{pmatrix}$
- label: B
  text: The limit depends on $\mathbf{x}_0$; knowing $\boldsymbol{\pi}$ alone is not enough to determine
    it
- label: C
  text: $\begin{pmatrix} 1/3 \\ 1/3 \\ 1/3 \end{pmatrix}$
- label: D
  text: $\begin{pmatrix} 0.4 \\ 0.4 \\ 0.2 \end{pmatrix}$
- label: E
  text: The limit does not necessarily exist
figures: []
answer:
  correct: A
  partial_credit: []
