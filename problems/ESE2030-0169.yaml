statement: |
  Let $S = \{p_1, p_2, p_3\}$ be a set of polynomials in $\mathcal{P}_3$ where
  $$p_1(x) = x^3 - x, \quad p_2(x) = x^3 + x^2, \quad p_3(x) = x^3 - x^2 - 2x.$$
  Which polynomial is in $\text{span}(S)$?
choices:
- label: A
  text: $q(x) = 1$
- label: B
  text: $q(x) = x^2 + x$
- label: C
  text: $q(x) = x^3$
- label: D
  text: $q(x) = x$
- label: E
  text: None of the above.
figures: []
answer:
  correct: B
  partial_credit: []
