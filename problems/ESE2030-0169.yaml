  explanation: |
    Every polynomial in span$(S)$ has the form $ax^3 + bx^2 + cx$ (no constant term), which rules out (A). To test (B): we compute $-p_1 + p_2 = -(x^3-x) + (x^3+x^2) = x^2 + x$, confirming (B) is in the span. For (C): setting $\alpha p_1 + \beta p_2 + \gamma p_3 = x^3$ requires $\alpha + \beta + \gamma = 1$ (for $x^3$), $\beta - \gamma = 0$ (for $x^2$), and $-\alpha - 2\gamma = 0$ (for $x$). From these: $\beta = \gamma$ and $\alpha = -2\gamma$, so $-2\gamma + \gamma + \gamma = 0 \neq 1$. No solution exists. For (D): $x$ alone would require $\alpha + \beta + \gamma = 0$, $\beta - \gamma = 0$, $-\alpha - 2\gamma = 1$. This gives $\alpha = -2\gamma$, $\beta = \gamma$, so $0 = 0$ (consistent), but then $-(-2\gamma) - 2\gamma = 0 \neq 1$. Impossible.
  key_insight: null
  distractor_rationale:
    A: |
      no constant terms can be produced from $S$
    C: |
      plausible since all three polynomials contain $x^3$, but the constraints are inconsistent
    D: |
      students might think lower-degree terms are easier to isolate
