  conflict: null
  explanation: |
    When $A$ is diagonalizable with eigenvalues $\lambda_i$, the matrix exponential $e^A$ has eigenvalues $e^{\lambda_i}$. Therefore $e^A$ has eigenvalues $e^{1}, e^{-2}, e^{0} = e^{1}, e^{-2}, 1$. The determinant is the product of eigenvalues: $\det(e^A) = e^{1} \cdot e^{-2} \cdot 1 = e^{1-2} = e^{-1}$. Note that even though $A$ is singular ($\det(A) = 0$ since one eigenvalue is zero), $e^A$ is always invertible.
  key_insight: null
  distractor_rationale:
    B: |
      uses only the positive eigenvalue, or sums eigenvalues instead of using product rule
    C: |
      incorrectly thinks that $\det(A) = 0$ implies $\det(e^A) = 0$, confusing the exponential with the original matrix
    D: |
      uses only the negative eigenvalue or makes calculation error
    E: |
      incorrectly believes that $\det(e^A)=e^\det(A)$$
