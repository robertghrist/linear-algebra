statement: |
  Let $A$ be a $3 \times 3$ diagonalizable matrix with eigenvalues $\lambda_1 = 1$, $\lambda_2 = -2$, and $\lambda_3 = 0$.
  What is $\det(e^A)$?
choices:
- label: A
  text: $e^{-1}$
- label: B
  text: $e^{1}$
- label: C
  text: $0$
- label: D
  text: $e^{-2}$
- label: E
  text: $1$
figures: []
answer:
  correct: A
  partial_credit: []
  verified: true
  verified_from:
  - quizzes-exams/2025-C/2030-Q3-ANSWERS.tex
