statement: |
  Let $A \in \mathbb{R}^{m \times n}$ have rank $r$, with SVD $A = U\Sigma V^T$ and singular
  values $\sigma_1 > \sigma_2 > \cdots > \sigma_r > 0$.
  Suppose $A^\dagger = \tilde U \tilde\Sigma \tilde V^T$ is an SVD of $A^\dagger$
  in standard form (singular values in descending order).
  What is $\tilde\sigma_1$, the largest singular value of $A^\dagger$, and its
  corresponding left singular vector $\tilde{\mathbf{u}}_1$?
choices:
- label: A
  text: $\tilde\sigma_1 = \sigma_1$ and $\tilde{\mathbf{u}}_1 = \mathbf{u}_1$.
- label: B
  text: $\tilde\sigma_1 = 1/\sigma_r$ and $\tilde{\mathbf{u}}_1 = \mathbf{v}_r$.
- label: C
  text: $\tilde\sigma_1 = 1/\sigma_1$ and $\tilde{\mathbf{u}}_1 = \mathbf{v}_1$.
- label: D
  text: $\tilde\sigma_1 = 1/\sigma_r$ and $\tilde{\mathbf{u}}_1 = \mathbf{u}_r$.
- label: E
  text: $\tilde\sigma_1 = 1/\sigma_1$ and $\tilde{\mathbf{u}}_1 = \mathbf{u}_1$.
figures: []
