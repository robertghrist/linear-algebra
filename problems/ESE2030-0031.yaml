statement: |
  Let $T: V \to V$ be a finite-dimensional linear transformation. If we change from basis $\mathcal{B}$ to basis $\mathcal{C}$, which statement about the matrix representations $[T]_{\mathcal{B}}$ and $[T]_{\mathcal{C}}$ must be true?
choices:
- label: A
  text: They have the same column vectors
- label: B
  text: They have the same rank
- label: C
  text: They have the same entries on the main diagonal
- label: D
  text: They represent different linear transformations
- label: E
  text: They are equal if $\mathcal{B}$ and $\mathcal{C}$ share at least one basis vector
figures: []
answer:
  correct: B
  partial_credit: []
  verified: true
  verified_from:
