  explanation: |
    The image of differentiation on $\mathcal{P}_5$ is $\mathcal{P}_4$ (derivatives of degree-5 polynomials have degree at most 4). For $S: \mathcal{P}_5 \to \mathcal{P}_5$, the image is $\mathcal{P}_4 \subsetneq \mathcal{P}_5$, so $S$ is NOT surjective (e.g., $x^5$ is not the derivative of any polynomial in $\mathcal{P}_5$). For $T: \mathcal{P}_5 \to \mathcal{P}_4$, the image equals the codomain $\mathcal{P}_4$, so $T$ IS surjective. This illustrates how surjectivity depends on the choice of codomain, not just the rule.
  key_insight: null
  distractor_rationale:
    A: |
      the image of $S$ is $\mathcal{P}_4$, not $\mathcal{P}_5$; for example, $x^5$ cannot be obtained as a derivative of any polynomial of degree $\leq 5$
    B: |
      false: $p(x) = x$ and $q(x) = x + 7$ have the same derivative $p' = q' = 1$. The kernel of differentiation is the constant polynomials, which is nontrivial, so differentiation is never injective on polynomial spaces.
    C: |
      both have the same kernel: constant polynomials. The kernel depends only on the map's rule, not on the declared codomain. $\ker(S) = \ker(T) = \mathcal{P}_0$, with dimension 1.
    E: |
      differentiation is NOT invertible! Integration is only a right inverse: $\frac{d}{dx}(\int p) = p$, but $\int(\frac{d}{dx}p) = p + C \neq p$. The kernel is nontrivial, so neither $S$ nor $T$ can be an isomorphism.
