statement: |
  Consider differentiation as a linear transformation on polynomial spaces. Define:
  \begin{align*}
  S &: \mathcal{P}_5 \to \mathcal{P}_5 \quad \text{by} \quad S(p) = p' \\
  T &: \mathcal{P}_5 \to \mathcal{P}_4 \quad \text{by} \quad T(p) = p'
  \end{align*}
  Both maps send a polynomial to its derivative; they differ only in their declared codomains.

  Which statement is TRUE?
choices:
- label: A
  text: $S$ is surjective because every polynomial in $\mathcal{P}_5$ is the derivative of some polynomial.
- label: B
  text: $T$ is injective because different polynomials have different derivatives.
- label: C
  text: $S$ and $T$ have kernels of different dimensions.
- label: D
  text: $T$ is surjective but $S$ is not.
- label: E
  text: $S$ and $T$ are both isomorphisms since differentiation is invertible via integration.
figures: []
answer:
  correct: D
  partial_credit: []
