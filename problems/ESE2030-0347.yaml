statement: |
  Robust principal component analysis writes an observed matrix as $M = L + S$ with $L$ of low rank and $S$ ``sparse.'' Which description of $S$ is what sparse means here?
choices:
- label: A
  text: Every entry of $S$ is small compared with the entries of $L$
- label: B
  text: $S$ has low rank, but lower than $L$
- label: C
  text: |-
    $S$ is the noise: small random entries in every position
- label: D
  text: $S$ has few nonzero entries, which may be arbitrarily large
- label: E
  text: $S$ has small nuclear norm
figures: []
answer:
  correct: D
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Sparse means few nonzero entries, with no restriction on their size: gross, structured corruption that touches a small fraction of the matrix and leaves the rest reliable. That is why the sparse part is measured by the entrywise $\ell_1$ norm, which plays for sparsity the role the nuclear norm plays for low rank. Small noise everywhere is a different kind of damage, the kind truncated SVD tolerates on its own; it is the $N$ in $M = L + S + N$, not the $S$.
  key_insight: null
  distractor_rationale:
    A: |
      Trick: the listed trap. Sparsity is about how many entries are nonzero, not how big they are; a single corrupted pixel of enormous value is sparse.
    B: |
      Distractor: low rank is the property of $L$; if $S$ were also low rank the two could not be told apart.
    C: |
      Trick: dense small noise is $N$, handled by truncation; the sparse term exists precisely for the errors truncation cannot absorb.
    E: |
      Distractor: the nuclear norm is the surrogate for rank, applied to $L$; the surrogate for sparsity is the entrywise $\ell_1$ norm.
