statement: |
  Let $T: \mathbb{R}^4 \to \mathbb{R}^3$ be a linear transformation with $\text{rank}(T) = 2$.
  Consider the quotient space $\mathbb{R}^4/\ker(T)$ and the image $\text{im}(T)$.
  Which statement about the relationship between these spaces is true?
choices:
- label: A
  text: They have the same dimension but are not isomorphic since one lives in $\mathbb{R}^4$ and the
    other in $\mathbb{R}^3$
- label: B
  text: They are isomorphic, and the isomorphism is induced by the transformation $T$ itself
- label: C
  text: The quotient space has dimension $3$ while the image has dimension $2$, so they cannot be isomorphic
- label: D
  text: They are the same space
- label: E
  text: The quotient space is undefined since $\ker(T)$ might not be a proper subspace
figures: []
answer:
  correct: B
  partial_credit:
  - A
  verified: true
  verified_from:
