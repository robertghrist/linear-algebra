  conflict: null
  explanation: |
    By the First Isomorphism Theorem (fundamental theorem), $\mathbb{R}^4/\ker(T) \cong \text{im}(T)$. The transformation $T$ induces this isomorphism naturally. Both spaces have dimension 2 (quotient: $\dim(\mathbb{R}^4) - \dim(\ker(T)) = 4 - 2 = 2$; image: rank = 2).
