statement: |
  Let $A$ be a \textit{symmetric} $3 \times 3$ matrix with eigenvalues $\lambda_1 = 5$, $\lambda_2 = 3$, and $\lambda_3 = 3$. Using the convention that an eigenvector $\mathbf{v}_i$ always goes with the eigenvalue $\lambda_i$, which of the following statements is most correct?
choices:
- label: A
  text: The eigenspace for $\lambda = 3$ has dimension 1, so only one of $\mathbf{v}_2$ or $\mathbf{v}_3$
    exists
- label: B
  text: $\mathbf{v}_1$ must be orthogonal to both $\mathbf{v}_2$ and $\mathbf{v}_3$, but $\mathbf{v}_2$
    and $\mathbf{v}_3$ need not be orthogonal since they share the same eigenvalue
- label: C
  text: All three eigenvectors exist, but we must apply Gram-Schmidt within the eigenspace for $\lambda
    = 3$ to make $\mathbf{v}_2$ and $\mathbf{v}_3$ orthogonal
- label: D
  text: The repeated eigenvalue means $A$ is not diagonalizable, so we cannot find three linearly independent
    eigenvectors
- label: E
  text: All three $\mathbf{v}_i$ exist and are mutually orthogonal
figures: []
answer:
  correct: E
  partial_credit:
