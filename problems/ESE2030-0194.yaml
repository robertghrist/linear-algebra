statement: |
  Let $\mathcal{B}$ and $\mathcal{C}$ be two different ordered bases for $\mathbb{R}^3$. Suppose vectors $\mathbf{v}$ and $\mathbf{w}$ satisfy
  $$[\mathbf{v}]_{\mathcal{B}} = [\mathbf{w}]_{\mathcal{C}} = \begin{pmatrix} 2 \\ -1 \\ 3 \end{pmatrix}.$$
  Which statement is correct?
choices:
- label: A
  text: $\mathbf{v} = \mathbf{w}$, since their coordinate representations are identical
- label: B
  text: $\mathbf{v}$ and $\mathbf{w}$ need not be equal
- label: C
  text: $\|\mathbf{v}\| = \|\mathbf{w}\|$, since the norm is determined by the coordinate entries
- label: D
  text: $\mathbf{v} = \mathbf{w}$ if and only if both $\mathcal{B}$ and $\mathcal{C}$ are orthonormal
- label: E
  text: The equation $[\mathbf{v}]_{\mathcal{B}} = [\mathbf{w}]_{\mathcal{C}}$ forces $\mathcal{B} = \mathcal{C}$
figures: []
answer:
  correct: B
  partial_credit: []
