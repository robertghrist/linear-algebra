  conflict: null
  explanation: |
    Coordinates encode a vector relative to a specific basis. Writing $\mathcal{B} = \{\mathbf{b}_1, \mathbf{b}_2, \mathbf{b}_3\}$ and $\mathcal{C} = \{\mathbf{c}_1, \mathbf{c}_2, \mathbf{c}_3\}$, we have $\mathbf{v} = 2\mathbf{b}_1 - \mathbf{b}_2 + 3\mathbf{b}_3$ and $\mathbf{w} = 2\mathbf{c}_1 - \mathbf{c}_2 + 3\mathbf{c}_3$. Since $\mathcal{B} \neq \mathcal{C}$, these are generically different vectors in $\mathbb{R}^3$. The coordinate vector is not the vector itself; it is a representation that depends on the chosen basis.
  key_insight: null
  distractor_rationale:
    A: |
      the most common misconception about coordinates: conflating a vector with its coordinate representation; students who think ``same numbers = same vector'' pick this
    C: |
      the norm of a coordinate vector equals the norm of the original vector only when the basis is orthonormal; for a general basis, $\|\mathbf{v}\|^2$ involves cross terms from the Gram matrix of $\mathcal{B}$, so identical coordinate entries in different bases do not guarantee equal norms
    D: |
      orthonormality is not the relevant condition for equality; $\mathbf{v} = \mathbf{w}$ iff $2\mathbf{b}_1 - \mathbf{b}_2 + 3\mathbf{b}_3 = 2\mathbf{c}_1 - \mathbf{c}_2 + 3\mathbf{c}_3$, which depends on the specific basis vectors, not on whether they are orthonormal
