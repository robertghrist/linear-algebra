statement: |
  Let $\rho$ be a density on $N = 4$ outcomes with $\rho = (0.5, 0.3, 0.2, 0)^T$: outcome 4 is impossible. Define $\langle f, g\rangle_\rho = \sum_i \rho_i f_i g_i$ as usual. Which inner-product axiom fails?
choices:
- label: A
  text: 'Positive-definiteness: some $f \neq \mathbf{0}$ has $\langle f, f\rangle_\rho = 0$'
- label: B
  text: 'Symmetry: $\langle f, g\rangle_\rho \neq \langle g, f\rangle_\rho$ for some $f, g$'
- label: C
  text: Bilinearity
- label: D
  text: $\norm{\mathbf{1}}_\rho = 1$ no longer holds
- label: E
  text: None; it is still an inner product
figures: []
answer:
  correct: A
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Take $f = \mathbf{e}_4$: then $\langle f, f\rangle_\rho = \rho_4 = 0$ with $f \neq \mathbf{0}$. Symmetry and bilinearity survive any choice of weights, and $\sum_i \rho_i = 1$ still, so $\mathbf{1}$ still has unit length. The form is positive \emph{semi}definite, and the text's remedy is to identify random variables that agree except on outcomes of probability zero --- a quotient construction in the spirit of Section 3.6.
  key_insight: null
  distractor_rationale:
    B: |
      Distractor: symmetry holds for any weights.
    C: |
      Distractor: bilinearity holds for any weights.
    D: |
      Trick: total probability is unchanged; $\mathbf{1}$ is still a unit vector. Confuses the two hypotheses on $\rho$ (positivity vs. unit mass).
    E: |
      Trick: the form is only semidefinite --- the reason the text asks for $\rho_i > 0$.
