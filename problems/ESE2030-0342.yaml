statement: |
  $\lambda$ is an eigenvalue of $A$ with eigenvector $\mathbf{v}$, and $\mathbf{w}$ is a vector with $(A - \lambda I)\mathbf{w} = \mathbf{v}$. Which of the following is a solution of $\dot{\mathbf{x}} = A\mathbf{x}$ that the vector $\mathbf{w}$ makes available?
choices:
- label: A
  text: $e^{\lambda t}(\mathbf{v} + t\,\mathbf{w})$
- label: B
  text: $t\,e^{\lambda t}\,\mathbf{w}$
- label: C
  text: $e^{\lambda t}\,\mathbf{w}$
- label: D
  text: $t\,e^{\lambda t}\,\mathbf{v}$
- label: E
  text: $e^{\lambda t}(\mathbf{w} + t\,\mathbf{v})$
figures: []
answer:
  correct: E
  partial_credit:
  - A
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Differentiate $\mathbf{x} = e^{\lambda t}(\mathbf{w} + t\mathbf{v})$: $\dot{\mathbf{x}} = e^{\lambda t}(\lambda\mathbf{w} + \lambda t\mathbf{v} + \mathbf{v})$. Apply $A$: $A\mathbf{x} = e^{\lambda t}(A\mathbf{w} + tA\mathbf{v}) = e^{\lambda t}(\lambda\mathbf{w} + \mathbf{v} + \lambda t\mathbf{v})$, using $A\mathbf{w} = \lambda\mathbf{w} + \mathbf{v}$. The two agree. The generalized eigenvector buys the $t e^{\lambda t}$ term that a defective eigenvalue needs and an eigenvector alone cannot supply; the $t$ multiplies the eigenvector, and the generalized eigenvector rides along without it.
  key_insight: null
  distractor_rationale:
    A: |
      Partial credit: the right two ingredients with the roles swapped. Insight 1 of 2: the solution combines $\mathbf{v}$ and $\mathbf{w}$ with a factor $t e^{\lambda t}$. Missing: differentiating shows the $t$ must sit on the eigenvector; $e^{\lambda t}(\mathbf{v} + t\mathbf{w})$ fails since $A\mathbf{w} \neq \lambda\mathbf{w}$. Prefix: yes. Guessable: no. Defensible: yes.
    B: |
      Distractor: $\frac{d}{dt}(te^{\lambda t}\mathbf{w}) = e^{\lambda t}\mathbf{w} + \lambda t e^{\lambda t}\mathbf{w}$, while $A(te^{\lambda t}\mathbf{w}) = te^{\lambda t}(\lambda\mathbf{w} + \mathbf{v})$; the terms without $t$ do not match.
    C: |
      Trick: treats $\mathbf{w}$ as an eigenvector. $A\mathbf{w} = \lambda\mathbf{w} + \mathbf{v} \neq \lambda\mathbf{w}$, so $e^{\lambda t}\mathbf{w}$ is not a solution.
    D: |
      Distractor: the listed trap in a new coat: the $te^{\lambda t}$ term never appears alone; differentiating it produces an $e^{\lambda t}\mathbf{v}$ that must be absorbed by the $\mathbf{w}$ term.
