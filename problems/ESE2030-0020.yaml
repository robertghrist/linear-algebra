statement: |
  Let $V$ be a vector space and $S = \{\mathbf{v_1, v_2, ..., v_n}\}$ be a set of vectors in $V$. If every vector in $V$ can be written as a linear combination of vectors in $S$, then which statement is true by definition?
choices:
- label: A
  text: $S$ is a basis for $V$
- label: B
  text: $S$ is linearly independent
- label: C
  text: The dimension of $V$ is at most $n$
- label: D
  text: The dimension of $V$ is exactly $n$
- label: E
  text: $S$ spans $V$
figures: []
answer:
  correct: E
  partial_credit:
  - C
  verified: true
  verified_from:
  - quizzes-exams/2025-C/2030-Q1-ANSWERS.tex
  conflict: null
  explanation: |
    The problem statement exactly describes the definition of "$S$ spans $V$." \begin{itemize} \item This doesn't imply $S$ is a basis (need linear independence too) \item This doesn't imply $S$ is linearly independent \item While (C) is true (can't span with fewer than $\dim(V)$ vectors), it's a theorem, not the definition \end{itemize}
  key_insight: |
    "Spans" means exactly "every vector can be written as a linear combination."
