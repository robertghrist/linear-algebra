statement: |
  For random variables $f, g$ on a finite outcome space with the probability inner product, which of the following statements can be \emph{false}?
choices:
- label: A
  text: If $f$ and $g$ are independent, then $\operatorname{cov}(f,g) = 0$
- label: B
  text: If $\operatorname{cov}(f,g) = 0$, then $f$ and $g$ are independent
- label: C
  text: $-1 \leq \operatorname{corr}(f,g) \leq 1$
- label: D
  text: If $\operatorname{cov}(f,g) = 0$, then $\mathbb{V}(f+g) = \mathbb{V}(f) + \mathbb{V}(g)$
- label: E
  text: $\mathbb{E}(f+g) = \mathbb{E}(f) + \mathbb{E}(g)$
figures: []
answer:
  correct: B
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Uncorrelated means the residuals are orthogonal; independent means much more. A standard counterexample: four equally likely outcomes with $f = (1,-1,1,-1)$ and $g = (1,1,-1,-1)$ have $\operatorname{cov}(f,g) = 0$, but $f$ and $g$ are not independent since $fg = (1,-1,-1,1)$ is not constant on the events where $f$ is fixed --- in fact $g^2 = f^2 = \mathbf{1}$ here, so $f$ and $|g|$ are trivially dependent. (A) is the true direction; (C) is Cauchy-Schwarz; (D) is the law of cosines with the cross term removed; (E) needs no hypothesis at all.
  key_insight: null
  distractor_rationale:
    A: |
      Trick: the twin of the answer; this direction is the true one.
    C: |
      Distractor: always true --- it is Cauchy-Schwarz (Lemma 5.5) for the residuals.
    D: |
      Distractor: always true --- the cross term in the law of cosines is exactly the covariance.
    E: |
      Distractor: always true, with no independence hypothesis (linearity of the inner product).
