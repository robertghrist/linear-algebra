statement: |
  In a feed-forward network, layer $k$ takes input $\mathbf{h}_{k-1}$ and produces $\mathbf{z}_k = W_k \mathbf{h}_{k-1} + \mathbf{b}_k$ followed by $\mathbf{h}_k = \sigma(\mathbf{z}_k)$, with $\sigma$ applied componentwise. Define $\boldsymbol{\delta}_k = \partial L / \partial \mathbf{z}_k$.
  Backpropagation produces a recursion that expresses $\boldsymbol{\delta}_k$ in terms of $\boldsymbol{\delta}_{k+1}$. Which is the most accurate description of \emph{why} this recursion takes the form it does?
choices:
- label: A
  text: Since the loss is computed at the output, a hidden layer's contribution decays geometrically with
    depth, and the recursion encodes that decay.
- label: B
  text: The map $\mathbf{z}_k \mapsto \mathbf{z}_{k+1}$ factors through $\mathbf{h}_k$, and its derivative
    is the product of the derivatives of the two pieces --- a diagonal matrix from componentwise $\sigma$
    and the matrix $W_{k+1}$ from the affine step. %Pulling a gradient back through this composition multiplies
    by the transposes of these derivatives in reverse order.
- label: C
  text: The recursion is a consequence of gradient descent on the loss, in which the learning rate is
    replaced by $\mathrm{diag}(\sigma'(\mathbf{z}_k))$ to keep updates well-scaled across layers.
- label: D
  text: Backpropagation distributes the output error $\mathbf{h}_{\text{out}} - \mathbf{t}$ across layers
    in proportion to each layer's share of the network's total weight magnitude.
- label: E
  text: Each layer must be inverted to send information from the output back toward the input, so the
    recursion involves $W_{k+1}^{-1}$ acting on $\boldsymbol{\delta}_{k+1}$.
