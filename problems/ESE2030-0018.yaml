  explanation: |
    The Fundamental Theorem of Linear Algebra states: $$\text{coim}(T) \cong \text{im}(T)$$ That is, the coimage $V/\ker(T)$ is isomorphic to the image of $T$. None of the given options correctly state this relationship. This tests precise understanding of the theorem's statement.
  key_insight: |
    The key isomorphism is between what's "left after modding out the kernel" and what actually gets mapped to.
