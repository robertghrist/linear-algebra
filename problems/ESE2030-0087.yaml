  explanation: |
    Stochastic matrices (where columns sum to 1 and entries are non-negative) always have $\lambda = 1$ as an eigenvalue. The corresponding eigenvector, normalized so its entries sum to 1, gives the stationary distribution—the long-term market share that the system converges to regardless of initial distribution. After many iterations, $\mathbf{x}_k = P^k\mathbf{x}_0$ converges to this stationary distribution. This is a fundamental result in Markov chain theory: the eigenvalue $\lambda = 1$ is dominant (by Perron-Frobenius), and its positive eigenvector describes the equilibrium.
