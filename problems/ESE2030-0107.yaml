statement: |
  A data scientist analyzes measurements from six sensors monitoring a thermodynamic process. The sensors measure various properties of the system: pressure, temperature, volume, entropy, enthalpy, and work.
  The figures below plot (vertically) cumulative explained variance for covariance PCA (left) and correlation PCA (right), versus (horizontally) number of singular values (from 0 to 6). Based on these plots, which interpretation is most appropriate?
choices:
- label: A
  text: 'Covariance PCA reveals that the process is essentially one-dimensional: a single latent variable
    explains 94\% of all variation, making $k=1$ the optimal choice for dimensionality reduction.'
- label: B
  text: Correlation PCA suggests the process has intrinsic dimension approximately 3, with scale differences
    among sensors masking this structure in the covariance analysis.
- label: C
  text: Both analyses agree on low intrinsic dimensionality; correlation PCA is always preferable as it
    preserves the natural units of measurement.
- label: D
  text: The correlation PCA result is misleading because standardizing variables inflates the apparent
    contribution of low-variance sensors like volume.
- label: E
  text: A rank-2 approximation captures over 75\% of variance in both analyses, so either method supports
    reducing to 2 dimensions.
