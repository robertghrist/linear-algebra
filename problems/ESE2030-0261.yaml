  explanation: |
    The SVD route and the covariance-eigendecomposition route are not just numerically equivalent --- they are the \emph{same diagonalization, viewed through two factorizations}. Computing $X^T X$ from the SVD: $$X^T X = (U \Sigma V^T)^T (U \Sigma V^T) = V \Sigma^T U^T U \Sigma V^T = V (\Sigma^T \Sigma) V^T,$$ using $U^T U = I$. The matrix $\Sigma^T \Sigma$ is the $d \times d$ diagonal matrix with entries $\sigma_i^2$. So $X^T X = V \Lambda V^T$ is an orthogonal diagonalization of $X^T X$ with eigenvalues $\sigma_i^2$ and eigenvectors $\mathbf{v}_i$ (the columns of $V$). The covariance matrix is $C = \frac{1}{n} X^T X$, so the eigenvectors of $C$ are the same $\mathbf{v}_i$, but the eigenvalues are scaled by $1/n$: $$C = \frac{1}{n} V (\Sigma^T \Sigma) V^T \;=\; V \Lambda_C V^T, \qquad \Lambda_C = \mathrm{diag}\!\left(\tfrac{\sigma_1^2}{n}, \ldots, \tfrac{\sigma_d^2}{n}\right).$$ Hence: principal components are the columns of $V$, the right singular vectors of $X$; and the eigenvalues of $C$ (the variances along principal directions) are $\sigma_i^2 / n$. [Two structural takeaways. (i) The principal components live in the \emph{feature space} $\mathbb{R}^d$ --- they are directions among features, not among observations --- which is exactly where the columns of $V$ live. The columns of $U$ live in the observation space $\mathbb{R}^n$ and are a different (related but distinct) object: they give the projections of the observations onto the principal directions, scaled by $\sigma_i$. (ii) The square-root relationship between singular values and covariance eigenvalues, $\sigma_i^2 = n \cdot \lambda_i(C)$, is the single most important computational fact in PCA. In practice one almost always computes PCA via the SVD of $X$ rather than forming $X^T X$ explicitly, because forming $X^T X$ squares the condition number and amplifies numerical error. The two routes give identical principal components but the SVD route is dramatically more stable.]
  key_insight: null
  distractor_rationale:
    B: |
      D5 naive-prior: misses the structural identity entirely. The two procedures are not coincidentally compatible --- they are algebraically the same diagonalization. A student who picks (A) has not seen the $X^T X = V \Sigma^T \Sigma V^T$ computation.
    E: |
      D6 shape-implies-property: swaps $U$ and $V$. The columns of $U$ live in the observation space $\mathbb{R}^n$, not the feature space $\mathbb{R}^d$ where principal components must live. Classic feature-vs-observation confusion, parallel to the $X^T X$ vs $X X^T$ trap in P32. Compounded by also dropping the square: claims $\sigma_i$ are eigenvalues of $C$ rather than $\sigma_i^2/n$.
