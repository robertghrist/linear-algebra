statement: |
  Let $X \in \mathbb{R}^{n \times d}$ be a centered data matrix ($n$
  observations, $d$ features, each column with sample mean zero). The
  principal components of the data may be computed in two ways: (i) by
  diagonalizing the covariance matrix $C$, or (ii) by
  computing the SVD $X = U\Sigma V^T$. Suppose the SVD has singular values
  $\sigma_1 \geq \sigma_2 \geq \cdots \geq \sigma_d \geq 0$. Which of the
  following best describes the relationship between the two routes?
choices:
- label: A
  text: The columns of $V$ are the principal components, and the eigenvalues of $C$ are $\sigma_i^2 /
    n$, because the SVD diagonalizes $X^T X$ rather than $C$ itself.
- label: B
  text: The two routes are unrelated computational procedures that happen to give the same numerical answer;
    the agreement is coincidental.
- label: C
  text: The columns of $V$ are the principal components, and the eigenvalues of $C$ are $\sigma_i$, since
    the SVD computes the same diagonalization as the covariance route.
- label: D
  text: The columns of $V$ are the principal components, and the eigenvalues of $C$ are $\sigma_i^2$.
- label: E
  text: The columns of $U$ are the principal components, and the eigenvalues of $C$ are the singular values
    $\sigma_i$ themselves.
