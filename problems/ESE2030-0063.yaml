  conflict: null
  explanation: |
    The most fundamental characterization of orthogonal projection is the best approximation property: $\Pi_W(\mathbf{v})$ is the unique vector in $W$ closest to $\mathbf{v}$. This geometric property captures WHY we care about projections—they provide optimal approximations of vectors by vectors in a subspace. All other properties follow from this: the idempotent and self-adjoint properties (B) are algebraic consequences; the decomposition (C) is another way to describe the same phenomenon; and the matrix formulas (D, E) are computational methods that implement the projection. The best approximation property is the most conceptually fundamental because it explains the purpose and meaning of projection, from which all other characterizations derive.
  key_insight: null
  distractor_rationale:
    B: |
      algebraically correct but describes properties rather than the fundamental geometric meaning
    D: |
      computationally correct but merely a formula - doesn't explain what projection means or why we use it
    E: |
      correct computational approach but again just a method, not the fundamental geometric insight
