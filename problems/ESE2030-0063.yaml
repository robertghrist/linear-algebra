statement: |
  Which of the following provides the best fundamental description of the orthogonal projection $\Pi_W(\mathbf{v})$ of a vector $\mathbf{v}$ onto a subspace $W$?
choices:
- label: A
  text: The unique vector in $W$ that minimizes $\|\mathbf{v} - \mathbf{w}\|$ over all $\mathbf{w} \in
    W$
- label: B
  text: A linear operator satisfying $\Pi_W^2 = \Pi_W$ and $\Pi_W^* = \Pi_W$
- label: C
  text: The component of $\mathbf{v}$ that lies in $W$ when $\mathbf{v}$ is decomposed as $\mathbf{v}
    = \mathbf{v}_W + \mathbf{v}_{W^\perp}$
- label: D
  text: The vector obtained by applying the matrix $A(A^TA)^{-1}A^T$ to $\mathbf{v}$, where the columns
    of $A$ span $W$
- label: E
  text: The solution to the normal equations $A^TA\mathbf{x} = A^T\mathbf{v}$ when the columns of $A$
    form a basis for $W$
figures: []
answer:
  correct: A
  partial_credit:
  - C
  verified: true
  verified_from:
  - quizzes-exams/2025-C/2030-Q3-ANSWERS.tex
