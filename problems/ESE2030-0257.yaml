statement: |
  The matrix $A \in \mathbb{R}^{500 \times 200}$ has SVD $A = U\Sigma V^T$ with exactly $100$ nonzero singular values $\sigma_1 \geq \sigma_2 \geq \cdots \geq \sigma_{100} > 0$ and $\sigma_{101} = \cdots = \sigma_{200} = 0$.

  Let $A_{50}$ denote the best rank-$50$ approximation to $A$. Which of the following best describes the image of the unit sphere in the domain under $A_{50}$?
choices:
- label: A
  text: A solid $50$-dimensional ellipsoid in $\mathrm{span}(\mathbf{v}_{51}, \ldots, \mathbf{v}_{100})
    \subset \mathbb{R}^{500}$, with semi-axis lengths $\sigma_{51}, \ldots, \sigma_{100}$.
- label: B
  text: A solid $50$-dimensional ellipsoid in $\mathrm{span}(\mathbf{v}_1, \ldots, \mathbf{v}_{50}) \subset
    \mathbb{R}^{200}$, with semi-axis lengths $\sigma_1, \ldots, \sigma_{50}$.
- label: C
  text: A solid $50$-dimensional ellipsoid in $\mathrm{span}(\mathbf{u}_1, \ldots, \mathbf{u}_{50}) \subset
    \mathbb{R}^{500}$, with semi-axis lengths $\sigma_1^2, \ldots, \sigma_{50}^2$.
- label: D
  text: A solid $50$-dimensional ellipsoid in $\mathrm{span}(\mathbf{u}_1, \ldots, \mathbf{u}_{50}) \subset
    \mathbb{R}^{500}$, with semi-axis lengths $\sigma_1, \ldots, \sigma_{50}$.
- label: E
  text: A solid $50$-dimensional ellipsoid in $\mathrm{span}(\mathbf{v}_1, \ldots, \mathbf{v}_{50}) \subset
    \mathbb{R}^{200}$, with semi-axis lengths $\sigma_1^2, \ldots, \sigma_{50}^2$.
