statement: |
  Let $A$ be a real symmetric $4 \times 4$ matrix with eigenvalues $\lambda_1 = 5$, $\lambda_2 = 5$, $\lambda_3 = -1$, and $\lambda_4 = -1$.
  Let $\mathbf{v}_1, \mathbf{v}_2$ be eigenvectors for $\lambda = 5$ and $\mathbf{v}_3, \mathbf{v}_4$ be eigenvectors for $\lambda = -1$.

  Which statement is guaranteed by the Spectral Theorem?
choices:
- label: A
  text: $\mathbf{v}_1 \perp \mathbf{v}_2$ and $\mathbf{v}_3 \perp \mathbf{v}_4$
- label: B
  text: $\mathbf{v}_1 \perp \mathbf{v}_3$ and $\mathbf{v}_2 \perp \mathbf{v}_4$, but eigenvectors for
    the same eigenvalue need not be orthogonal
- label: C
  text: All four eigenvectors are mutually orthogonal
- label: D
  text: $A$ can be written as $A = QDQ^T$ where $Q$ is orthogonal, but the columns of $Q$ are not necessarily
    eigenvectors
- label: E
  text: 'None: there may not be independent eigenvectors due to repeated eigenvalues'
figures: []
answer:
  correct: B
  partial_credit:
  - C
  verified: true
  verified_from:
  - quizzes-exams/2025-C/2030-FINAL-EXAM.tex
  conflict: null
  explanation: |
    The Spectral Theorem guarantees that eigenvectors corresponding to DISTINCT eigenvalues of a real symmetric matrix are orthogonal. Since $\lambda = 5 \neq -1$, we have $\mathbf{v}_1 \perp \mathbf{v}_3$, $\mathbf{v}_1 \perp \mathbf{v}_4$, $\mathbf{v}_2 \perp \mathbf{v}_3$, and $\mathbf{v}_2 \perp \mathbf{v}_4$. However, eigenvectors for the SAME eigenvalue (like $\mathbf{v}_1$ and $\mathbf{v}_2$, both for $\lambda = 5$) are not automatically orthogonal—any two linearly independent vectors in the 2-dimensional eigenspace work. We CAN choose them to be orthogonal via Gram-Schmidt, but arbitrary eigenvectors for a repeated eigenvalue need not be orthogonal.
  key_insight: null
  distractor_rationale:
    A: |
      exactly backwards; the theorem guarantees orthogonality for distinct eigenvalues, not same eigenvalues
    D: |
      the columns of $Q$ in $A = QDQ^T$ ARE eigenvectors; the whole point is that symmetric matrices are orthogonally diagonalizable
    E: |
      (Spectral Theorem guarantees existence) %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
