statement: |
  A network has $P$ parameters, and one forward pass (input to loss) costs $C$ arithmetic operations. Two ways to obtain the full gradient of the loss with respect to all $P$ parameters are backpropagation, and finite differences (perturb one parameter, rerun the forward pass, repeat). Which pair gives the orders of cost, backpropagation first?
choices:
- label: A
  text: $O(PC)$ and $O(PC)$
- label: B
  text: $O(C)$ and $O(C)$
- label: C
  text: $O(P)$ and $O(C)$
- label: D
  text: $O(PC)$ and $O(P^2 C)$
- label: E
  text: $O(C)$ and $O(PC)$
figures: []
answer:
  correct: E
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Finite differences need one forward pass per parameter: $P$ passes, $O(PC)$. Backpropagation is one forward sweep plus one backward sweep of the same order (Theorem 13.6): the entire gradient, one number per parameter, for a fixed constant multiple of $C$. The derivative of the network costs no more than the network. With $P$ in the millions or billions, this constant factor versus factor of $P$ is the whole reason training is possible.
  key_insight: null
  distractor_rationale:
    A: |
      Trick: assumes every parameter must be visited separately in both methods. Backpropagation delivers all $P$ derivatives from one backward sweep.
    B: |
      Distractor: finite differences cannot be done in one pass; each perturbed parameter needs its own forward evaluation.
    C: |
      Distractor: swaps the roles, and counts backpropagation as if it touched each parameter once at unit cost with no forward pass.
    D: |
      Distractor: one power too many on both sides; backpropagation does not scale with $P$ at all beyond writing the answer down.
