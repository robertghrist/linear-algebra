statement: |
  Consider a matrix $A \in \mathbb{R}^{m \times n}$ with $m > n$ and full column rank. The pseudoinverse $A^{\dagger} = (A^TA)^{-1}A^T$ can be understood geometrically through the Fundamental Theorem of Linear Algebra.

  Which of the following best describes the geometric action of $A^{\dagger}$ on a vector $\mathbf{b} \in \mathbb{R}^m$?
choices:
- label: A
  text: $A^{\dagger}$ first projects $\mathbf{b}$ onto $\ker(A^T)$, then applies the inverse map
- label: B
  text: $A^{\dagger}$ first projects $\mathbf{b}$ onto $\text{im}(A)$, then applies the inverse of $A$
    restricted to $(\ker A)^{\perp}$
- label: C
  text: $A^{\dagger}$ applies $A^{-1}$ directly when it exists, otherwise returns the zero vector
- label: D
  text: $A^{\dagger}$ computes the orthogonal complement of $\mathbf{b}$ in $\text{im}(A)$
- label: E
  text: $A^{\dagger}$ finds the unique vector in $\ker(A)$ closest to $\mathbf{b}$
figures: []
