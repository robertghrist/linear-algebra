  explanation: |
    The pseudoinverse has a beautiful geometric interpretation through the FTLA: it first projects $\mathbf{b}$ onto $\text{im}(A)$ (discarding the component in $(\text{im}(A))^{\perp} = \ker(A^T)$), obtaining $\Pi_{\text{im}(A)}\mathbf{b}$. Then, since $A$ restricted to $(\ker A)^{\perp}$ is an isomorphism onto $\text{im}(A)$, we can invert this restriction to find the unique preimage in $(\ker A)^{\perp}$. This is why $A^{\dagger}\mathbf{b}$ gives the minimum norm solution: it lives in $(\ker A)^{\perp}$, the smallest subspace containing all solutions. The formula $A^{\dagger} = (A^TA)^{-1}A^T$ implements this two-step process: $A^T$ projects onto $\text{im}(A^T) = (\ker A)^{\perp}$, and $(A^TA)^{-1}$ provides the inverse on this subspace.
  key_insight: null
  distractor_rationale:
    A: |
      projects onto the wrong subspace - should be $\text{im}(A)$, not $\ker(A^T)$
    C: |
      fundamentally misunderstands that the pseudoinverse works for non-square/singular matrices where $A^{-1}$ doesn't exist
    D: |
      confuses projection with orthogonal complement, and mistakes the input-output relationship
    E: |
      the solution lives in $(\ker A)^{\perp}$, not in $\ker(A)$; this reverses the key geometric insight
