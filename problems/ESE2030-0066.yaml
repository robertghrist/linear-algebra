statement: |
  Consider the initial value problem $\frac{d\mathbf{x}}{dt} = A\mathbf{x}$ with $\mathbf{x}(0) = \mathbf{x}_0$, where $A$ is an $n \times n$ matrix. The solution is given by $\mathbf{x}(t) = e^{At}\mathbf{x}_0$.

  Which property is the most fundamental reason why $e^{At}\mathbf{x}_0$ solves this initial value problem?
choices:
- label: A
  text: The matrix exponential $e^{At}$ is always invertible, so we can recover the initial condition
- label: B
  text: The matrix exponential satisfies $e^{A \cdot 0} = I$, which gives $\mathbf{x}(0) = \mathbf{x}_0$
- label: C
  text: The matrix exponential satisfies $\frac{d}{dt}e^{At} = Ae^{At}$, which yields the differential
    equation
- label: D
  text: For diagonalizable $A$, we have $e^{At} = Ve^{\Lambda t}V^{-1}$ where eigenvalues determine behavior
- label: E
  text: The matrix exponential satisfies the flow property $e^{A(t+s)} = e^{At}e^{As}$
figures: []
answer:
  correct: C
  partial_credit:
  - B
