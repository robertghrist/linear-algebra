statement: |
  In $\mathcal{P}_2$, consider the set $S = \{1+x, x+x^2, 1+x^2\}$. This set is:
choices:
- label: A
  text: Linearly independent and spans $\mathcal{P}_2$
- label: B
  text: Linearly independent but does not span $\mathcal{P}_2$
- label: C
  text: Linearly dependent and spans $\mathcal{P}_2$
- label: D
  text: Linearly dependent and does not span $\mathcal{P}_2$
- label: E
