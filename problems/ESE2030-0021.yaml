  explanation: |
    Check linear independence by setting up: $$c_1(1+x) + c_2(x+x^2) + c_3(1+x^2) = 0$$ This gives the system: \begin{align} c_1 + c_3 &= 0 \quad \text{(constant term)}\\ c_1 + c_2 &= 0 \quad \text{(coefficient of } x\text{)}\\ c_2 + c_3 &= 0 \quad \text{(coefficient of } x^2\text{)} \end{align} The only solution is $c_1 = c_2 = c_3 = 0$, so the set is linearly independent. Since we have 3 independent vectors in the 3-dimensional space $\mathcal{P}_2$, they form a basis.
