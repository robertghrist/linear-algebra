statement: |
  A fourth-order linear homogeneous ODE has characteristic polynomial
  $$p(\lambda) = (\lambda - 1)(\lambda + 2)^2(\lambda + 3) = 0$$
  Which of the following is the correct general solution?
choices:
- label: A
  text: $x(t) = c_1 e^{t} + c_2 e^{-2t} + c_3 e^{-3t}$
- label: B
  text: $x(t) = c_1 e^{t} + c_2 e^{-2t} + c_3 e^{-2t}\cos(t) + c_4 e^{-3t}$
- label: C
  text: $x(t) = c_1 e^{t} + c_2 e^{-2t} + c_3 te^{-2t} + c_4 e^{-3t}$
- label: D
  text: $x(t) = c_1 e^{t} + c_2 e^{-2t} + c_3 t^2 e^{-2t} + c_4 e^{-3t}$
- label: E
  text: $x(t) = c_1 e^{t} + c_2 e^{-2t} + c_3 te^{-2t} + c_4 te^{-3t}$
figures: []
answer:
  correct: C
  partial_credit: []
  verified: true
