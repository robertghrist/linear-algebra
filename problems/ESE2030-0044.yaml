statement: |
  Which of the following matrices is orthogonal? {\em Hint:} be strategic and do not do {\em all} the computations...
choices:
- label: A
  text: Q_1 = \begin{bmatrix} 2/3 & 2/3 & 1/3 \\ -2/3 & 1/3 & 2/3 \\ 1/3 & -2/3 & 2/3 \end{bmatrix}
- label: B
  text: Q_2 = \begin{bmatrix} 1/\sqrt{3} & 1/\sqrt{2} & 1/\sqrt{6} \\ 1/\sqrt{3} & -1/\sqrt{2} & 1/\sqrt{6}
    \\ 1/\sqrt{3} & 0 & -2/\sqrt{6} \end{bmatrix}
- label: C
  text: Q_3 = \begin{bmatrix} 1/\sqrt{2} & 1/\sqrt{3} & 1/\sqrt{6} \\ 0 & 1/\sqrt{3} & -2/\sqrt{6} \\
    1/\sqrt{2} & -1/\sqrt{3} & 1/\sqrt{6} \end{bmatrix}
- label: D
  text: Q_4 = \begin{bmatrix} 1/2 & 1/2 & 1/\sqrt{2} \\ 1/2 & 1/2 & -1/\sqrt{2} \\ -1/\sqrt{2} & 1/\sqrt{2}
    & 0 \end{bmatrix}
- label: E
  text: None of the above is orthogonal.
