  explanation: |
    An orthogonal matrix requires ALL columns to be orthonormal (pairwise orthogonal and each of unit length). For $Q_2$: - Column 1: $\|(1/\sqrt{3}, 1/\sqrt{3}, 1/\sqrt{3})\| = \sqrt{3 \cdot 1/3} = 1$ ✓ - Column 2: $\|(1/\sqrt{2}, -1/\sqrt{2}, 0)\| = \sqrt{2 \cdot 1/2} = 1$ ✓ - Column 3: $\|(1/\sqrt{6}, 1/\sqrt{6}, -2/\sqrt{6})\| = \sqrt{(1+1+4)/6} = 1$ ✓ - Columns 1&2: $(1/\sqrt{3})(1/\sqrt{2}) + (1/\sqrt{3})(-1/\sqrt{2}) + (1/\sqrt{3})(0) = 0$ ✓ - Columns 1&3: $(1/\sqrt{3})(1/\sqrt{6}) + (1/\sqrt{3})(1/\sqrt{6}) + (1/\sqrt{3})(-2/\sqrt{6}) = 0$ ✓ - Columns 2&3: $(1/\sqrt{2})(1/\sqrt{6}) + (-1/\sqrt{2})(1/\sqrt{6}) + (0)(-2/\sqrt{6}) = 0$ ✓
