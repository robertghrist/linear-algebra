  explanation: |
    The orthogonal decomposition theorem states that any vector space can be decomposed as a direct sum $V = W \oplus W^{\perp}$, meaning every vector in $V$ can be uniquely written as a sum of a vector in $W$ and a vector in $W^{\perp}$. The only vector in both $W$ and $W^{\perp}$ is the zero vector (since a nonzero vector cannot be orthogonal to itself). This gives us $\dim(V) = \dim(W) + \dim(W^{\perp})$.
  key_insight: null
