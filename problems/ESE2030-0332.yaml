statement: |
  Let $V = \mathbb{R}^3$ and let $U$ be the $z$-axis. Which statement about the quotient $V/U$ is forced?
choices:
- label: A
  text: The $xy$-plane is the unique complement of $U$
- label: B
  text: $V/U$ is the $xy$-plane
- label: C
  text: $\dim V/U = 2$
- label: D
  text: $V/U = U^\perp$
- label: E
  text: $V/U$ is a subspace of $V$
figures: []
answer:
  correct: C
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    $\dim V/U = \dim V - \dim U = 3 - 1 = 2$, and that is the only statement here that depends on nothing but $V$ and $U$. The quotient is the space of cosets $\mathbf{v} + U$, the lines parallel to the $z$-axis; it is not a subspace of $V$. Any plane through the origin that does not contain the $z$-axis is a complement of $U$, and each such plane is isomorphic to $V/U$; but the plane is a choice, and the quotient is not.
  key_insight: null
  distractor_rationale:
    A: |
      Trick: the listed trap. The $xy$-plane is one complement among infinitely many; the plane $z = x$ is another. A complement is a choice.
    B: |
      Trick: the $xy$-plane is a model for $V/U$ (a complement), not $V/U$ itself. The elements of $V/U$ are cosets, vertical lines, not vectors.
    D: |
      Distractor: $U^\perp$ needs an inner product, which the quotient construction never uses; and even with one, $U^\perp$ is a complement (a subspace of $V$), not the quotient.
    E: |
      Distractor: the quotient is built from $V$ but does not live inside it; its elements are equivalence classes of vectors.
