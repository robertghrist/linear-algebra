statement: |
  Consider a vector space $C^\infty([a,b])$ of smooth functions on an
  interval $[a,b]$ with inner product $\langle \cdot , \cdot \rangle$.
  Under which of the following inner products (and intervals) is the vector $p=\cosh x$ orthogonal to the vector $q=\sinh x$?
choices:
- label: A
  text: $\displaystyle \langle p, q \rangle = \int_{-1}^{1} p(x)\, q(x)\, dx$, on $C^\infty([-1,1])$
- label: B
  text: $\displaystyle \langle p, q \rangle = \int_{0}^{1} x\, p(x)\, q(x)\, dx$, on $C^\infty([0,1])$
- label: C
  text: $\displaystyle \langle p, q \rangle = \int_{0}^{1} p(x)\, q(x)\, dx$, on $C^\infty([0,1])$
- label: D
  text: $\displaystyle \langle p, q \rangle = \int_{-1}^{1} e^{x}\, p(x)\, q(x)\, dx$, on $C^\infty([-1,1])$
- label: E
  text: None of the above
figures: []
answer:
  correct: A
  partial_credit: []
