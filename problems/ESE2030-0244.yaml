  conflict: null
  explanation: |
    Eckart-Young: the truncated SVD $A_k = \sum_{i=1}^k \sigma_i\mathbf{u}_i\mathbf{v}_i^T$ minimizes $\|A - X\|_F$ over ALL rank-$k$ matrices $X$, with error $\sqrt{\sigma_{k+1}^2 + \cdots + \sigma_r^2}$. Here $k=2$ gives (A), with error $\sqrt{\sigma_3^2 + \sigma_4^2}$.
  key_insight: null
  distractor_rationale:
    D: |
      keeps the smallest two singular components; error $\sqrt{\sigma_1^2 + \sigma_2^2}$, the worst among SVD-based rank-$2$ truncations
    B: |
      similar to above
    A: |2+

