statement: |
  Let $A \in \mathbb{R}^{6 \times 4}$ have exactly four nonzero singular values
  $\sigma_i$, left singular vectors $\mathbf{u}_i$,
  and right singular vectors $\mathbf{v}_i$. Among all rank-$2$ matrices $X$,
  which minimizes $\|A - X\|_F$?
choices:
- label: A
  text: There is not a unique minimizer.
- label: B
  text: $\sigma_2\mathbf{u}_2\mathbf{v}_2^T + \sigma_3\mathbf{u}_3\mathbf{v}_3^T$.
- label: C
  text: $\sigma_1\mathbf{u}_1\mathbf{v}_1^T + \sigma_2\mathbf{u}_2\mathbf{v}_2^T$.
- label: D
  text: $\sigma_3\mathbf{u}_3\mathbf{v}_3^T + \sigma_4\mathbf{u}_4\mathbf{v}_4^T$.
- label: E
  text: $\sigma_1\mathbf{u}_1\mathbf{v}_1^T + \sigma_4\mathbf{u}_4\mathbf{v}_4^T$.
