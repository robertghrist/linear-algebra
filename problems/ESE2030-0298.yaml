statement: |
  Let $f, g$ be random variables with centered versions $\hat f = f - \mathbb{E}(f)\mathbf{1}$ and $\hat g = g - \mathbb{E}(g)\mathbf{1}$. Which condition is \emph{equivalent} to $\mathbb{V}(f+g) = \mathbb{V}(f) + \mathbb{V}(g)$?
choices:
- label: A
  text: $\langle \hat f, \hat g\rangle_\rho = 0$
- label: B
  text: $f$ and $g$ are independent
- label: C
  text: $\langle f, g\rangle_\rho = 0$
- label: D
  text: $\mathbb{E}(f) = \mathbb{E}(g) = 0$
- label: E
  text: $\norm{\hat f}_\rho = \norm{\hat g}_\rho$
figures: []
answer:
  correct: A
  partial_credit:
  - C
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Expanding $\norm{\hat f + \hat g}_\rho^2$ gives $\mathbb{V}(f+g) = \mathbb{V}(f) + \mathbb{V}(g) + 2\langle \hat f, \hat g\rangle_\rho$, so additivity holds exactly when the residuals are orthogonal (uncorrelated). Independence is sufficient but not necessary; orthogonality of the raw variables is the wrong pair of vectors.
  key_insight: null
  distractor_rationale:
    B: |
      Trick: independence implies orthogonal residuals, but the converse fails --- the condition is sufficient, not equivalent.
    C: |
      Partial credit: has the insight that additivity is an orthogonality condition, but tests the raw variables instead of the residuals. Insight 1 of 2 (orthogonality); missing: centering. Prefix: yes. Guessable: no. Defensible: yes.
    D: |
      Distractor: with zero means (A) and (C) coincide, but zero means alone say nothing about the covariance.
    E: |
      Distractor: equal lengths of the residuals is unrelated to their angle.
