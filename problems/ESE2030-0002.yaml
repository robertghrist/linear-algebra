statement: |
  For the lower triangular system $L\mathbf{x} = \mathbf{b}$ where $L = \begin{bmatrix} 2 & 0 & 0 \\ 1 & 3 & 0 \\ 4 & -1 & 5 \end{bmatrix}$, which statement about solving this system is most accurate?
choices:
- label: A
  text: One should use row reduction to find the solution
- label: B
  text: The system may have no solutions, depending on $\mathbf{b}$
- label: C
  text: One should solve by forward substitution
- label: D
  text: The system may have infinitely many solutions depending on $\mathbf{b}$
- label: E
  text: One should solve by backward substitution
figures: []
answer:
  correct: C
  partial_credit:
  - A
