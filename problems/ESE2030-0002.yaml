  explanation: |
    For a lower triangular system $L\mathbf{x} = \mathbf{b}$: \begin{itemize} \item Since $L$ has nonzero diagonal entries, it's invertible, so there's always a unique solution \item Forward substitution is the most efficient method: \begin{enumerate} \item Solve $2x_1 = b_1$ to get $x_1 = b_1/2$ \item Substitute into second equation: $x_1 + 3x_2 = b_2$ \item Continue forward through the system \end{enumerate} \item Backward substitution is for upper triangular systems \end{itemize}
  key_insight: |
    Forward = Lower, Backward = Upper (alphabetical order helps remember!)
