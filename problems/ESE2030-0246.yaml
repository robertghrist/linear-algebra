  conflict: null
  explanation: |
    The polar decomposition writes $A = QH$ with $Q$ orthogonal and $H$ symmetric positive definite. Geometrically, $H$ applies a ``pure stretch'' along orthogonal axes, then $Q$ rotates (or reflects). Squaring identifies $H$: $A^TA = (QH)^T(QH) = H^T Q^T Q H = H^2$, so $H = (A^TA)^{1/2}$. The stretching axes of $H$ are therefore the eigenvectors of $A^TA$ (equivalently, the right singular vectors of $A$); the stretching factors are the singular values $\sigma_i$. Analogue: polar coordinates for complex numbers, $z = re^{i\theta}$ --- magnitude (stretch) times rotation. The polar decomposition is the matrix version.
  key_insight: null
  distractor_rationale:
    B: |
      this is the QR decomposition from Week 6; the shared letter $Q$ tempts the student into matching ``orthogonal-times-something'' with the wrong named factorization
    D: |
      a hybrid: takes the structure of polar (orthogonal $\times$ symmetric positive definite) but uses the QR letter for the second factor. Catches students who remember ``polar is orthogonal times something nice'' without keeping the names straight; the actual notation convention for the second factor is $H$, and a polar-style identity $A = QH$ is not what ``QR decomposition'' refers to.
