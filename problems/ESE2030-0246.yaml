statement: |
  Which of the following correctly describes the polar decomposition of an invertible matrix $A \in \mathbb{R}^{n \times n}$?
choices:
- label: A
  text: $A = QH$, where $Q$ is orthogonal and $H$ is symmetric positive definite, with stretching axes
    given by the eigenvectors of $A^TA$.
- label: B
  text: $A = QR$, where $Q$ is orthogonal and $R$ is upper triangular.
- label: C
  text: $A = QH$, where $Q$ is orthogonal and $H$ is symmetric positive definite, with stretching axes
    given by the eigenvectors of $A$.
- label: D
  text: $A = QR$, where $Q$ is orthogonal and $R$ is symmetric positive definite.
- label: E
  text: None of the above.
figures: []
answer:
  correct: A
  partial_credit:
  - C
  verified: true
  verified_from:
  - quizzes-exams/2026-A/2030-Q4-SOLUTIONS.tex
