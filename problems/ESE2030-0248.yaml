statement: |
  Let $X \in \mathbb{R}^{n \times d}$ be a centered data matrix and let $X_k$ denote its
  rank-$k$ truncated SVD. The truncation satisfies the Pythagorean identity
  $$\|X\|_F^2 \;=\; \|X_k\|_F^2 \,+\, \|X - X_k\|_F^2.$$
  The Eckart-Young theorem says $X_k$ minimizes $\|X - B\|_F$ over rank-$k$ matrices $B$.
  PCA says the projection onto the first $k$ principal components maximizes the variance
  captured in $k$ dimensions. Why are these two statements equivalent?
choices:
- label: A
  text: Because the SVD diagonalizes $X$ and PCA diagonalizes $X^TX$, the two share eigenvectors.
- label: B
  text: 'They are not equivalent: Eckart-Young minimizes a matrix norm, while PCA maximizes a scalar quantity.'
- label: C
  text: They aren't equivalent in general; they happen to coincide for centered data.
- label: D
  text: Because the singular vectors $\mathbf{v}_1, \ldots, \mathbf{v}_k$ are orthonormal, projecting
    onto them preserves variance exactly.
- label: E
  text: Because $\|X\|_F^2$ is fixed, minimizing $\|X - X_k\|_F^2$ is the same as maximizing $\|X_k\|_F^2$,
    and the latter is proportional to the captured variance.
