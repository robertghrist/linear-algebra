  explanation: |
    The Pythagorean identity (given in the stem) is the entire engine. Since $\|X\|_F^2$ is a constant of the data, the identity says minimizing $\|X - X_k\|_F^2$ is equivalent to maximizing $\|X_k\|_F^2 = \sigma_1^2 + \cdots + \sigma_k^2$. Dividing by $n$ gives the PCA-captured variance, so the two optimizations have the same maximizer.
  key_insight: null
  distractor_rationale:
    C: |
      centering affects the *interpretation* of $\|X_k\|_F^2/n$ as variance, but the optimization equivalence holds for any $X$.
    D: |
      orthonormal projection preserves the squared norm of the projected component, but this is a *consequence* of the Pythagorean identity, not the explanation of the equivalence between two optimizations.
    B: |
      both are scalar optimizations; conflates "minimizing a Frobenius norm" with "the answer being a matrix."
