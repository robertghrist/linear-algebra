statement: |
  Exactly one of the following vectors lies in the probability simplex $\Delta^2 \subset \mathbb{R}^3$. Which?
choices:
- label: A
  text: $(0.5,\ 0.5,\ 0)^T$
- label: B
  text: $(0.6,\ 0.6,\ -0.2)^T$
- label: C
  text: $(0.2,\ 0.3,\ 0.4)^T$
- label: D
  text: $(0.7,\ 0.4,\ 0)^T$
- label: E
  text: $\tfrac{1}{\sqrt{3}}(1,\ 1,\ 1)^T$
figures: []
answer:
  correct: A
  partial_credit:
  - B
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Membership in $\Delta^{N-1}$ needs two things: entrywise nonnegativity and $\langle \rho, \mathbf{1}\rangle = 1$. Only (A) satisfies both; it lies on the boundary (outcome 3 forbidden), which is still in the simplex. (B) sums to one but has a negative entry; (C) is nonnegative but sums to $0.9$; (D) sums to $1.1$; (E) has unit \emph{length}, not unit sum.
  key_insight: null
  distractor_rationale:
    B: |
      Partial credit: checked the sum but not the sign. Insight 1 of 2 (unit mass); missing: nonnegativity. Prefix: yes. Guessable: no. Defensible: yes.
    C: |
      Distractor: nonnegative but the mass is $0.9$ --- the other half of the membership test.
    D: |
      Distractor: nonnegative but the mass is $1.1$.
    E: |
      Trick: confuses the unit sphere with the simplex --- unit length is $\norm{\rho} = 1$, not $\langle \rho, \mathbf{1}\rangle = 1$.
