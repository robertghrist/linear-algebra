statement: |
  A linear autoencoder has round trip $T = D \circ E : \mathbb{R}^n \to \mathbb{R}^n$ with bottleneck $k \ll n$, trained to minimize the squared reconstruction error $\|\mathbf{x} - T\mathbf{x}\|^2$ over centered data. For a data point $\mathbf{x}$ write $\mathbf{r} = \mathbf{x} - T\mathbf{x}$ for its reconstruction residual. At the optimum, which relation is forced?
choices:
- label: A
  text: $\langle \mathbf{r}, \mathbf{x}\rangle = 0$
- label: B
  text: $\langle \mathbf{r}, T\mathbf{x}\rangle = 0$
- label: C
  text: $\mathbf{r} \in \operatorname{im} T$
- label: D
  text: $\|\mathbf{r}\| = \|T\mathbf{x}\|$
- label: E
  text: $\mathbf{r} = \mathbf{0}$
figures: []
answer:
  correct: B
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    At the optimum the round trip is the orthogonal projection onto the span of the top $k$ principal components, so $T\mathbf{x}$ is the nearest point of $\operatorname{im} T$ to $\mathbf{x}$ and the residual is orthogonal to the image: $\mathbf{r} \in (\operatorname{im} T)^\perp$, the cokernel of $T$, and in particular $\langle\mathbf{r}, T\mathbf{x}\rangle = 0$. This is the least squares geometry of Chapter 6 with the image learned rather than given, and Pythagoras follows: $\|\mathbf{x}\|^2 = \|T\mathbf{x}\|^2 + \|\mathbf{r}\|^2$.
  key_insight: null
  distractor_rationale:
    A: |
      Trick: the residual is orthogonal to the reconstruction, not to the data. $\langle\mathbf{r},\mathbf{x}\rangle = \langle\mathbf{r}, T\mathbf{x} + \mathbf{r}\rangle = \|\mathbf{r}\|^2$, which vanishes only when the point is reconstructed exactly.
    C: |
      Distractor: if the residual lay in the image the reconstruction could be moved along the image to shrink it, so the optimum would not be an optimum. The residual lies in the orthogonal complement of the image.
    D: |
      Distractor: nothing forces the kept and discarded parts to have equal length; Pythagoras relates their squares to $\|\mathbf{x}\|^2$ and says nothing about their ratio.
    E: |
      Trick: perfect reconstruction of every point would need the data to lie in a $k$-dimensional subspace. The bottleneck is a chosen forgetting; the residual is what it forgets.
