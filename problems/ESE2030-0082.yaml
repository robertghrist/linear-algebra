statement: |
  Consider the $2 \times 2$ real Jordan block corresponding to complex eigenvalues $\alpha \pm i\beta$:
  $$A = \begin{bmatrix} \alpha & -\beta \\ \beta & \alpha \end{bmatrix} = \alpha I + \beta J = \begin{bmatrix} \alpha & 0 \\ 0 & \alpha \end{bmatrix} +
  \begin{bmatrix} 0 & -\beta \\ \beta & 0 \end{bmatrix}$$
  When computing $e^{At}$ one has:
  $$e^{At} = e^{\alpha t}\begin{bmatrix} \cos(\beta t) & -\sin(\beta t) \\ \sin(\beta t) & \cos(\beta t) \end{bmatrix}$$

  Why do the trigonometric functions $\cos(\beta t)$ and $\sin(\beta t)$ appear in this result?
choices:
- label: A
  text: Complex eigenvalues always produce oscillatory behavior, which is mathematically represented by
    trigonometric functions
- label: B
  text: The skew-symmetric part $\beta J$ satisfies $J^2 = -I$, causing the Taylor series to separate
    into even/odd terms that match the series for $\cos(\beta t)$ and $\sin(\beta t)$
- label: C
  text: The matrix $J$ represents a rotation, and rotations are always described by sines and cosines
- label: D
  text: Euler's formula $e^{i\beta t} = \cos(\beta t) + i\sin(\beta t)$ is directly applied to the matrix
    exponential
- label: E
  text: The determinant of $A$ equals $\alpha^2 + \beta^2$, which forces the exponential to have magnitude
    1, requiring unit circle parameterization via trigonometric functions
figures: []
answer:
  correct: B
  partial_credit:
  - D
