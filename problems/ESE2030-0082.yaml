  explanation: |
    The key is recognizing how powers of $N$ behave: $N^2 = -\beta^2 I$, $N^3 = -\beta^2 N$, $N^4 = \beta^4 I$, etc. When we expand $e^{Nt}$ as a Taylor series $I + Nt + \frac{(Nt)^2}{2!} + \frac{(Nt)^3}{3!} + \cdots$, the even powers give $I(1 - \frac{\beta^2t^2}{2!} + \frac{\beta^4t^4}{4!} - \cdots)$ which is exactly $\cos(\beta t) \cdot I$, and the odd powers give $N(t - \frac{\beta^2t^3}{3!} + \frac{\beta^4t^5}{5!} - \cdots) = \frac{1}{\beta}N \cdot \sin(\beta t)$. The appearance of sines and cosines comes from how their Taylor series naturally emerge when computing matrix powers, not from any abstract connection to complex numbers or rotations. The crucial property is $N^2 = -\beta^2 I$, which causes the alternating signs in the series expansion.
  key_insight: null
  distractor_rationale:
    A: |
      describes the phenomenon but doesn't explain the mechanism; this is "what" not "why"
    C: |
      confuses cause and effect - J represents rotation BECAUSE the exponential has this form, not vice versa
    D: |
      Euler's formula applies to scalar complex exponentials; the matrix case requires deriving the result from Taylor series
    E: |
      the determinant property is irrelevant to why trigonometric functions appear in the series expansion
