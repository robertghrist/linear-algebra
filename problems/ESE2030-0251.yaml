statement: |
  Let $A$ be an $m \times n$ matrix, let $\mathbf{b} \in \mathbb{R}^m$, and
  let $\hat{\mathbf{x}} = A^\dagger \mathbf{b}$, where $A^\dagger$ denotes
  the pseudoinverse.  Which of the following best characterizes
  $\hat{\mathbf{x}}$?
choices:
- label: A
  text: $\hat{\mathbf{x}} = (A^T A)^{-1} A^T \mathbf{b}$.
- label: B
  text: $\hat{\mathbf{x}}$ is the unique minimizer of $\norm{A\mathbf{x} - \mathbf{b}}$ in $\mathrm{im}(A)^\perp$.
- label: C
  text: $\hat{\mathbf{x}}$ is the unique vector in $\mathbb{R}^n$ satisfying $A\hat{\mathbf{x}} = \mathbf{b}$.
- label: D
  text: $\hat{\mathbf{x}}$ is the unique vector in $\mathbb{R}^n$ such that $A\hat{\mathbf{x}}$ is the
    orthogonal projection of $\mathbf{b}$ onto $\mathrm{im}(A)$.
- label: E
  text: $\hat{\mathbf{x}}$ is the unique minimizer of $\norm{A\mathbf{x} - \mathbf{b}}$ in $\ker(A)^\perp$.
figures: []
answer:
  correct: E
  partial_credit:
