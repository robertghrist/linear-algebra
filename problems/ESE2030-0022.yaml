  explanation: |
    Given: $T: \mathbb{R}^5 \to \mathbb{R}^6$ with $\dim(\ker(T)) = 2$ By Rank-Nullity: $\dim(\text{im}(T)) = 5 - 2 = 3$ The cokernel is $\text{coker}(T) = \mathbb{R}^6/\text{im}(T)$ Therefore: $\dim(\text{coker}(T)) = 6 - 3 = 3$ So coker$(T) \cong \mathbb{R}^3$.
  key_insight: |
    The cokernel measures "what's missing" from the image to fill the codomain.
