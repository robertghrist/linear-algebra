  explanation: |
    The Fundamental Theorem of Linear Algebra states that $\text{coim}(T) \cong \text{im}(T)$. Computing dimensions: by rank-nullity, $\dim(\text{im}(T)) = \dim(V) - \dim(\ker(T)) = 7 - 3 = 4$. The coimage is $V/\ker(T)$, so $\dim(\text{coim}(T)) = \dim(V) - \dim(\ker(T)) = 7 - 3 = 4$. Both have dimension 4, and the FTLA says they are isomorphic via the map induced by $T$: if $[\mathbf{v}] \in V/\ker(T)$, we map $[\mathbf{v}] \mapsto T(\mathbf{v})$, which is well-defined precisely because $\ker(T)$ is modded out.
  key_insight: null
  distractor_rationale:
    A: |
      kernel and cokernel both measure defects, but in different spaces: kernel is in the domain, cokernel is a quotient of the codomain. They have dimensions $\dim(\ker(T)) = 3$ and $\dim(\text{coker}(T)) = \dim(W) - \dim(\text{im}(T)) = 5 - 4 = 1$. Not isomorphic.
    C: |
      completely false; a linear transformation does not imply the domain and codomain are isomorphic. Here $\dim(V) = 7 \neq 5 = \dim(W)$.
    D: |
      rank-nullity says $\dim(\ker(T)) + \dim(\text{im}(T)) = \dim(V)$, but equal dimensions don't mean isomorphic in any natural way. Here $\dim(\ker(T)) = 3$ and $\dim(\text{im}(T)) = 4$, so they don't even have equal dimension!
    E: |
      (the cokernel has dimension $\dim(W) - \dim(\text{im}(T)) = 5 - 4 = 1$, not 3. The kernel and cokernel are generally NOT isomorphic.) %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%% %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
