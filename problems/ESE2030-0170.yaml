statement: |
  Let $T: V \to W$ be a linear transformation with $\dim(V) = 7$ and $\dim(W) = 5$. Suppose $\dim(\ker(T)) = 3$.

  According to the Fundamental Theorem of Linear Algebra, which statement is TRUE?
choices:
- label: A
  text: $\ker(T) \cong \text{coker}(T)$, since both measure ``what $T$ misses.''
- label: B
  text: $\text{coim}(T) \cong \text{im}(T)$, with $\dim(\text{coim}(T)) = \dim(\text{im}(T)) = 4$.
- label: C
  text: $V \cong W$, since every linear transformation induces an isomorphism between domain and codomain.
- label: D
  text: $\ker(T) \cong \text{im}(T)$, since the dimensions must add up to $\dim(V)$.
- label: E
  text: $\text{coker}(T)$ has dimension 3 because it is isomorphic to $\ker(T)$.
figures: []
answer:
  correct: B
  partial_credit: []
