  explanation: |
    A $3 \times 3$ symmetric matrix has the form: $$\begin{bmatrix} a & b & c \\ b & d & e \\ c & e & f \end{bmatrix}$$ Count the independent parameters: \begin{itemize} \item Diagonal: 3 parameters $(a, d, f)$ \item Upper triangle: 3 parameters $(b, c, e)$ \item Total: 6 dimensions \end{itemize} Formula: For $n \times n$ symmetric matrices, $\dim = \frac{n(n+1)}{2}$
