statement: |
  Let $A \in \mathbb{R}^{n \times n}$ and let $p(t) = c_k t^k + \cdots + c_1 t
  + c_0$ be a polynomial. Suppose $A\mathbf{v} = \lambda \mathbf{v}$ for a
  nonzero $\mathbf{v}$. Which of the following must be TRUE?
choices:
- label: A
  text: $p(A)$ has the same eigenvalues as $A$, since $p$ does not change the spectrum.
- label: B
  text: $p(A)\mathbf{v} = p(\lambda)\,\mathbf{v}$, but the eigenvalues of $p(A)$ are unrelated to those
    of $A$.
- label: C
  text: Eigenvalues of $p(A)$ are $p(\lambda_i)$ only when $A$ is diagonalizable.
- label: D
  text: $p(A)\mathbf{v} = \lambda\, p(\mathbf{v})$, since polynomials commute with linear maps.
- label: E
  text: $p(A)\mathbf{v} = p(\lambda)\,\mathbf{v}$, and the eigenvectors of $A$ are eigenvectors of $p(A)$.
figures: []
answer:
  correct: E
  partial_credit: []
