  explanation: |
    The differentiation operator $\mathcal{D}: \mathcal{P}_3 \to \mathcal{P}_2$ works as: $$\mathcal{D}(a_0 + a_1x + a_2x^2 + a_3x^3) = a_1 + 2a_2x + 3a_3x^2$$ \begin{itemize} \item The image is all of $\mathcal{P}_2$ (any quadratic can be obtained), so $\text{rank} = \dim(\mathcal{P}_2) = 3$ \item The kernel consists of constant polynomials (derivatives equal zero), so $\dim(\ker(\mathcal{D})) = 1$ \item Verify: $\dim(\mathcal{P}_3) = 4 = 3 + 1$ ✓ \end{itemize}
  key_insight: |
    The derivative of constants is zero, so the kernel is the space of constant polynomials.
