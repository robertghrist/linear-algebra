  conflict: null
  explanation: |
    A fundamental fact about Jordan form: the number of Jordan blocks for a given eigenvalue equals the \emph{geometric multiplicity} --- the dimension of the eigenspace. Each Jordan block begins with an eigenvector, so the number of independent eigenvectors is exactly the number of blocks. Here, $\dim(\ker(A - 3I)) = 2$, so there are exactly 2 Jordan blocks for $\lambda = 3$. Since $A$ is $4 \times 4$ and has only one eigenvalue, these two blocks must account for all 4 dimensions. The blocks could be $2 \times 2$ and $2 \times 2$, or $3 \times 3$ and $1 \times 1$ --- this cannot be determined without further information (specifically, $\dim(\ker(A - 3I)^2)$). But the \emph{number} of blocks is determined: it is $2$.
  key_insight: null
  distractor_rationale:
    D: |
      confuses ``one eigenvalue'' with ``one block.'' Having a single eigenvalue constrains all blocks to share that eigenvalue, but doesn't mean there's only one block. The number of blocks depends on the eigenspace dimension, not the number of distinct eigenvalues.
    B: |
      this would mean $A$ is diagonalizable --- four $1 \times 1$ blocks is the same as a diagonal matrix. But if the eigenspace is only $2$-dimensional while the algebraic multiplicity is $4$, the matrix is \emph{not} diagonalizable, so blocks of size $> 1$ must appear.
    E: |
      the block count \emph{is} determined by the eigenspace dimension alone --- it equals the geometric multiplicity. While it's true that generalized eigenspaces are needed to determine block \emph{sizes}, the question only asks about the number of blocks. A student selecting (E) fails to recognize what the geometric multiplicity directly tells us.
