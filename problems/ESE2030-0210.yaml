statement: |
  A $4 \times 4$ matrix $A$ has only one eigenvalue, $\lambda = 3$, with
  algebraic multiplicity $4$. The eigenspace $\ker(A - 3I)$ has dimension $2$.
  How many Jordan blocks appear in the Jordan form of $A$, and why?
choices:
- label: A
  text: 'Two blocks: specifically one $3 \times 3$ block and one $1 \times 1$ block, because the deficiency
    $4 - 2 = 2$ means the matrix $(A - 3I)$ is not nilpotent of order $1$, forcing the larger block to
    have size $3$'
- label: B
  text: Four $1 \times 1$ blocks, because the algebraic multiplicity is $4$
- label: C
  text: Two blocks, because the number of Jordan blocks for an eigenvalue equals the dimension of its
    eigenspace
- label: D
  text: One $4 \times 4$ block, because there is only one eigenvalue
- label: E
  text: Cannot be determined without knowing the dimensions of $\ker(A - 3I)^k$ for $k \geq 2$
figures: []
answer:
  correct: C
  partial_credit:
  - A
  verified: true
