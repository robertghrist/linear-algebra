statement: |
  The graph Laplacian $L = D - A$ for a network of 8 users has eigenvalues:
  $$\lambda_1 = 0, \quad \lambda_2 = 0, \quad \lambda_3 = 0, \quad \lambda_4 = 1, \quad \lambda_5 = 2, \quad \lambda_6 = 3, \quad \lambda_7 = 4, \quad \lambda_8 = 5$$
  What does this eigenvalue structure reveal about the network?
choices:
- label: A
  text: The network has five connected components
- label: B
  text: 'Error: this is not a valid graph Laplacian'
- label: C
  text: The network is connected
- label: D
  text: Three users are completely isolated with no connections to anyone
- label: E
  text: The network has three connected components
figures: []
answer:
  correct: E
  partial_credit: []
  verified: true
  verified_from:
  - quizzes-exams/2025-C/2030-FINAL-EXAM.tex
  conflict: null
  explanation: |
    A fundamental result in spectral graph theory states that the multiplicity of the zero eigenvalue for a graph Laplacian equals the number of connected components in the graph. Since $\lambda = 0$ appears with multiplicity 3, the network has exactly 3 separate groups of users with no connections between groups. Each connected component contributes one zero eigenvalue, with the corresponding eigenvector being constant on that component and zero elsewhere. This is not an error—disconnected networks naturally have multiple zero eigenvalues.
  key_insight: null
  distractor_rationale:
    A: |
      confuses the role of zero vs. nonzero eigenvalues; it's the multiplicity of zero that counts components
    B: |
      incorrect; multiple zero eigenvalues indicate disconnection, not error
    C: |
      the Laplacian being 8×8 just means 8 users exist; says nothing about connectivity
    D: |
      (confuses connected components with isolated nodes; three components doesn't mean three isolated users—each component could have multiple users) %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%% %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
