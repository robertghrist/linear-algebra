statement: |
  Let $U = \operatorname{span}\{(1, 1, 0)\}$ in $\mathbb{R}^3$. Which of the following planes through the origin is NOT a complement of $U$?
choices:
- label: A
  text: The plane $x = 0$
- label: B
  text: The plane $y = 0$
- label: C
  text: The plane $x + y + z = 0$
- label: D
  text: The plane $x = y$
- label: E
  text: The plane $z = x$
figures: []
answer:
  correct: D
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    A subspace $W$ is a complement of $U$ when $U \cap W = \{\mathbf{0}\}$ and $U + W = \mathbb{R}^3$; for a plane, the dimension count $1 + 2 = 3$ makes trivial intersection the whole condition. The vector $(1,1,0)$ satisfies $x = y$, so that plane contains $U$ and the intersection is all of $U$. The other four planes miss $(1,1,0)$ and are all complements, none canonical: a direct-sum decomposition $\mathbb{R}^3 = U \oplus W$ makes each of them a model for $\mathbb{R}^3/U$.
  key_insight: null
  distractor_rationale:
    A: |
      Distractor: $(1,1,0)$ has $x = 1 \neq 0$, so the plane misses $U$; it is a complement.
    B: |
      Distractor: $(1,1,0)$ has $y = 1 \neq 0$; a complement.
    C: |
      Trick: a student who thinks a complement must be perpendicular to $U$ may reject this plane because its normal $(1,1,1)$ is not parallel to $(1,1,0)$. But $1 + 1 + 0 = 2 \neq 0$, the plane misses $U$, and no inner product is needed for complements at all.
    E: |
      Distractor: $(1,1,0)$ has $z = 0 \neq 1 = x$; a complement.
