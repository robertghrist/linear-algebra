statement: |
  Let $T: V \to W$ be a linear transformation. Two vectors $\mathbf{u}, \mathbf{v} \in V$ represent the same equivalence class in the coimage
  $\text{coim}(T)$ if and only if:
choices:
- label: A
  text: $\mathbf{u} - \mathbf{v} \in \text{coim}(T)$
- label: B
  text: $T(\mathbf{u} - \mathbf{v}) \in \text{im}(T)$
- label: C
  text: $\mathbf{u} = \mathbf{v}$
- label: D
  text: $T(\mathbf{u}) = T(\mathbf{v})$
- label: E
  text: $T(\mathbf{u})-T(\mathbf{v}) \in \text{im}(T)$
figures: []
answer:
  correct: D
  partial_credit:
  - E
  verified: true
