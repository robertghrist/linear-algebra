  conflict: null
  explanation: |
    Two vectors $\mathbf{u}, \mathbf{v}$ are in the same equivalence class of $\text{coim}(T) = V/\ker(T)$ if and only if: $$\mathbf{u} - \mathbf{v} \in \ker(T)$$ This is equivalent to: $$T(\mathbf{u} - \mathbf{v}) = \mathbf{0}$$ $$T(\mathbf{u}) = T(\mathbf{v})$$ Option (E) states $T(\mathbf{u}) - T(\mathbf{v}) \in \text{im}(T)$, which is always true but doesn't characterize equivalence.
