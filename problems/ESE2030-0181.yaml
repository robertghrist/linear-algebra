  conflict: null
  explanation: |
    Each row operation on $A$ corresponds to left-multiplication by an elementary matrix. If we start with $A$ and apply Step 1, we get $E_1 A$. Then applying Step 2 gives $E_2(E_1 A) = E_2 E_1 A$. Finally, Step 3 gives $E_3(E_2 E_1 A) = E_3 E_2 E_1 A$. The key insight: the most recent operation becomes the leftmost factor. This is because matrix multiplication is applied ``from the inside out.''
  key_insight: null
  distractor_rationale:
    A: |
      writes the matrices in the order the operations were performed, left-to-right; this is the most common error and reflects misunderstanding of how composition works
    C: |
      right-multiplication performs column operations, not row operations; this confuses the two
    D: |
      combines both errors: right-multiplication AND reversed order
    E: |
      confuses the forward elimination process with the inverse; $(E_1 E_2 E_3)^{-1}$ would undo these operations, not perform them
