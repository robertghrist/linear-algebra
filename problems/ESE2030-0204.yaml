  explanation: |
    The solution operator $\mathbf{x}_0 \mapsto e^{At}\mathbf{x}_0$ is \emph{linear} in the initial condition, because matrix multiplication is linear. This means: $e^{At}(3\mathbf{a} - 2\mathbf{b}) = 3e^{At}\mathbf{a} - 2e^{At}\mathbf{b} = 3\mathbf{x}_1(t) - 2\mathbf{x}_2(t)$ No knowledge of $A$ is needed beyond the fact that the system is linear. This is the superposition principle for linear ODEs: any linear combination of solutions is again a solution, with the corresponding linear combination of initial conditions. Note that this works for \emph{any} matrix $A$ --- diagonalizable or not, real or complex eigenvalues, repeated eigenvalues or not. The linearity comes from the structure of matrix multiplication, not from any special property of $A$.
  key_insight: null
  distractor_rationale:
    E: |
      fails to recognize that linearity allows us to build new solutions from old ones; thinks every new initial condition requires recomputing from scratch
    D: |
      the superposition principle holds for all linear systems, not just diagonalizable ones. Linearity of the solution operator comes from linearity of matrix multiplication, which requires no assumptions about the eigenstructure of $A$. A student choosing this may conflate the techniques for \emph{computing} $e^{At}$ --- which do depend on eigenstructure --- with the structural fact that $e^{At}$ is linear.
    C: |
      invents a nonlinear interpolation scheme; the time-dependent coefficients $(3-2t)$ and $t$ would violate the ODE --- a linear combination of solutions with time-dependent coefficients is generally not a solution unless the coefficients are constant
    B: |
      see partial credit; formally correct but misses the simplification that makes the matrix exponential powerful in practice
