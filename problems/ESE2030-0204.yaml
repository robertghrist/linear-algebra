statement: |
  Consider the system $\dfrac{d\mathbf{x}}{dt} = A\mathbf{x}$ where $A$ is a
  $3 \times 3$ matrix. Suppose you know two solutions:
  \begin{itemize}
  \item $\mathbf{x}_1(t)$ is the solution with initial condition $\mathbf{x}_1(0) = \mathbf{a}$
  \item $\mathbf{x}_2(t)$ is the solution with initial condition $\mathbf{x}_2(0) = \mathbf{b}$
  \end{itemize}
  What is the solution $\mathbf{x}(t)$ with initial condition $\mathbf{x}(0) = 3\mathbf{a} - 2\mathbf{b}$?
choices:
- label: A
  text: $3\mathbf{x}_1(t) - 2\mathbf{x}_2(t)$
- label: B
  text: $e^{At}(3\mathbf{a} - 2\mathbf{b})$, but this cannot be simplified further without computing $e^{At}$
- label: C
  text: $(3-2t)\mathbf{x}_1(t) + t\,\mathbf{x}_2(t)$, by interpolation between the two known solutions
- label: D
  text: $3\mathbf{x}_1(t) - 2\mathbf{x}_2(t)$, but only if $A$ is diagonalizable
- label: E
  text: Cannot be determined without knowing $A$ explicitly
figures: []
answer:
  correct: A
