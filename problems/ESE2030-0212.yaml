statement: |
  Let $A$ be a $3 \times 3$ matrix with eigenvalues $\lambda_1 = 5$,
  $\lambda_2 = -2$, and $\lambda_3 = 5$ (note: $\lambda_1 = \lambda_3$).
  Let $\mathbf{v}_1$ be an eigenvector for $\lambda_1 = 5$ and $\mathbf{v}_2$
  an eigenvector for $\lambda_2 = -2$.
  Which of the following \textbf{must} be true?
choices:
- label: A
  text: $\mathbf{v}_1$ and $\mathbf{v}_2$ are orthogonal
- label: B
  text: $\mathbf{v}_1 + \mathbf{v}_2$ is an eigenvector of $A$ with eigenvalue $5 + (-2) = 3$
- label: C
  text: $\mathbf{v}_1$ and $\mathbf{v}_2$ are linearly independent
- label: D
  text: $A$ must be diagonalizable, since it has three eigenvalues counting multiplicity
- label: E
  text: Any nonzero scalar multiple $c\mathbf{v}_1$ is also an eigenvector of $A$, but with a eigenvalue
    $5c$
figures: []
answer:
  correct: C
  partial_credit: []
  verified: true
  verified_from:
  - quizzes-exams/2026-A/2030-Q3-SOLUTIONS.tex
