statement: |
  Let $A$ be an $n \times n$ matrix with real entries. Which of the following statements about $A$ is most true?
choices:
- label: A
  text: $A$ is diagonalizable if and only if every eigenvalue of $A$ is real.
- label: B
  text: If $A$ is diagonalizable, then $A$ has $n$ distinct eigenvalues, but the converse does not hold.
- label: C
  text: If $A$ has $n$ distinct real eigenvalues, then $A$ is diagonalizable, but the converse does not
    hold.
- label: D
  text: $A$ is diagonalizable if and only if $A$ has $n$ distinct real eigenvalues.
- label: E
  text: $A$ is diagonalizable if and only if $\det(A) \neq 0$.
figures: []
answer:
  correct: C
  partial_credit: []
