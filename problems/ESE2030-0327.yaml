statement: |
  In each pattern below, $\ast$ marks an entry that may be nonzero and $0$ an entry that is zero. For which coefficient matrix can $A\mathbf{x} = \mathbf{b}$ be solved as two independent $2\times 2$ systems, possibly after reordering the unknowns and the equations?
choices:
- label: A
  text: $\begin{bmatrix} \ast & 0 & \ast & 0 \\ 0 & \ast & 0 & \ast \\ \ast & 0 & \ast & 0 \\ 0 & \ast & 0 & \ast \end{bmatrix}$
- label: B
  text: $\begin{bmatrix} \ast & \ast & 0 & 0 \\ 0 & \ast & \ast & 0 \\ 0 & 0 & \ast & \ast \\ \ast & 0 & 0 & \ast \end{bmatrix}$
- label: C
  text: $\begin{bmatrix} \ast & \ast & \ast & \ast \\ 0 & \ast & \ast & \ast \\ 0 & 0 & \ast & \ast \\ 0 & 0 & 0 & \ast \end{bmatrix}$
- label: D
  text: $\begin{bmatrix} \ast & \ast & 0 & 0 \\ \ast & \ast & 0 & 0 \\ 0 & 0 & \ast & \ast \\ \ast & 0 & \ast & \ast \end{bmatrix}$
- label: E
  text: $\begin{bmatrix} \ast & \ast & \ast & \ast \\ \ast & \ast & \ast & \ast \\ 0 & 0 & \ast & \ast \\ 0 & 0 & \ast & \ast \end{bmatrix}$
