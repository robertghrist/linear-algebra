  conflict: null
  explanation: |
    Equations 1 and 3 involve only $x_1$ and $x_3$; equations 2 and 4 involve only $x_2$ and $x_4$. Reordering the unknowns as $(x_1, x_3, x_2, x_4)$ and the equations likewise makes the matrix block diagonal with two $2\times 2$ blocks, and the system decomposes into two independent subsystems. Block structure need not be visible in the given ordering; permutations of rows and columns reveal it.
  key_insight: null
  distractor_rationale:
    B: |
      Distractor: a cycle of couplings ($x_1$ to $x_2$ to $x_3$ to $x_4$ back to $x_1$); no reordering separates the unknowns into two groups that never meet.
    C: |
      Distractor: upper triangular. Back substitution solves it one unknown at a time, but each equation depends on the ones below it; nothing is independent.
    D: |
      Trick: nearly block diagonal, but the single entry coupling $x_1$ into the last equation ties the two halves together. One nonzero is enough to destroy decoupling.
    E: |
      Trick: block upper triangular. The lower block can be solved on its own, but the upper block then needs its answer; the two systems are sequential, not independent.
