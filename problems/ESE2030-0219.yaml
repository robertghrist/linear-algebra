statement: |
  Consider the coupled system $\dfrac{d\mathbf{x}}{dt} = A\mathbf{x}$ where
  $A$ is a $2 \times 2$ diagonalizable matrix with distinct real eigenvalues
  $\lambda_1 \neq \lambda_2$ and corresponding eigenvectors
  $\mathbf{v}_1, \mathbf{v}_2$.

  We solve this by writing $A = V\Lambda V^{-1}$ and substituting
  $\mathbf{x} = V\mathbf{y}$ to obtain the transformed system
  $\dfrac{d\mathbf{y}}{dt} = \Lambda\mathbf{y}$.
  What is the essential reason this change of variables helps?
choices:
- label: A
  text: It orthogonalizes the eigenvectors, which is necessary for the solution components to evolve independently
- label: B
  text: It makes the matrix $\Lambda$ invertible, which is required to compute the solution $\mathbf{x}(t)
    = e^{At}\mathbf{x}(0)$
- label: C
  text: It eliminates the eigenvalues, replacing them with simpler constants that are easier to exponentiate
- label: D
  text: Since $\Lambda$ is diagonal, the transformed system consists of independent scalar equations $dy_i/dt
    = \lambda_i y_i$, each of which can be solved separately
- label: E
  text: It converts the differential equation into an algebraic equation, removing the need to compute
    any exponentials
figures: []
