statement: |
  Let $A$ be a square singular matrix with real distinct eigenvalues.

  Which statement about the matrix exponential $e^A$ is most true?
choices:
- label: A
  text: $e^A$ may or may not be well-defined
- label: B
  text: $e^A$ may not be diagonalizable
- label: C
  text: $e^A$ is the solution to $d\mathbf{x}/dt=A\mathbf{x}$
- label: D
  text: $e^A$ is nonsingular
- label: E
  text: The series for $e^A$ terminates after finitely many terms
figures: []
answer:
  correct: D
