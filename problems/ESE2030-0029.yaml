  explanation: |
    Since $\mathbf{v} = 2\mathbf{b}_1 - \mathbf{b}_2 + 3\mathbf{b}_3$ and the new basis has $2\mathbf{b}_1$ as its first vector, we need coefficient 1 for the first basis vector: $\mathbf{v} = 1 \cdot (2\mathbf{b}_1) - 1 \cdot \mathbf{b}_2 + 3 \cdot \mathbf{b}_3$. Thus $[\mathbf{v}]_C = \begin{pmatrix} 1 \\ -1 \\ 3 \end{pmatrix}$.
