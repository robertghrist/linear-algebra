statement: |
  Suppose a square matrix $A$ has been factored as $A = LU$. Which statement best describes the principal practical advantage of having this factorization in hand?
choices:
- label: A
  text: $A = LU$ removes the need for row pivoting.
- label: B
  text: $A = LU$ provides $A^{-1}$ directly as $U^{-1}L^{-1}$.
- label: C
  text: Solving $A\mathbf{x} = \mathbf{b}$ via $A = LU$ costs fewer arithmetic operations than Gaussian
    elimination on the augmented matrix $[\,A \mid \mathbf{b}\,]$.
- label: D
  text: Once $A = LU$ is computed, additional systems $A\mathbf{x} = \mathbf{b}$ are solved by forward
    substitution followed by back substitution.
- label: E
  text: The diagonal of $U$ reveals whether $A$ is invertible.
figures: []
answer:
  correct: D
  partial_credit: []
  verified: true
  verified_from:
  - quizzes-exams/2026-A/2030-FINAL-EXAM.tex
