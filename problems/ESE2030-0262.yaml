  conflict: null
  explanation: |
    The signature use of an LU factorization is to amortize the cost of factoring across many right-hand sides. The factorization itself costs $O(n^3)$, the same as a single Gaussian elimination. The payoff arrives when one wants to solve $A\mathbf{x} = \mathbf{b}_1, A\mathbf{x} = \mathbf{b}_2, \ldots$: each subsequent solve is just \textbf{$L\mathbf{y} = \mathbf{b}$ followed by $U\mathbf{x} = \mathbf{y}$}, two triangular systems at $O(n^2)$ each. This is the structural insight behind LU --- triangular systems are easy, so split the hard work of factoring from the easy work of solving.
  key_insight: null
  distractor_rationale:
    C: |
      captures the intuition that LU saves work, but misattributes the source: a single solve via LU is the \emph{same} cost as a single Gaussian elimination; the savings come only when the factorization is re-used across multiple right-hand sides.
    E: |
      true consequence --- since $L$ has unit diagonal, $\det(A) = \det(U) = \prod u_{ii}$, so $A$ is invertible iff $U$ has all nonzero diagonal entries --- but this is a diagnostic byproduct, not the reason one computes the factorization.
    B: |
      technically correct identity $A^{-1} = U^{-1}L^{-1}$, but in practice one never \emph{forms} $A^{-1}$; one solves with triangular substitutions. The whole point of LU is to avoid computing inverses.
    A: |
      the opposite is true --- pivoting is precisely why the more general $PA = LU$ form exists. LU does not eliminate the need for pivoting; it accommodates it.
