statement: |
  The figure shows the singular values of a centered data matrix $\mathcal{X} \in \mathbb{R}^{1000 \times 100}$ in decreasing order. The shaded band is the interval into which the singular values of a pure-noise matrix of the same shape and noise level would fall. How many principal components does the plot support?
choices:
- label: A
  text: '1'
- label: B
  text: '2'
- label: C
  text: '3'
- label: D
  text: Every component whose singular value exceeds the median
- label: E
  text: 0 --- the band does not reach down to zero, so nothing is distinguishable from noise
figures:
- ESE2030-0309-a.png
answer:
  correct: B
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    Noise alone fills the band; a component is evidence of structure only if its singular value stands clear of the band's upper edge. Two do. The third-largest singular value sits inside the band, where a singular value is not evidence but arithmetic: it is the largest of the noise, not the smallest of the signal. That the band sits at height $\approx\sqrt{n}$ rather than at zero is the point --- the noise floor is not zero.
  key_insight: null
  distractor_rationale:
    A: |
      Trick: reading the scree plot by eye for the one dramatic drop, ignoring the second value that also clears the edge.
    C: |
      Trick: counting the largest in-band value as signal because it is 'bigger than the rest' --- the listed trap of reading a large eigenvalue as signal without a noise floor.
    D: |
      Distractor: the median has no significance; the standard is the noise edge.
    E: |
      Trick: expects the noise floor at zero; it stands at $\approx\sqrt{n}$ and rises with $n$.
