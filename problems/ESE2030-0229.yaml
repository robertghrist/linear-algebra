statement: |
  Both PCA and neural networks can extract features from high-dimensional data. PCA reduces
  $X \in \mathbb{R}^{n \times d}$ to $k$-dimensional coordinates via
  $\mathbf{y}_{\text{PCA}} = V_k^T \mathbf{x}$, where $V_k$ contains the top $k$ right singular
  vectors of $X$. A neural network with a hidden layer of $k$ units produces an alternative
  feature vector $\mathbf{y}_{\text{NN}} = \sigma(W_1 \mathbf{x} + \mathbf{b}_1)$, where
  $\sigma$ is a nonlinear activation and $W_1, \mathbf{b}_1$ are learned during training.

  Two researchers are given the same dataset $X$. The first computes $V_k$ via PCA. The second
  trains a neural network and extracts $W_1, \mathbf{b}_1$. Which statement best describes how
  their resulting feature maps compare?
choices:
- label: A
  text: The neural network's feature map can always be written as $\sigma(V_k^T \mathbf{x} + \mathbf{b}_1)$
    for some bias $\mathbf{b}_1$, so the two approaches differ only in the activation function.
- label: B
  text: The neural network's feature map is a nonlinear function of $\mathbf{x}$, so it cannot in general
    be written as a linear projection $V_k^T \mathbf{x}$; this is the only structural difference between
    the two approaches.
- label: C
  text: The PCA feature map is determined by $X$ alone, whereas the neural network's feature map depends
    on the training objective; the two researchers can obtain genuinely different features from the same
    $X$.
- label: D
  text: The PCA feature map is optimal for reconstructing $X$, so any neural network feature map trained
    on $X$ will reconstruct $X$ at most as well as PCA does.
- label: E
  text: Both feature maps are determined entirely by $X$, so the two researchers will obtain features
    that span the same $k$-dimensional subspace of input space.
figures: []
answer:
  correct: C
  partial_credit:
  - B
  verified: true
  verified_from:
  - quizzes-exams/2026-A/2030-Q4-SOLUTIONS.tex
