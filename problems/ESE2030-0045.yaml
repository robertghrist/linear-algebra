  explanation: |
    Given $\mathbf{d}_3 = \mathbf{d}_1 + \mathbf{d}_2$ with $\theta_{1,2} = 30°$: By the parallelogram law, $\mathbf{d}_3$ lies in the interior of the angle between $\mathbf{d}_1$ and $\mathbf{d}_2$ (when viewed from origin). Both angles $\theta_{1,3}$ and $\theta_{2,3}$ must be: \begin{itemize} \item Strictly less than $30°$ (the original angle) \item Strictly greater than $0°$ (vectors point in same general direction) \item Equal to $15°$ only if $\|\mathbf{d}_1\| = \|\mathbf{d}_2\|$ \end{itemize}
  key_insight: |
    Vector addition creates a "weighted average" direction between the two vectors.
