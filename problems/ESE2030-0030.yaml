statement: |
  Which of the following properties is not necessarily preserved under similarity? (Recall, square matrices $A$ and $B$ are similar if $B = P^{-1}AP$ for some $P$).
choices:
- label: A
  text: The rank of the matrix
- label: B
  text: The dimension of the kernel
- label: C
  text: The determinant
- label: D
  text: The column space
- label: E
  text: All of the above are preserved
