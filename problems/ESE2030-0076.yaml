  conflict: null
  explanation: |
    Since the eigenvectors form an orthonormal basis, we have $A\mathbf{x} = A(c_1\mathbf{q}_1 + \cdots + c_n\mathbf{q}_n) = c_1\lambda_1\mathbf{q}_1 + \cdots + c_n\lambda_n\mathbf{q}_n$. Because the eigenvectors are orthonormal (a key consequence of the Spectral Theorem), we can compute: $\|A\mathbf{x}\|^2 = (c_1\lambda_1)^2 + \cdots + (c_n\lambda_n)^2 = \lambda_1^2 c_1^2 + \cdots + \lambda_n^2 c_n^2$. This shows how A stretches each eigenspace component independently by the corresponding eigenvalue. The orthonormality is crucial - without it, cross terms would appear.
  key_insight: null
  distractor_rationale:
    B: |
      incorrectly squares the entire sum; would only work if all vectors were parallel
    C: |
      only uses maximum eigenvalue; misses that different components scale differently
    D: |
      forgets to apply A at all; this is just $\|\mathbf{x}\|^2$
    E: |
      uses wrong norm and treats components linearly rather than quadratically
