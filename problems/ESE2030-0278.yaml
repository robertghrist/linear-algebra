statement: |
  Let $\{\mathbf{v}_1, \mathbf{v}_2, \ldots, \mathbf{v}_n\}$ be a linearly
  independent set in an inner product space $V$, and let $\{\mathbf{u}_1,
  \mathbf{u}_2, \ldots, \mathbf{u}_n\}$ be the orthogonal set produced by
  applying the Gram-Schmidt process (in that order).  Which of the
  following must be true for every $k$ with $1 \leq k \leq n$?
choices:
- label: A
  text: $\mathbf{u}_k = \mathbf{v}_k$
- label: B
  text: $\norm{\mathbf{u}_k} = \norm{\mathbf{v}_k}$
- label: C
  text: $\mathrm{span}\{\mathbf{u}_1, \ldots, \mathbf{u}_k\} = \mathrm{span}\{\mathbf{v}_1, \ldots, \mathbf{v}_k\}$
- label: D
  text: $\mathbf{u}_k$ is a positive scalar multiple of $\mathbf{v}_k$
- label: E
  text: $\mathbf{u}_k \perp \mathbf{v}_k$
