  explanation: |
    Three SVD-to-PCA conversions are tested simultaneously. (E) PC VARIANCES. Projecting $\mathbf{x}_i$ onto $\mathbf{v}_1$ gives the scalar $\mathbf{x}_i^T\mathbf{v}_1$. The sample variance of these $100$ scalars is the first eigenvalue of the covariance matrix $C = X^TX/n$: $$\lambda_1(B) = \lambda_1(X^TX)/n = 900/100 = 9. \quad \text{CORRECT.}$$ (D) ELLIPSOID SEMI-AXES. The image of the unit sphere under $X$ is an ellipsoid whose semi-axis lengths are the SINGULAR VALUES of $X$, not the eigenvalues of $X^TX$: $$\sigma_i = \sqrt{\lambda_i(X^TX)} \;\Rightarrow\; \sigma = 30,\, 20,\, 10. \quad \text{INCORRECT.}$$ Also, the ellipsoid lives in $\mathrm{im}(X) \subset \mathbb{R}^{100}$ as a 3-dimensional object, not as a $\mathbb{R}^{100}$-shaped object. (B) RESIDUAL VARIANCE. The total squared distance from the points to the 2D subspace $\mathrm{span}\{\mathbf{v}_1, \mathbf{v}_2\}$ equals the variance NOT captured by the first two PCs --- i.e., the third eigenvalue of $X^TX$: $$\sum_{i=1}^{100} \mathrm{dist}(\mathbf{x}_i,\, \mathrm{span}\{\mathbf{v}_1,\mathbf{v}_2\})^2 \;=\; \lambda_3(X^TX) \;=\; 100. \quad \text{CORRECT.}$$ (Equivalently: $\|X\|_F^2 = \sum_i \lambda_i(X^TX) = 1400$, the rank-2 truncation captures $\sigma_1^2 + \sigma_2^2 = 1300$, and the Pythagorean identity gives residual $1400 - 1300 = 100$.) So (E) and (B) are correct, (D) is wrong, and the answer is (C).
  key_insight: null
  distractor_rationale:
    B: |
      uses eigenvalues of $X^TX$ as semi-axis lengths; the semi-axes are the singular values $\sqrt{900}, \sqrt{400}, \sqrt{100} = 30, 20, 10$. This is the most common SVD↔PCA confusion: forgetting the square-root step.
    D: |
      combines a correct statement (E) with the trick (D); a student picking (A) understands PC variances but conflates the eigenvalues of $X^TX$ with geometric semi-axis lengths.
