statement: |
  A centered data matrix $X \in \mathbb{R}^{100 \times 3}$ has $X^TX$ with eigenvalues
  $900$, $400$, and $100$. The data points $\{\mathbf{x}_1, \ldots, \mathbf{x}_{100}\}$ are
  the rows of $X$, and $\mathbf{v}_1, \mathbf{v}_2, \mathbf{v}_3$ are the corresponding
  principal component directions.
  Which of the following is correct?
choices:
- label: A
  text: Projecting all $100$ data points onto the first principal component direction yields scalars whose
    sample variance is $9$.
- label: B
  text: The image of the unit sphere in $\mathbb{R}^3$ under $X$ is an ellipsoid in $\mathbb{R}^{100}$
    with semi-axis lengths $900$, $400$, and $100$.
- label: C
  text: The total squared distance from the data points to the 2D subspace spanned by $\mathbf{v}_1$ and
    $\mathbf{v}_2$ equals $100$.
- label: D
  text: Statements (A) and (B) are both correct.
- label: E
  text: Statements (A) and (C) are both correct.
figures: []
answer:
  correct: E
  partial_credit:
