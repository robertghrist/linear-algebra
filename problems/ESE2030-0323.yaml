statement: |
  The attention scores between tokens are the pairwise values of the pairing $(\mathbf{u}, \mathbf{v}) \mapsto \mathbf{u}^T M \mathbf{v}$ on embedding space, with $M = W_K^T W_Q \in \mathbb{R}^{d\times d}$ assembled from the learned key and query matrices. Measured against the requirements for an inner product on $\mathbb{R}^d$, which of them can this pairing fail?
choices:
- label: A
  text: Symmetry only
- label: B
  text: Positive definiteness only
- label: C
  text: Bilinearity only
- label: D
  text: None; it is an inner product for every choice of $W_Q$ and $W_K$
- label: E
  text: Symmetry and positive definiteness, but not bilinearity
figures: []
answer:
  correct: E
  partial_credit:
  - A
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    The pairing $\mathbf{u}^T M \mathbf{v}$ is bilinear for any matrix $M$. Symmetry requires $M = M^T$, and $W_K^T W_Q$ is generically not symmetric because the two factors are different learned matrices; this is the point, since a symmetric form would force every pair of tokens to heed one another equally, and language is a web of directed dependencies. Positive definiteness fails as well: $M$ is not of the form $W^TW$, nothing forbids $\mathbf{x}^T M \mathbf{x} < 0$, and with $d_k < d$ the form is rank-deficient, so definiteness was never available. Attention learns a bilinear form, not an inner product.
  key_insight: null
  distractor_rationale:
    A: |
      Partial credit: sees the asymmetry but takes $W_K^T W_Q$ for a Gram matrix. Insight 1 of 2: $M \neq M^T$ because keys and queries play different roles. Missing: a product of two different matrices is not $W^TW$, so definiteness fails too (and rank at most $d_k$ rules it out regardless). Prefix: yes. Guessable: no. Defensible: yes.
    B: |
      Distractor: assumes the scores are symmetric --- the listed trap of treating attention weights as symmetric. $\langle\mathbf{q}_i,\mathbf{k}_j\rangle$ and $\langle\mathbf{q}_j,\mathbf{k}_i\rangle$ are different numbers.
    C: |
      Distractor: bilinearity is the one axiom that survives; $\mathbf{u}^T M \mathbf{v}$ is linear in each argument for any $M$ whatever.
    D: |
      Trick: the notation $\langle\cdot,\cdot\rangle_M$ flatters. The Chapter 5 axioms demand symmetry and positive definiteness, and a learned $M$ delivers neither.
