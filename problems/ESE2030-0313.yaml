  conflict: null
  explanation: |
    Read the widths off the figure: $3 \to 4 \to 2 \to 2$, so $\Lambda = 3$ layers. $W_1 \in \mathbb{R}^{4\times 3}$ carries $12$ weights and $\mathbf{b}_1 \in \mathbb{R}^4$ four biases; $W_2 \in \mathbb{R}^{2\times 4}$ and $\mathbf{b}_2$ give $8 + 2$; the linear read-out $W_3 \in \mathbb{R}^{2\times 2}$ and $\mathbf{b}_3$ give $4 + 2$. Total $16 + 10 + 6 = 32$. Nearly all of it sits in the matrices: $24$ of the $32$.
  key_insight: null
  distractor_rationale:
    A: |
      Distractor: weights only ($12 + 8 + 4$); the biases are parameters too.
    B: |
      Trick: drops $\mathbf{b}_3$ on the grounds that the read-out is 'linear'. The read-out has no activation; it still has a bias (the last line of (13.2)).
    D: |
      Distractor: adds a bias to each of the three input units. The input is data, not a layer of units with parameters.
    E: |
      Distractor: counts units ($3 + 4 + 2 + 2$) rather than parameters.
