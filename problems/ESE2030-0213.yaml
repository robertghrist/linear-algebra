statement: |
  A $3 \times 3$ matrix $A$ has eigenvalues $\lambda_1 = 3$, $\lambda_2 = 3$, and $\lambda_3 = -1$.
  {\bf Fact:} $A$ is diagonalizable.
  What does diagonalizability of $A$ tell us that the eigenvalues alone do not?
choices:
- label: A
  text: That $\operatorname{tr}(A) = 5$
- label: B
  text: That $A$ is symmetric, since only symmetric matrices can have repeated eigenvalues and still be
    diagonalizable
- label: C
  text: That there exists a basis of $\mathbb{R}^3$ consisting entirely of eigenvectors of $A$
- label: D
  text: That $\det(A) = -9$
- label: E
  text: That $A$ is invertible, since $e^A$ must be well-defined and nonsingular
figures: []
answer:
  correct: C
  partial_credit: []
