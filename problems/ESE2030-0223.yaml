statement: |
  The QR algorithm computes $A_{k+1} = R_k Q_k$ from the QR factorization
  $A_k = Q_k R_k$.
  A key property is that every iterate $A_{k+1}$ has the same eigenvalues
  as $A_k$.
  Why is this true?
choices:
- label: A
  text: Because $Q_k$ is orthogonal, and orthogonal transformations preserve all matrix properties including
    eigenvalues
- label: B
  text: 'Because the QR factorization itself preserves eigenvalues: $Q_k$ and $R_k$ each have the same
    eigenvalues as $A_k$'
- label: C
  text: Because $A_{k+1} = Q_k^{-1} A_k Q_k$, which is a similarity transformation
- label: D
  text: Because the diagonal entries of $R_k$ are the eigenvalues of $A_k$, and these entries are reused
    to construct $A_{k+1}$
- label: E
  text: Because $R_k Q_k$ and $Q_k R_k$ are transposes of each other, and a matrix and its transpose share
    eigenvalues
figures: []
answer:
  correct: C
  partial_credit: []
  verified: true
  verified_from:
