statement: |
  A matrix $A \in \mathbb{R}^{7\times 4}$ has rank $3$. What is $\dim \ker(A^T)$?
choices:
- label: A
  text: '4'
- label: B
  text: '1'
- label: C
  text: '3'
- label: D
  text: '7'
- label: E
  text: It cannot be determined from the rank of $A$ alone
figures: []
answer:
  correct: A
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    $A^T$ is $4\times 7$, a map out of $\mathbb{R}^7$, so Rank--Nullity for $A^T$ reads $\operatorname{rank}(A^T) + \dim\ker(A^T) = 7$. The step that needs a theorem is $\operatorname{rank}(A^T) = \operatorname{rank}(A) = 3$: the Fundamental Theorem identifies the coimage of $A$ with its image, and the coimage has the dimension of the row space, which is the image of $A^T$. Hence $\dim\ker(A^T) = 7 - 3 = 4$. This is the cokernel of $A$, and its dimension is the number of independent constraints a right-hand side must satisfy to be reachable.
  key_insight: null
  distractor_rationale:
    B: |
      Distractor: $4 - 3 = 1$ is the nullity of $A$, computed with the domain of $A$; the question asks about $A^T$, whose domain is $\mathbb{R}^7$.
    C: |
      Distractor: the rank itself, which is the dimension of the image of $A^T$, not of its kernel.
    D: |
      Distractor: the number of rows; forgets to subtract the rank.
    E: |
      Trick: the listed trap taken the other way. That $\operatorname{rank}(A^T) = \operatorname{rank}(A)$ is not obvious, but it is a theorem, and once it is in hand the count is determined.
