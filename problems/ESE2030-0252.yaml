statement: |
  A matrix $A \in \mathbb{R}^{m \times n}$ has SVD $A = U\Sigma V^T$. Which statement most fundamentally distinguishes a right singular vector $\mathbf{v}_i$ from a left singular vector $\mathbf{u}_i$?
choices:
- label: A
  text: $\mathbf{v}_i \in \mathbb{R}^n$ lives in the domain of $A$, while $\mathbf{u}_i \in \mathbb{R}^m$
    lives in the codomain, and they are linked by $A\mathbf{v}_i = \sigma_i \mathbf{u}_i$.
- label: B
  text: $\mathbf{v}_i$ is an eigenvector of $A^TA$, while $\mathbf{u}_i$ is an eigenvector of $AA^T$.
- label: C
  text: $\mathbf{v}_i$ is mapped to $\sigma_i \mathbf{u}_i$ by $A$, while $\mathbf{u}_i$ is mapped to
    $\sigma_i \mathbf{v}_i$ by $A$.
- label: D
  text: $\mathbf{v}_i$ identifies a principal input direction that gets stretched by $A$, while $\mathbf{u}_i$
    identifies the corresponding output semi-axis of the image ellipsoid.
- label: E
  text: $\mathbf{v}_i$ is the column of $V$, while $\mathbf{u}_i$ is the column of $U$.
figures: []
answer:
  correct: A
  partial_credit:
  - D
  verified: true
  verified_from:
