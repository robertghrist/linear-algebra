statement: |
  Let $T: V \to W$ be a linear transformation between inner product spaces (not necessarily injective or surjective). Given $\mathbf{b} \in W$, which description of $T^\dagger \mathbf{b}$ is correct?
choices:
- label: A
  text: Project $\mathbf{b}$ onto $(\operatorname{im} T)^\perp$, then apply $T^{-1}$ to the result.
- label: B
  text: Project $\mathbf{b}$ onto $\operatorname{im}(T)$; then map the projection back to the unique preimage
    in $(\ker T)^\perp$ via the invertible restriction $T\big|_{(\ker T)^\perp}$.
- label: C
  text: Apply the adjoint $T^*$ to $\mathbf{b}$; the adjoint always inverts $T$ on $\operatorname{im}(T)$.
- label: D
  text: Project $\mathbf{b}$ onto $\ker(T^*)$, then solve $T\mathbf{x} = \mathbf{b}$ in that subspace.
- label: E
  text: Find any solution to $T\mathbf{x} = \mathbf{b}$, then project $\mathbf{x}$ onto $\ker(T)$.
figures: []
answer:
  correct: B
  partial_credit: []
