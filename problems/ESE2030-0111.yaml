statement: |
  Consider two analysts working with the same centered data matrix $X \in \mathbb{R}^{100 \times 6}$ that has singular values $\sigma_1 = 20, \sigma_2 = 15, \sigma_3 = 8, \sigma_4 = 5, \sigma_5 = 2, \sigma_6 = 1$.

  \textbf{Analyst A} performs PCA directly on $X$.

  \textbf{Analyst B} first applies an orthogonal transformation $Q \in \mathbb{R}^{6 \times 6}$ to get $Y = XQ$, then performs PCA on $Y$.

  How do their results compare?
choices:
- label: A
  text: 'Analyst B''s principal components are related to Analyst A''s by the transformation: $\mathbf{w}_k
    = Q^T\mathbf{v}_k$, where $\mathbf{v}_k$ are A''s principal components.'
- label: B
  text: 'Both analysts obtain identical singular values: $\{20, 15, 8, 5, 2, 1\}$, but their principal
    component directions differ.'
- label: C
  text: Analyst A's results are superior because applying $Q$ distorts the covariance structure of the
    data.
- label: D
  text: The analyses are equivalent only if $Q$ is a rotation (determinant +1), but not if $Q$ includes
    reflections (determinant -1).
- label: E
  text: Both analyses capture the same total variance and the same variance proportions, but the ordering
    of principal components may differ.
figures: []
