  explanation: |
    The coimage is defined as $\text{coim}(T) = V/\ker(T)$. Using the Rank-Nullity Theorem: \begin{itemize} \item $\dim(V) = \text{rank}(T) + \dim(\ker(T))$ \item $9 = 3 + \dim(\ker(T))$ \item Therefore: $\dim(\ker(T)) = 6$ \end{itemize} The dimension of the coimage: $$\dim(\text{coim}(T)) = \dim(V) - \dim(\ker(T)) = 9 - 6 = 3$$
  key_insight: |
    The coimage "mods out" the kernel, so its dimension equals the rank.
