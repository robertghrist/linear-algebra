statement: |
  Let $A$ have singular values $\sigma_1 \geq \sigma_2 \geq \cdots$ and eigenvalues $\lambda_i$ (if square). The nuclear norm $\|A\|_*$ equals which of the following?
choices:
- label: A
  text: $\displaystyle\sum_i \sigma_i$
- label: B
  text: $\sigma_1$
- label: C
  text: $\displaystyle\sqrt{\sum_i \sigma_i^2}$
- label: D
  text: The number of nonzero $\sigma_i$
- label: E
  text: $\displaystyle\sum_i \lambda_i$
figures: []
answer:
  correct: A
  partial_credit: []
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    The nuclear norm is the sum of the singular values. It stands in for rank because rank is the number of nonzero singular values, a count that jumps and cannot be minimized by any smooth or convex method, whereas the sum is a norm, convex, and minimizing it favors matrices with many singular values exactly zero. Eckart--Young--Mirsky's optimality extends to it, and matrix completion and robust PCA are built on it.
  key_insight: null
  distractor_rationale:
    B: |
      Distractor: the spectral (operator) norm, the largest singular value alone.
    C: |
      Distractor: the Frobenius norm, the root of the sum of squares.
    D: |
      Trick: that is the rank itself, the quantity the nuclear norm replaces because it is a count and not a norm.
    E: |
      Distractor: the trace. It agrees with the nuclear norm only for symmetric positive semidefinite matrices, where singular values and eigenvalues coincide.
