  explanation: |
    The dominant eigenvalue is the one with largest magnitude (absolute value). Computing magnitudes: $|\lambda_1| = 3$, $|\lambda_2| = |-4| = 4$, $|\lambda_3| = 0$, $|\lambda_4| = |1+2i| = \sqrt{1^2 + 2^2} = \sqrt{5} \approx 2.24$. Since $|\lambda_2| = 4$ is largest, $\lambda_2 = -4$ is the dominant eigenvalue. The sign is irrelevant for dominance—only magnitude matters. The dominant eigenvalue determines the asymptotic rate at which powers $B^k$ grow or decay: here $\|B^k\| \approx 4^k$ for large $k$.
