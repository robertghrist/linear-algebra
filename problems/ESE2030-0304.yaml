statement: |
  A matrix $P \in \mathbb{R}^{N \times N}$ maps every density to a density: $P\rho \in \Delta^{N-1}$ whenever $\rho \in \Delta^{N-1}$. Which condition on $P$ is \emph{equivalent} to this?
choices:
- label: A
  text: $P \geq 0$ entrywise and $P^T\mathbf{1} = \mathbf{1}$
- label: B
  text: $P \geq 0$ entrywise and $P\mathbf{1} = \mathbf{1}$
- label: C
  text: $P^T\mathbf{1} = \mathbf{1}$
- label: D
  text: $\rho(P) = 1$
- label: E
  text: $P$ is orthogonal
figures: []
answer:
  correct: A
  partial_credit:
  - C
  verified: true
  verified_from:
  - prof-g review 2026-09-10
  conflict: null
  explanation: |
    The vertices $\mathbf{e}_j$ must go to densities, and $P\mathbf{e}_j$ is the $j$th column, so each column is nonnegative with unit sum: $P$ is column-stochastic. Conversely nonnegativity keeps $P\rho \geq 0$, and $P^T\mathbf{1} = \mathbf{1}$ gives $\langle P\rho, \mathbf{1}\rangle = \langle \rho, P^T\mathbf{1}\rangle = 1$ by the adjoint identity. This is Definition 9.13's column-stochastic convention: the Markov chains of Chapter 9 are dynamics confined to the simplex.
  key_insight: null
  distractor_rationale:
    B: |
      Trick: row-stochastic --- the other convention; $P\mathbf{1} = \mathbf{1}$ conserves mass for ROW vectors, not for the densities $P\rho$ (Week 9 trap).
    C: |
      Partial credit: mass conservation without nonnegativity --- a column summing to one can still send a density to a vector with a negative entry. Insight 1 of 2 (unit column sums via the adjoint); missing: nonnegativity. Prefix: yes. Guessable: no. Defensible: yes.
    D: |
      Distractor: a consequence of column-stochasticity (Lemma 9.15), not equivalent to it.
    E: |
      Distractor: orthogonal matrices preserve length, not mass; a rotation carries a density out of the orthant.
