  conflict: null
  explanation: |
    Since $\mathcal{B}$ is orthonormal, the coordinates of $\mathbf{v}$ are the inner products: $[\mathbf{v}]_\mathcal{B} = (4, -1, 3)^T$. By Parseval's identity, $\|\mathbf{v}\|^2 = 4^2 + (-1)^2 + 3^2 = 16 + 1 + 9 = 26$.
  key_insight: null
  distractor_rationale:
    B: |
      computes $4^2 = 16$ and stops, or squares only the largest coordinate
    C: |
      adds coordinates: $4 + (-1) + 3 = 6$; confuses norm squared with the sum of coordinates
    D: |
      computes $(4 + (-1) + 3)^2 = 36$; squares the sum instead of summing the squares
    E: |
      does not realize that orthonormality makes the inner products the coordinates, and that Parseval's identity gives the norm directly; a student who thinks explicit vectors are needed has missed the key advantage of orthonormal bases
