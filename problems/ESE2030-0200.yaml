  conflict: null
  explanation: |
    Gram--Schmidt applied to $\mathbf{v}_1, \ldots, \mathbf{v}_k$ produces orthonormal vectors $\mathbf{q}_1, \ldots, \mathbf{q}_k$ satisfying $\operatorname{span}\{\mathbf{q}_1, \ldots, \mathbf{q}_j\} = \operatorname{span}\{\mathbf{v}_1, \ldots, \mathbf{v}_j\}$ for each $j$. In particular the overall spans agree. This works for any linearly independent set --- no extension to a full basis is needed, and the vectors need not already be orthogonal.
  key_insight: null
  distractor_rationale:
    B: |
      rescaling each $\mathbf{v}_i$ by a positive scalar preserves its direction, so $\alpha_i\mathbf{v}_i \parallel \mathbf{v}_i$. Normalization makes each vector unit length but cannot change angles between vectors. Since the $\mathbf{v}_i$ are explicitly not pairwise orthogonal, no rescaling can make them orthonormal. This catches the ``Gram--Schmidt is just normalization'' misconception.
    C: |
      conflates the basis extension theorem with orthonormal extension. Since the $\mathbf{v}_i$ are not pairwise orthogonal, at least two satisfy $\langle \mathbf{v}_i, \mathbf{v}_j \rangle \neq 0$, so they cannot both belong to any orthonormal set. The student remembers ``independent vectors extend to a basis'' but forgets that orthonormal extension requires modifying the originals.
    D: |
      a student who thinks of Gram--Schmidt as purely a ``basis $\to$ orthonormal basis'' machine believes you must first have $n$ vectors. In fact, Gram--Schmidt works on any linearly independent set of size $k \leq n$; it orthonormalizes a subspace, not just the full space.
