statement: |
  Let $V$ be an $n$-dimensional inner product space, and let $S = \{\mathbf{v}_1, \ldots, \mathbf{v}_k\}$ be a linearly independent set in $V$ with $1 < k < n$. The vectors in $S$ are \emph{not} pairwise orthogonal. Which of the following is guaranteed?
choices:
- label: A
  text: There exists an orthonormal set of $k$ vectors whose span equals $\operatorname{span}(S)$.
- label: B
  text: There exist positive scalars $\alpha_i$ such that $\{\alpha_1\mathbf{v}_1, \ldots, \alpha_k\mathbf{v}_k\}$
    is orthonormal.
- label: C
  text: There exists an orthonormal basis for $V$ that contains every vector in $S$ (unmodified) as an
    element.
- label: D
  text: The set $S$ can be orthonormalized only after first extending it to a basis for all of $V$.
- label: E
  text: None of the above is guaranteed.
figures: []
answer:
  correct: A
  partial_credit: []
  verified: true
  verified_from:
  - quizzes-exams/2026-A/2030-Q2-SOLUTIONS.tex
