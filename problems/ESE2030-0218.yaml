  conflict: null
  explanation: |
    For complex eigenvalues $\alpha \pm i\beta$, the real basis solutions have the form $e^{\alpha t}\cos(\beta t)$ and $e^{\alpha t}\sin(\beta t)$. The real part $\alpha$ controls the rate of exponential growth or decay (the envelope), while the imaginary part $\beta$ controls the frequency of oscillation. These two roles are completely independent. In the modified system, $\alpha$ is unchanged, so the amplitude decay rate is identical. The imaginary part has doubled from $\beta$ to $2\beta$, so the oscillation frequency doubles. The solution form becomes $e^{\alpha t}\cos(2\beta t)$ and $e^{\alpha t}\sin(2\beta t)$: same exponential envelope, faster oscillations within it. The key conceptual point: $\alpha$ and $\beta$ enter the solution in completely separate places --- $\alpha$ in the exponential prefactor, $\beta$ inside the trigonometric functions. Changing one does not affect the other.
  key_insight: null
  distractor_rationale:
    C: |
      reverses which part does what; the imaginary part controls frequency, not decay rate. A student who selects this may be confusing the roles of $\alpha$ and $\beta$.
    A: |
      see partial credit note above; the ``farther from the origin'' reasoning is geometrically intuitive but wrong --- it's $\alpha$ alone, not $|\lambda|$, that governs decay.
    D: |
      invokes a plausible-sounding but fictitious ``conservation'' principle --- there is no energy trade-off between oscillation and decay. The real and imaginary parts act independently in the solution structure.
    B: |
      confuses the fact that we work with real basis solutions with the claim that the imaginary part is irrelevant. The imaginary part is essential: it determines the oscillation frequency even though the final solution is real-valued.
