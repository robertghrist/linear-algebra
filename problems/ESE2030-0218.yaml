statement: |
  A $2 \times 2$ real matrix $A$ has complex eigenvalues $\lambda = \alpha \pm i\beta$
  with $\alpha < 0$ and $\beta > 0$. The solution to $\dfrac{d\mathbf{x}}{dt} = A\mathbf{x}$
  exhibits oscillations whose amplitude decreases over time.
  Now consider a modified matrix $A'$ with eigenvalues $\lambda' = \alpha \pm 2i\beta$.
  Compared to the original system, solutions of $\dfrac{d\mathbf{x}}{dt} = A'\mathbf{x}$ will:
choices:
- label: A
  text: Oscillate at twice the frequency and also decay faster, since the eigenvalues are farther from
    the origin in the complex plane
- label: B
  text: Have identical behavior, since only the real part of the eigenvalue affects the solution of a
    real ODE
- label: C
  text: Oscillate at the same frequency but decay faster, since the eigenvalues have larger imaginary
    part
- label: D
  text: Oscillate at twice the frequency and decay at half the rate, since energy is transferred from
    decay into oscillation
- label: E
  text: Oscillate at twice the frequency with the same rate of amplitude decay
figures: []
answer:
  correct: E
  partial_credit:
  - A
  verified: true
  verified_from:
