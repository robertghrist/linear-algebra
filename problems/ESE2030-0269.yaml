statement: |
  Let $A \in \mathbb{R}^{n \times n}$ be a real symmetric matrix. The Spectral
  Theorem asserts a package of structural facts about $A$ that can each fail
  for a general (non-symmetric) real $n \times n$ matrix. Which of the
  following is GUARANTEED by the Spectral Theorem for symmetric $A$?
choices:
- label: A
  text: For every eigenvalue $\lambda$ of $A$, the geometric multiplicity of $\lambda$ equals its algebraic
    multiplicity.
- label: B
  text: All three of (A), (C), and (D) are guaranteed, and each can fail for some non-symmetric real matrix.
- label: C
  text: There exists an orthonormal basis of $\mathbb{R}^n$ consisting of eigenvectors of $A$.
- label: D
  text: Every eigenvalue of $A$ is real.
- label: E
  text: Only (C) and (D) are guaranteed; (A) can fail when $A$ has repeated eigenvalues.
figures: []
