  explanation: |
    The Spectral Theorem for real symmetric matrices asserts that $A = Q\Lambda Q^T$ where $Q$ is orthogonal (real) and $\Lambda$ is diagonal (real). Reading off the three guarantees: (A) Real eigenvalues: the diagonal entries of $\Lambda$ are real. (B) Full geometric multiplicity: the columns of $Q$ form a basis of $\mathbb{R}^n$, so the eigenspaces collectively span $\mathbb{R}^n$ --- equivalently, geometric multiplicity equals algebraic multiplicity for every eigenvalue (no Jordan obstruction). (C) Orthonormal eigenbasis: the columns of $Q$ are not just an eigenbasis but an orthonormal one. Each fails for some general real matrix: \begin{itemize} \item (A) fails for the rotation $\begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$, with eigenvalues $\pm i$. \item (B) fails for the Jordan block $\begin{pmatrix} 2 & 1 \\ 0 & 2 \end{pmatrix}$, with algebraic multiplicity $2$ and geometric multiplicity $1$ at $\lambda = 2$. \item (C) fails for $\begin{pmatrix} 1 & 1 \\ 0 & 2 \end{pmatrix}$: it has an eigenbasis $\{(1,0)^T, (1,1)^T\}$ --- so it is diagonalizable --- but no orthonormal eigenbasis. \end{itemize} All three statements are independently nontrivial guarantees, all three are simultaneously delivered by the Spectral Theorem, and (D) is the only choice that captures the full content along with the contrast. [Pedagogical note: (C) alone logically implies (A) and (B) --- if an orthonormal eigenbasis exists, then $A = Q\Lambda Q^T$ with real $Q$ forces real $\Lambda$, and the existence of an eigenbasis is exactly full geometric multiplicity. So (C) is the strongest single statement on the list. The reason (D) is still the best answer is that (D) names the contrast with general matrices --- the structural payoff of the theorem --- whereas (C) alone reads like a fact about a particular $A$. The Spectral Theorem's content is that \emph{symmetry forces this package}.]
  key_insight: null
  distractor_rationale:
    C: |
      the strongest single guarantee on the list, logically implying (A) and (B); a student who picked C has identified the most informative individual fact but missed the synthesis and the contrast with general matrices. One rung below (D).
    D: |
      captures the reality of the spectrum --- a genuine guarantee of the theorem, but the weakest of the three on its own. Real eigenvalues alone do not yield diagonalizability, let alone orthogonal diagonalizability. Two rungs below (D).
    A: |
      captures full geometric multiplicity --- equivalent to diagonalizability, a genuine guarantee, but does not address reality of the eigenvalues or orthogonality of the eigenbasis. Two rungs below (D); twin pair to (A).
    E: |
      D5 naive-prior: imports the Jordan-block intuition --- ``repeated eigenvalues can cause geometric multiplicity to fall short'' --- and applies it to symmetric matrices, where the Spectral Theorem precisely \emph{prevents} this. A student who picked E has correctly diagnosed the general behavior tested in P19 but failed to register that symmetry overrides it. The canonical Wk 8 vs. Wk 9 confusion: Jordan defects happen for general matrices, never for symmetric ones.
