statement: |
  Let $V$ be the set of all smooth functions $f: \mathbb{R} \to \mathbb{R}$ satisfying the differential equation $$d^2x/dt^2 + x = 0.$$ Every such solution $x(t)$ is a linear combination of $\sin(t)$ and $\cos(t)$. Under standard function addition and scalar multiplication, which statement is TRUE?
choices:
- label: A
  text: $V$ is not a vector space because it does not contain the zero function.
- label: B
  text: $V$ is a vector space of dimension 1.
- label: C
  text: $V$ is a vector space of dimension 2.
- label: D
  text: $V$ is a vector space of infinite dimension.
- label: E
  text: $V$ is not a vector space because $\sin$ and $\cos$ are not linear.
figures: []
answer:
  correct: C
  partial_credit:
  - B
  verified: true
  verified_from:
  - quizzes-exams/2026-A/2030-Q1-SOLUTIONS.tex
