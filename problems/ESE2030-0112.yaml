statement: |
  Four feature vectors $(X_1, X_2, X_3, X_4)$ are extracted from centered sensor data. The covariance and correlation matrices are:

  $$[\Sigma] = \begin{bmatrix}
  4 & 3 & -4.2 & 6.4 \\
  3 & 25 & -6 & -12 \\
  -4.2 & -6 & 9 & 1.2 \\
  6.4 & -12 & 1.2 & 16
  \end{bmatrix}
  \quad : \quad
  [R] = \begin{bmatrix}
  1.0 & 0.3 & -0.7 & 0.8 \\
  0.3 & 1.0 & -0.4 & -0.6 \\
  -0.7 & -0.4 & 1.0 & 0.1 \\
  0.8 & -0.6 & 0.1 & 1.0
  \end{bmatrix}$$

  Which pairs of feature vectors have directions within $30^\circ$ of being orthogonal?
choices:
- label: A
  text: $(X_1, X_3)$ and $(X_2, X_4)$
- label: B
  text: $(X_1, X_2)$ and $(X_3, X_4)$
- label: C
  text: $(X_2, X_3)$ only
- label: D
  text: $(X_1, X_3)$, $(X_2, X_3)$, and $(X_2, X_4)$
- label: E
  text: $(X_1, X_2)$, $(X_2, X_3)$, and $(X_3, X_4)$
