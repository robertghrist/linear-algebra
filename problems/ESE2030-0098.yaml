statement: |
  A centered data matrix $X \in \mathbb{R}^{n \times d}$ has SVD $X = U\Sigma V^T$ with singular values $\sigma_1 = 100, \sigma_2 = 50, \sigma_3 = 25, \ldots$ A researcher wants a 2-dimensional representation of the $n$ observations and considers two approaches:

  \textbf{Approach 1:} Compute the $n \times 2$ matrix $U_2\Sigma_2$, where $U_2$ contains the first 2 columns of $U$ and $\Sigma_2$ is the $2 \times 2$ upper-left block of $\Sigma$.

  \textbf{Approach 2:} Compute the $n \times 2$ matrix $XV_2$, where $V_2$ contains the first 2 columns of $V$ (i.e., project each observation onto the first two principal component directions).

  Which statement is most TRUE?
choices:
- label: A
  text: Both approaches give identical 2D representations since $U\Sigma = XV$.
- label: B
  text: Approach 1 gives the optimal rank-2 approximation to $X$ in Frobenius norm, while Approach 2 gives
    the 2D representation that maximizes captured variance, but these are different things.
- label: C
  text: 'The approaches yield different matrices: $U_2\Sigma_2 \neq XV_2$ because one uses left singular
    vectors and the other uses right singular vectors.'
- label: D
  text: Approach 1 produces vectors in $\mathbb{R}^n$ while Approach 2 produces vectors in $\mathbb{R}^d$,
    so they cannot be compared.
- label: E
  text: Both approaches produce the same $n \times 2$ matrix of 2D observation coordinates, and both optimally
    capture the variance structure in a 2D subspace.
figures: []
answer:
  correct: E
  partial_credit:
  - B
